<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily English Expressions – Flashcard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      --card-bg: #ffffff;
      --card-border: #86efac;
      --card-shadow: 0 8px 32px rgba(22,163,74,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --primary: #16a34a;
      --primary-light: #bbf7d0;
      --primary-dark: #15803d;
      --text-main: #1a1a1a;
      --text-sub: #6b7280;
      --hint-bg: #f0fdf4;
      --hint-border: #4ade80;
      --radius: 22px;
      --transition: .28s cubic-bezier(.4,0,.2,1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 12px 60px;
      color: var(--text-main);
    }

    #app {
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-family: 'Lora', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #14532d;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: -.01em;
    }

    .sub {
      text-align: center;
      color: var(--text-sub);
      font-size: .82rem;
      margin-bottom: 22px;
      font-weight: 400;
    }

    /* ── MODE TOGGLE ── */
    .mode-label {
      text-align: center;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .1em;
      color: var(--primary-dark);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .mode-switch {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .mode-switch input[type="radio"] { display: none; }

    .mode-switch label {
      cursor: pointer;
      padding: 10px 22px;
      border-radius: 50px;
      border: 2px solid #d1fae5;
      background: #f0fdf4;
      font-size: .9rem;
      font-weight: 500;
      color: #166534;
      transition: var(--transition);
      user-select: none;
      white-space: nowrap;
    }

    .mode-switch input[type="radio"]:checked + label {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #15803d;
      color: #fff;
      box-shadow: 0 4px 14px rgba(22,163,74,.35);
    }

    /* ── CATEGORY FILTER ── */
    .cat-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .cat-btn {
      padding: 5px 13px;
      border-radius: 50px;
      border: 2px solid transparent;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: .02em;
    }

    .cat-btn.active { color: #fff !important; box-shadow: 0 3px 10px rgba(0,0,0,.18); }

    .cat-ALL          { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .cat-ALL.active   { background: #475569 !important; border-color: #475569; }
    .cat-GREETINGS    { background: #ccfbf1; color: #0f766e; border-color: #99f6e4; }
    .cat-GREETINGS.active    { background: #0f766e !important; border-color: #0f766e; }
    .cat-PARTINGS     { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
    .cat-PARTINGS.active     { background: #1d4ed8 !important; border-color: #1d4ed8; }
    .cat-THANKS       { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .cat-THANKS.active       { background: #b45309 !important; border-color: #b45309; }
    .cat-EXCUSES      { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
    .cat-EXCUSES.active      { background: #dc2626 !important; border-color: #dc2626; }
    .cat-CONGRATULATIONS { background: #f3e8ff; color: #7c3aed; border-color: #ddd6fe; }
    .cat-CONGRATULATIONS.active { background: #7c3aed !important; border-color: #7c3aed; }
    .cat-REQUESTS     { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .cat-REQUESTS.active     { background: #15803d !important; border-color: #15803d; }
    .cat-INVITATION   { background: #fce7f3; color: #db2777; border-color: #fbcfe8; }
    .cat-INVITATION.active   { background: #db2777 !important; border-color: #db2777; }
    .cat-ASK_PERMISSION { background: #e0e7ff; color: #4338ca; border-color: #c7d2fe; }
    .cat-ASK_PERMISSION.active { background: #4338ca !important; border-color: #4338ca; }
    .cat-PROHIBIT     { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
    .cat-PROHIBIT.active     { background: #c2410c !important; border-color: #c2410c; }

    /* ── STATS ── */
    .stats-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .progress-bar-wrap {
      flex: 1;
      height: 8px;
      background: #d1fae5;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #16a34a);
      border-radius: 8px;
      transition: width .4s ease;
    }

    .stat-pill {
      padding: 3px 10px;
      border-radius: 50px;
      font-size: .72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .sp-count  { background: #e0f2fe; color: #0369a1; }
    .sp-ronde  { background: #fef9c3; color: #854d0e; }
    .sp-left   { background: #f1f5f9; color: #475569; }

    /* ── CARD ── */
    .card-wrap {
      perspective: 1200px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 2.5px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px 24px;
      cursor: default;
      position: relative;
      transition: box-shadow .2s;
    }

    .card-cat-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      padding: 3px 10px;
      border-radius: 50px;
      text-transform: uppercase;
      opacity: .82;
    }

    .card-num-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: .7rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .card-front-text {
      text-align: center;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .card-mode-hint {
      font-size: .72rem;
      color: #9ca3af;
      text-align: center;
      font-style: italic;
    }

    .card-answer {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1.5px dashed #bbf7d0;
    }

    .card-answer.visible { display: flex; }

    .answer-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .answer-text {
      text-align: center;
      font-weight: 500;
      color: #166534;
      line-height: 1.4;
    }

    /* ── HINT POPUP ── */
    .hint-popup {
      display: none;
      background: var(--hint-bg);
      border: 2px solid var(--hint-border);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 12px;
      text-align: center;
      animation: fadeIn .2s ease;
    }

    .hint-popup.visible { display: block; }

    .hint-popup p {
      font-size: .88rem;
      color: #166534;
      font-weight: 500;
    }

    .hint-popup .hint-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #4ade80;
      margin-bottom: 4px;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 50px;
      border: none;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .btn:active { transform: scale(.97); }

    .btn-reveal {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      box-shadow: 0 4px 14px rgba(22,163,74,.3);
      padding: 12px 32px;
      font-size: .95rem;
    }

    .btn-reveal:hover { box-shadow: 0 6px 20px rgba(22,163,74,.4); transform: translateY(-1px); }

    .btn-hint {
      background: #f0fdf4;
      color: #15803d;
      border: 2px solid #86efac;
    }

    .btn-hint:hover { background: #dcfce7; }

    /* ── RATING ── */
    .rating-row {
      display: none;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 4px;
      animation: fadeIn .25s ease;
    }

    .rating-row.visible { display: flex; }

    .rating-label {
      width: 100%;
      text-align: center;
      font-size: .75rem;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .btn-rate {
      padding: 9px 22px;
      border-radius: 50px;
      border: 2px solid transparent;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-belum  { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
    .btn-belum:hover { background: #dc2626; color: #fff; }
    .btn-hampir { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .btn-hampir:hover { background: #b45309; color: #fff; }
    .btn-paham  { background: #dcfce7; color: #15803d; border-color: #86efac; }
    .btn-paham:hover  { background: #15803d; color: #fff; }

    /* ── RESULT VIEW ── */
    #result-view {
      display: none;
      background: #fff;
      border: 2.5px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      padding: 28px;
      text-align: center;
    }

    #result-view h2 {
      font-family: 'Lora', serif;
      color: #14532d;
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    .result-stats {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .rs-pill {
      padding: 8px 18px;
      border-radius: 50px;
      font-size: .85rem;
      font-weight: 700;
    }

    .rs-paham  { background: #dcfce7; color: #15803d; }
    .rs-hampir { background: #fef3c7; color: #b45309; }
    .rs-belum  { background: #fee2e2; color: #dc2626; }

    .result-message { color: var(--text-sub); font-size: .9rem; margin-bottom: 20px; }

    .btn-next-ronde {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      box-shadow: 0 4px 14px rgba(22,163,74,.3);
      padding: 12px 28px;
      font-size: .95rem;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      margin: 4px;
      transition: var(--transition);
    }

    .btn-next-ronde:hover { box-shadow: 0 6px 20px rgba(22,163,74,.4); transform: translateY(-1px); }

    .btn-restart {
      background: #f1f5f9;
      color: #475569;
      padding: 11px 24px;
      font-size: .9rem;
      border-radius: 50px;
      border: 2px solid #cbd5e1;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      margin: 4px;
      transition: var(--transition);
    }

    .btn-restart:hover { background: #e2e8f0; }

    /* ── TROPHY ── */
    #trophy-view {
      display: none;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 2.5px solid #4ade80;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      padding: 40px 28px;
      text-align: center;
    }

    .trophy-icon { font-size: 4rem; margin-bottom: 12px; }

    #trophy-view h2 {
      font-family: 'Lora', serif;
      color: #14532d;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    #trophy-view p { color: #166534; margin-bottom: 20px; font-size: .95rem; }

    /* ── FLIP ANIMATION ── */
    .card.flip-anim {
      animation: flipCard .3s ease;
    }

    @keyframes flipCard {
      0%   { transform: rotateY(0deg); opacity: 1; }
      50%  { transform: rotateY(90deg); opacity: .3; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .cat-btn { font-size: .68rem; padding: 4px 10px; }
      .btn { font-size: .82rem; padding: 9px 18px; }
      .card { padding: 24px 18px 20px; min-height: 190px; }
    }
  </style>
</head>
