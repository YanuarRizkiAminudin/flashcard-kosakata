<script>
var V=[

// ══════════════════════════════════════════════
// P1 — BOTTOM LINE UP FRONT (Jeff Su)
// ══════════════════════════════════════════════
{cat:"P1",en:"Bottom line up front is a military communications principle that's designed to enforce speed and clarity in reports and emails.",id:"Bottom line up front adalah prinsip komunikasi militer yang dirancang untuk menegakkan kecepatan dan kejelasan dalam laporan dan email."},
{cat:"P1",en:"It was the single most important lesson I learned back in junior year during my summer internship.",id:"Itu adalah satu pelajaran terpenting yang saya pelajari saat tahun ketiga selama magang musim panas saya."},
{cat:"P1",en:"This communications principle helped me build credibility with clients, colleagues, and managers regardless of my tenure.",id:"Prinsip komunikasi ini membantu saya membangun kredibilitas dengan klien, rekan, dan manajer terlepas dari masa kerja saya."},
{cat:"P1",en:"Bottom line up front now goes by many other names: top-down communication, the pyramid principle, but the core concept has stayed the same.",id:"Bottom line up front kini dikenal dengan banyak nama lain: komunikasi top-down, prinsip piramida, tetapi konsep intinya tetap sama."},
{cat:"P1",en:"It's a style of communication that prioritizes results and outcomes over the process and the steps you took to get there.",id:"Ini adalah gaya komunikasi yang mengutamakan hasil dan capaian di atas proses dan langkah-langkah yang Anda ambil untuk sampai ke sana."},
{cat:"P1",en:"Employers have consistently rated effective communication as the number one soft skill they look for in their employees.",id:"Pemberi kerja secara konsisten menilai komunikasi efektif sebagai soft skill nomor satu yang mereka cari pada karyawan mereka."},
{cat:"P1",en:"When there is a breakdown in communication, often efficiency, morale, and objectives can all suffer.",id:"Ketika terjadi kegagalan komunikasi, sering kali efisiensi, moral, dan tujuan semuanya bisa terdampak."},
{cat:"P1",en:"Just think back to the last time you worked with a colleague who provided you with the exact information you needed with just enough background for you to act upon.",id:"Cukup ingat kembali terakhir kali Anda bekerja dengan rekan yang memberi Anda informasi tepat yang Anda butuhkan dengan latar belakang yang cukup untuk Anda tindaklanjuti."},
{cat:"P1",en:"They have proven they're respectful of your time by providing you with only relevant information while leaving out all that needless fluff.",id:"Mereka telah membuktikan bahwa mereka menghargai waktu Anda dengan hanya memberikan informasi yang relevan sambil meninggalkan semua hal yang tidak perlu."},
{cat:"P1",en:"As a product marketer working on four to five campaigns at any given time, I need to be very efficient in my communications with the sales, product, and marketing teams in order to keep myself sane.",id:"Sebagai pemasar produk yang mengerjakan empat hingga lima kampanye sekaligus, saya perlu sangat efisien dalam komunikasi saya dengan tim penjualan, produk, dan pemasaran agar tetap waras."},
{cat:"P1",en:"There's a popular question often asked in the middle of consulting case interviews where the interviewer interrupts your analysis and says something like, 'Hey, the senior partner just walked into the room and asked how the project's going. What do you say?'",id:"Ada pertanyaan populer yang sering ditanyakan di tengah wawancara kasus konsultan di mana pewawancara menyela analisis Anda dan berkata seperti, 'Hei, senior partner baru saja masuk ke ruangan dan bertanya bagaimana proyek berjalan. Apa yang Anda katakan?'"},
{cat:"P1",en:"The idea, of course, is to see how well you can summarize all the information you've gathered so far and present them in an efficient way.",id:"Idenya, tentu saja, adalah untuk melihat seberapa baik Anda dapat merangkum semua informasi yang telah Anda kumpulkan sejauh ini dan menyajikannya dengan cara yang efisien."},
{cat:"P1",en:"Let's say you're the marketing manager of the iMac portion of a recent Apple product launch event.",id:"Katakanlah Anda adalah manajer pemasaran untuk bagian iMac dari acara peluncuran produk Apple baru-baru ini."},
{cat:"P1",en:"Your director pings you while she is in a meeting with other senior stakeholders and she needs a quick status update.",id:"Direktur Anda menghubungi Anda saat dia sedang rapat dengan pemangku kepentingan senior lainnya dan dia membutuhkan pembaruan status yang cepat."},
{cat:"P1",en:"Hi Isabel, so we ran into some shipping issues and I had to get approval to pay an additional $10,000 for overnight FedEx and that took a while to sort out.",id:"Hai Isabel, jadi kami mengalami beberapa masalah pengiriman dan saya harus mendapat persetujuan untuk membayar tambahan $10.000 untuk FedEx semalam dan itu butuh waktu untuk diselesaikan."},
{cat:"P1",en:"I was also told by the AirTags team that they needed to go before us so there was nothing I could do about that.",id:"Saya juga diberitahu oleh tim AirTags bahwa mereka perlu tampil sebelum kami sehingga tidak ada yang bisa saya lakukan tentang hal itu."},
{cat:"P1",en:"But I think overall the creative agency is on track now that we have received the blue iMacs so you can review the final draft of the video by April 1st.",id:"Tapi saya pikir secara keseluruhan agensi kreatif sudah on track sekarang setelah kami menerima iMac biru sehingga Anda dapat meninjau draf akhir video pada 1 April."},
{cat:"P1",en:"Hi Isabel, overall we're currently on schedule to have the final draft of the video for your review by April 1st.",id:"Hai Isabel, secara keseluruhan kami saat ini sesuai jadwal untuk memiliki draf akhir video untuk ditinjau pada 1 April."},
{cat:"P1",en:"Our shipping cost increased by $10,000 because we had to overnight the blue iMacs or they would have been late.",id:"Biaya pengiriman kami meningkat $10.000 karena kami harus mengirim iMac biru semalaman atau mereka akan terlambat."},
{cat:"P1",en:"Our slot got pushed back behind the AirTags announcement. I would need your help to escalate this issue if we want our original slot back.",id:"Slot kami didorong ke belakang pengumuman AirTags. Saya perlu bantuan Anda untuk mengeskalasi masalah ini jika kita ingin slot asli kita kembali."},
{cat:"P1",en:"After reviewing the final draft of the video, we can submit to the PR team for distribution.",id:"Setelah meninjau draf akhir video, kita dapat mengirimkan ke tim PR untuk distribusi."},
{cat:"P1",en:"Example one is very process-oriented. You first did this, then that happened, then you had to go fix that. Oh, and finally, here's the result.",id:"Contoh pertama sangat berorientasi proses. Anda pertama melakukan ini, lalu itu terjadi, lalu Anda harus pergi memperbaiki itu. Oh, dan akhirnya, inilah hasilnya."},
{cat:"P1",en:"Example two adheres more to the bottom line up front principle by prioritizing the one thing that director cares most about.",id:"Contoh kedua lebih mengikuti prinsip bottom line up front dengan mengutamakan satu hal yang paling diperhatikan direktur."},
{cat:"P1",en:"If your director only had a few seconds to skim your reply and respond to Tim Cook, she'll be able to confidently say the final draft of the iMac video can be reviewed by April 1st.",id:"Jika direktur Anda hanya punya beberapa detik untuk membaca sekilas balasan Anda dan merespons Tim Cook, dia akan bisa dengan percaya diri mengatakan draf akhir video iMac dapat ditinjau pada 1 April."},
{cat:"P1",en:"Practice makes perfect and there is one method you can incorporate immediately into your daily lives.",id:"Latihan membuat sempurna dan ada satu metode yang bisa Anda masukkan segera ke dalam kehidupan sehari-hari Anda."},
{cat:"P1",en:"The next time you ask your teammate or colleague about a project they're working on, listen to how they present it to you, then summarize using the bottom-line upfront principle.",id:"Lain kali Anda bertanya kepada rekan tim atau kolega tentang proyek yang sedang mereka kerjakan, dengarkan bagaimana mereka mempresentasikannya kepada Anda, lalu buat rangkuman menggunakan prinsip bottom-line upfront."},
{cat:"P1",en:"The tentative launch date for the Tesla Roadster is 2050 because number one, we have yet to start production on the vibranium wheels, number two, we still have yet to decide on the colors, and finally, we're pending approval from the EPA.",id:"Tanggal peluncuran tentatif untuk Tesla Roadster adalah 2050 karena pertama, kita belum mulai produksi roda vibranium, kedua, kita masih belum memutuskan warnanya, dan terakhir, kita menunggu persetujuan dari EPA."},
{cat:"P1",en:"The great thing about active listening is that you can practice by flipping it around.",id:"Hal bagus tentang mendengarkan aktif adalah Anda bisa berlatih dengan membaliknya."},
{cat:"P1",en:"I'm having a rough day. First, I had back-to-back meetings this morning and a big presentation this afternoon. Second, I didn't get to eat lunch because I was so busy. And finally, I didn't get much sleep last night because I was so anxious about today.",id:"Saya sedang mengalami hari yang berat. Pertama, saya punya rapat berturut-turut pagi ini dan presentasi besar sore ini. Kedua, saya tidak sempat makan siang karena sangat sibuk. Dan terakhir, saya tidak banyak tidur semalam karena sangat cemas tentang hari ini."},
{cat:"P1",en:"It might start off a bit awkward, but like anything else, the more you practice, the more natural this will feel.",id:"Ini mungkin terasa sedikit canggung di awal, tapi seperti hal lainnya, semakin banyak Anda berlatih, semakin alami rasanya."},
{cat:"P1",en:"By adopting this bottom-line-up-front style of communication at work, you by default show that you're respectful of your colleagues' time.",id:"Dengan mengadopsi gaya komunikasi bottom-line-up-front di tempat kerja, secara otomatis Anda menunjukkan bahwa Anda menghargai waktu rekan-rekan Anda."},
{cat:"P1",en:"Consciously or unconsciously, they will appreciate you for it.",id:"Secara sadar atau tidak sadar, mereka akan menghargai Anda karenanya."},

// ══════════════════════════════════════════════
// P2 — 3-2-1 FRAMEWORK (Vin Jang)
// ══════════════════════════════════════════════
{cat:"P2",en:"How do you train your brain to be able to think faster when you're being put on the spot?",id:"Bagaimana Anda melatih otak Anda untuk bisa berpikir lebih cepat ketika Anda tiba-tiba ditanya?"},
{cat:"P2",en:"When someone asks you a question and you're not prepared, what happens? Your brain hits the panic button.",id:"Ketika seseorang mengajukan pertanyaan kepada Anda dan Anda tidak siap, apa yang terjadi? Otak Anda menekan tombol panik."},
{cat:"P2",en:"You open a dozen browser tabs in your head trying to scramble for what to say.",id:"Anda membuka selusin tab browser di kepala Anda sambil berusaha mencari apa yang harus dikatakan."},
{cat:"P2",en:"As you start verbalizing your thoughts, it causes you to ramble instead of speaking clear points.",id:"Saat Anda mulai mengucapkan pikiran Anda, itu menyebabkan Anda berbicara melantur alih-alih menyampaikan poin yang jelas."},
{cat:"P2",en:"This can be extremely frustrating and sometimes even embarrassing.",id:"Ini bisa sangat membuat frustrasi dan terkadang bahkan memalukan."},
{cat:"P2",en:"It makes you feel incompetent and it makes you look like you're not confident.",id:"Itu membuat Anda merasa tidak kompeten dan membuat Anda terlihat tidak percaya diri."},
{cat:"P2",en:"With prepared content, I'm much more confident. If I have to speak off the cuff, a lot less confident.",id:"Dengan konten yang sudah disiapkan, saya jauh lebih percaya diri. Jika saya harus berbicara spontan, jauh kurang percaya diri."},
{cat:"P2",en:"If someone asks you a question and you're not prepared, then what do you fall back on? Generally rambling.",id:"Jika seseorang mengajukan pertanyaan kepada Anda dan Anda tidak siap, lalu apa yang Anda andalkan? Umumnya melantur."},
{cat:"P2",en:"This is where frameworks are important. When you got a framework, you fall back on the framework instead.",id:"Di sinilah kerangka kerja menjadi penting. Ketika Anda punya kerangka kerja, Anda mengandalkan kerangka kerja itu."},
{cat:"P2",en:"3 2 1 means three steps, two types, and the one thing.",id:"3 2 1 berarti tiga langkah, dua jenis, dan satu hal."},
{cat:"P2",en:"I use this for social media content. I use this to do Q&A. I use this when I have very little time to prep.",id:"Saya menggunakan ini untuk konten media sosial. Saya menggunakan ini untuk Q&A. Saya menggunakan ini ketika saya punya sangat sedikit waktu untuk mempersiapkan diri."},
{cat:"P2",en:"The one thing about avocados is it's incredible on a keto diet. It's just fantastic. I love eating avocados and it's such a high protein source.",id:"Satu hal tentang alpukat adalah ia luar biasa dalam diet keto. Ini sungguh fantastis. Saya suka makan alpukat dan itu sumber protein yang sangat tinggi."},
{cat:"P2",en:"That's what your brain does. And when your brain does that, you go blank.",id:"Itulah yang dilakukan otak Anda. Dan ketika otak Anda melakukan itu, Anda menjadi blank."},
{cat:"P2",en:"There are two ways to have an avocado. You can smash it on toast or you can eat it like a fruit.",id:"Ada dua cara menikmati alpukat. Anda bisa menghaluskannya di atas roti panggang atau Anda bisa memakannya seperti buah."},
{cat:"P2",en:"Three steps on how to prepare avocado. First step, cut it in half and get the skin off. Step two, mash it. Step three, salt and pepper and lemon.",id:"Tiga langkah cara menyiapkan alpukat. Langkah pertama, potong menjadi dua dan kupas kulitnya. Langkah kedua, haluskan. Langkah ketiga, garam dan merica dan lemon."},
{cat:"P2",en:"You don't have to do all three. You just pick one.",id:"Anda tidak harus melakukan ketiganya. Anda cukup memilih satu."},
{cat:"P2",en:"I'm going to give you the random topic and I want you to formulate your answer in 3 seconds.",id:"Saya akan memberi Anda topik acak dan saya ingin Anda merumuskan jawaban Anda dalam 3 detik."},
{cat:"P2",en:"The one thing about travel is it's magnificent. You can go anywhere you want.",id:"Satu hal tentang perjalanan adalah ia luar biasa. Anda bisa pergi ke mana saja yang Anda inginkan."},
{cat:"P2",en:"Two types of travel: you can travel regionally and you can travel internationally via a plane.",id:"Dua jenis perjalanan: Anda bisa bepergian secara regional dan Anda bisa bepergian secara internasional dengan pesawat."},
{cat:"P2",en:"Three steps to travel: plan it, book it, go.",id:"Tiga langkah untuk bepergian: rencanakan, pesan, pergi."},
{cat:"P2",en:"When we don't have frameworks, our brains just go to, 'Oh my god, what do you mean travel? I hate travel.'",id:"Ketika kita tidak punya kerangka kerja, otak kita langsung berkata, 'Oh ya Tuhan, apa maksudnya perjalanan? Saya benci perjalanan.'"},
{cat:"P2",en:"That's the difference between being prepared with a framework because now you're excited to communicate.",id:"Itulah perbedaannya antara siap dengan kerangka kerja karena sekarang Anda bersemangat untuk berkomunikasi."},
{cat:"P2",en:"When you're not prepared, you're not excited. You're scared. You don't want to communicate.",id:"Ketika Anda tidak siap, Anda tidak bersemangat. Anda takut. Anda tidak ingin berkomunikasi."},
{cat:"P2",en:"You leaned into it. Your body language showed it — you came into the mic, you walked towards me because you felt ready.",id:"Anda bersandar ke sana. Bahasa tubuh Anda menunjukkannya — Anda mendekati mikrofon, Anda berjalan ke arah saya karena Anda merasa siap."},
{cat:"P2",en:"When you fall back on a framework, it just makes things simpler.",id:"Ketika Anda mengandalkan kerangka kerja, itu hanya membuat segalanya lebih sederhana."}

// P3–P7 akan ditambahkan setelah video dikirim
];

var CAT_CFG={
  P1:{label:"P1 · BLUF",bg:"#dbeafe",fg:"#1d4ed8",acc:"linear-gradient(90deg,#2563eb,#7c3aed)"},
  P2:{label:"P2 · 3-2-1",bg:"#d1fae5",fg:"#065f46",acc:"linear-gradient(90deg,#059669,#2563eb)"},
  P3:{label:"P3",bg:"#fee2e2",fg:"#b91c1c",acc:"linear-gradient(90deg,#dc2626,#d97706)"},
  P4:{label:"P4",bg:"#fef3c7",fg:"#92400e",acc:"linear-gradient(90deg,#d97706,#059669)"},
  P5:{label:"P5",bg:"#f3e8ff",fg:"#6d28d9",acc:"linear-gradient(90deg,#7c3aed,#2563eb)"},
  P6:{label:"P6",bg:"#cffafe",fg:"#0e7490",acc:"linear-gradient(90deg,#0891b2,#059669)"},
  P7:{label:"P7",bg:"#fce7f3",fg:"#9d174d",acc:"linear-gradient(90deg,#be185d,#7c3aed)"}
};

var curCat="ALL",deck=[],idx=0,ronde=1,cp=0,ch=0,cbv=0,rev=false,toRev=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}
function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}
function getFiltered(){
  if(curCat==="ALL") return V.slice();
  return V.filter(function(c){return c.cat===curCat;});
}
function fullRestart(){
  var src=getFiltered();
  if(src.length===0){
    document.getElementById("sub-lbl").textContent="Video ini belum tersedia — kirim transcriptnya!";
    return;
  }
  deck=shuffle(src);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua video":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" kalimat";
  document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Ronde "+ronde;
  upStats();showCard();
}
function nextRonde(){ronde++;deck=shuffle(toRev);cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("rb").textContent="Ronde "+ronde;upStats();showCard();}
function showCard(){
  rev=false;var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.P1;
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  var ctb=document.getElementById("ctb");ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;
  document.getElementById("en-disp").textContent=c.en;
  document.getElementById("ans-id-txt").textContent=c.id;
  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}
function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}
function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}
function upStats(){document.getElementById("sp").textContent=cp;document.getElementById("sh").textContent=ch;document.getElementById("sb").textContent=cbv;}
function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;document.getElementById("rh").textContent=ch;document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🎉":pct>=70?"😊":pct>=50?"😐":"💪";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" kartu tersisa.":pct>=70?"Bagus! "+toRev.length+" kartu perlu diulang.":pct>=50?"Lumayan! Ulangi "+toRev.length+" kartu.":"Semangat! "+toRev.length+" kartu menunggumu.";
  document.getElementById("nb").textContent="Lanjut Ronde "+(ronde+1)+" → "+toRev.length+" kartu";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return (b._b||0)-(a._b||0);});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-en'>"+v.en.substring(0,65)+"…</span>"+score;
      rl.appendChild(d);
    });
  }
  document.getElementById("rlw").style.display="";
}
ronde=1;fullRestart();
</script>
</body>
</html>
