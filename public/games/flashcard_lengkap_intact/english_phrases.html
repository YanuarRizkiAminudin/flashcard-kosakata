var CATS=[
  {key:"ALL",label:"Semua"},
  {key:"GREET",label:"Greetings"},
  {key:"PART",label:"Partings"},
  {key:"THANK",label:"Thanks"},
  {key:"EXCUSE",label:"Excuses"},
  {key:"CONGRAT",label:"Congratulations"},
  {key:"REQ",label:"Request"},
  {key:"INVITE",label:"Invitation"},
  {key:"PERM",label:"Permission"},
  {key:"PROHIB",label:"Prohibit"}
];
var curCat="ALL", curMode="en";
var deck=[], idx=0, ronde=1, cp=0, ch=0, cbv=0, rev=false, toRev=[];

function catLabel(k){for(var i=0;i<CATS.length;i++)if(CATS[i].key===k)return CATS[i].label;return k;}
function getQ(c){return curMode==="en"?c.en:c.id;}
function getA(c){return curMode==="en"?c.id:c.en;}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function getFiltered(){return curCat==="ALL"?V.slice():V.filter(function(c){return c.cat===curCat;});}

function setMode(m){
  curMode=m;
  document.getElementById("ml-en").className="ml"+(m==="en"?" on":"");
  document.getElementById("ml-id").className="ml"+(m==="id"?" on":"");
  fullRestart();
}

function setCat(k){
  curCat=k;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+k+"')")b.classList.add("on");});
  fullRestart();
}

function buildFilters(){
  var el=document.getElementById("filters");
  el.innerHTML="";
  CATS.forEach(function(c){
    var btn=document.createElement("button");
    btn.className="fb"+(c.key===curCat?" on":"");
    btn.setAttribute("onclick","setCat('"+c.key+"')");
    btn.textContent=c.label;
    el.appendChild(btn);
  });
}

function fullRestart(){
  ronde=1;
  deck=shuffle(getFiltered());
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  document.getElementById("qv").style.display="";
  document.getElementById("rv").style.display="none";
  document.getElementById("fv").style.display="none";
  buildFilters();
  showCard();
}

function showCard(){
  if(idx>=deck.length){showResult();return;}
  rev=false;
  var c=deck[idx];
  document.getElementById("cat-lbl").textContent=catLabel(c.cat);
  document.getElementById("phrase").textContent=getQ(c);
  document.getElementById("answer").textContent=getA(c);
  document.getElementById("answer").style.display="none";
  document.getElementById("tap-hint").style.display="";
  document.getElementById("btns").style.display="none";
  document.getElementById("prog").textContent=(idx+1)+"/"+deck.length+" — Ronde "+ronde;
}

function reveal(){
  if(rev)return;rev=true;
  document.getElementById("answer").style.display="block";
  document.getElementById("tap-hint").style.display="none";
  document.getElementById("btns").style.display="flex";
}

function showHint(){
  if(rev)return;
  var c=deck[idx];
  var words=getA(c).split(" ");
  alert("Hint: "+words.slice(0,3).join(" ")+(words.length>3?"...":""));
}

function rate(r){
  if(r===2)cp++;
  else if(r===1){ch++;toRev.push(deck[idx]);}
  else{cbv++;toRev.push(deck[idx]);}
  idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}

function showResult(){
  document.getElementById("qv").style.display="none";
  document.getElementById("rv").style.display="block";
  document.getElementById("rp").textContent=cp;
  document.getElementById("rh").textContent=ch;
  document.getElementById("rbb").textContent=cbv;
  var pct=deck.length>0?Math.round(cp/deck.length*100):0;
  document.getElementById("ri").textContent=pct>=90?"??":pct>=70?"??":pct>=50?"??":"??";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=cp+" paham dari "+deck.length+" kartu.";
  var nb=document.getElementById("next-btn");
  if(toRev.length===0){nb.style.display="none";}
  else{nb.style.display="";nb.textContent="Ulangi "+toRev.length+" kartu ?";}
}

function nextRonde(){
  if(toRev.length===0){showFinal();return;}
  ronde++;
  deck=shuffle(toRev);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  document.getElementById("qv").style.display="";
  document.getElementById("rv").style.display="none";
  showCard();
}

function showFinal(){
  document.getElementById("rv").style.display="none";
  document.getElementById("fv").style.display="block";
}

// Init
buildFilters();
fullRestart();
</script>
</body>
</html>
