<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Phrases Flashcard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#f8faff 0%,#f0fdf4 100%);min-height:100vh;padding:16px}
#app{max-width:520px;margin:0 auto}
h1{text-align:center;font-size:22px;font-weight:700;color:#1e3a5f;margin-bottom:4px;letter-spacing:-.3px}
.sub{text-align:center;font-size:12px;color:#6b7a99;margin-bottom:14px}
.mode-wrap{margin-bottom:12px;text-align:center}
.mode-lbl{font-size:10px;font-weight:700;letter-spacing:.8px;color:#6b7a99;text-transform:uppercase;margin-bottom:6px}
.mode-sw{display:flex;gap:8px}
.mode-sw label{flex:1;padding:10px 8px;border-radius:14px;border:2px solid #dde3f0;background:#fff;cursor:pointer;text-align:center;font-size:12px;font-weight:700;color:#6b7a99;transition:all .2s;line-height:1.4}
.mode-sw label span{font-size:10px;font-weight:400;display:block;margin-top:2px}
.mode-sw input[type=radio]{display:none}
.mode-sw input[type=radio]:checked+label{background:linear-gradient(135deg,#2563eb,#059669);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(37,99,235,.25)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;justify-content:center}
.filters button{padding:5px 10px;border-radius:20px;border:1.5px solid #dde3f0;background:#fff;font-size:11px;font-weight:600;color:#6b7a99;cursor:pointer;transition:all .2s}
.filters button.active{background:#2563eb;color:#fff;border-color:#2563eb}
.progress{margin-bottom:10px}
.prog-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;background:linear-gradient(90deg,#2563eb,#059669);border-radius:3px;transition:width .4s}
.prog-info{display:flex;justify-content:space-between;font-size:11px;color:#6b7a99}
.card-wrap{perspective:800px;margin-bottom:14px;cursor:pointer;min-height:220px;}
.card{position:relative;width:100%;height:220px;border-radius:20px;transform-style:preserve-3d;transition:transform .5s;box-shadow:0 4px 24px rgba(37,99,235,.10)}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;text-align:center}
.card-front{background:#fff;border:2px solid #e8edf8}
.card-back{background:linear-gradient(135deg,#f0f7ff,#f0fdf4);border:2px solid #bfdbfe;transform:rotateY(180deg)}
.cat-badge{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#2563eb;background:#eff6ff;padding:3px 10px;border-radius:10px;margin-bottom:14px}
.card-phrase{font-family:Lora,serif;font-style:italic;font-size:22px;font-weight:600;color:#1e3a5f;line-height:1.45}
.card-tap{font-size:11px;color:#a0aec0;margin-top:14px}
.card-lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#059669;margin-bottom:10px}
.card-answer{font-family:Lora,serif;font-style:italic;font-size:20px;font-weight:600;color:#1e3a5f;line-height:1.45;margin-bottom:8px}
.card-orig{font-size:13px;color:#6b7a99;margin-top:8px;font-style:normal}
.hint-box{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:8px 14px;font-size:13px;color:#92400e;margin-top:10px;display:none}
.controls{display:flex;gap:8px;margin-bottom:14px;align-items:center;justify-content:center}
.btn-hint{padding:8px 16px;border-radius:12px;border:1.5px solid #fcd34d;background:#fffbeb;font-size:12px;font-weight:600;color:#92400e;cursor:pointer;transition:all .2s}
.btn-hint:hover{background:#fef3c7}
.rating{display:none;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}
.rating button{flex:1;min-width:90px;max-width:140px;padding:10px 6px;border-radius:14px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-belum{background:#fee2e2;color:#dc2626}
.btn-belum:hover{background:#fecaca}
.btn-hampir{background:#fef3c7;color:#d97706}
.btn-hampir:hover{background:#fde68a}
.btn-paham{background:#dcfce7;color:#16a34a}
.btn-paham:hover{background:#bbf7d0}
.result-screen,.final-screen{display:none;text-align:center;background:#fff;border-radius:20px;padding:28px 20px;box-shadow:0 4px 24px rgba(37,99,235,.10)}
.result-screen h2,.final-screen h2{font-size:20px;font-weight:700;color:#1e3a5f;margin-bottom:8px}
.result-grid{display:flex;gap:10px;justify-content:center;margin:16px 0}
.res-box{flex:1;max-width:100px;padding:12px 8px;border-radius:14px;text-align:center}
.res-box .num{font-size:26px;font-weight:700;margin-bottom:2px}
.res-box .lbl{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.rb-belum{background:#fee2e2;color:#dc2626}
.rb-hampir{background:#fef3c7;color:#d97706}
.rb-paham{background:#dcfce7;color:#16a34a}
.btn-next-ronde,.btn-finish{padding:12px 28px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin:6px;transition:all .2s}
.btn-next-ronde{background:linear-gradient(135deg,#2563eb,#059669);color:#fff;box-shadow:0 3px 12px rgba(37,99,235,.25)}
.btn-next-ronde:hover{opacity:.9}
.btn-finish{background:#f1f5f9;color:#64748b}
.btn-finish:hover{background:#e2e8f0}
.final-emoji{font-size:52px;margin-bottom:10px}
.final-msg{font-size:15px;color:#6b7a99;margin-bottom:20px}
.btn-restart{padding:12px 32px;border-radius:14px;border:none;background:linear-gradient(135deg,#2563eb,#059669);color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(37,99,235,.25)}
.btn-restart:hover{opacity:.9}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <h1>&#x1F4AC; English Phrases</h1>
  <div class="sub" id="sub-lbl">Flashcard Frasa Bahasa Inggris</div>

  <div class="mode-wrap">
    <div class="mode-lbl">MODE TEBAK</div>
    <div class="mode-sw">
      <input type="radio" name="mode" id="men" value="en" checked>
      <label for="men">&#x1F1EC;&#x1F1E7; &rarr; &#x1F1EE;&#x1F1E9;<br><span>Lihat Inggris, tebak Indonesia</span></label>
      <input type="radio" name="mode" id="mid" value="id">
      <label for="mid">&#x1F1EE;&#x1F1E9; &rarr; &#x1F1EC;&#x1F1E7;<br><span>Lihat Indonesia, tebak Inggris</span></label>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div id="quiz-view">
    <div class="progress">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-info">
        <span id="prog-text">0 / 0</span>
        <span id="ronde-text">Ronde 1</span>
      </div>
    </div>

    <div class="card-wrap" id="card-wrap" onclick="reveal()">
      <div class="card" id="card" style="min-height:200px">
        <div class="card-face card-front" style="min-height:200px">
          <div class="cat-badge" id="cat-badge"></div>
          <div class="card-phrase" id="card-phrase"></div>
          <div class="card-tap">&#x1F447; Tap untuk lihat jawaban</div>
        </div>
        <div class="card-face card-back" style="min-height:200px">
          <div class="card-lbl" id="card-lbl">JAWABAN</div>
          <div class="card-answer" id="card-answer"></div>
          <div class="card-orig" id="card-orig"></div>
          <div class="hint-box" id="hint-box"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-hint" onclick="showHint()">&#x1F4A1; Hint</button>
    </div>

    <div class="rating" id="rating" style="display:none">
      <button class="btn-belum" onclick="rate(0)">&#x274C; Belum</button>
      <button class="btn-hampir" onclick="rate(1)">&#x1F7E1; Hampir</button>
      <button class="btn-paham" onclick="rate(2)">&#x2705; Paham</button>
    </div>
  </div>

  <div class="result-screen" id="result-screen">
    <h2>&#x1F4CA; Hasil Ronde</h2>
    <p id="result-msg" style="font-size:13px;color:#6b7a99;margin-bottom:4px"></p>
    <div class="result-grid">
      <div class="res-box rb-belum"><div class="num" id="r-belum">0</div><div class="lbl">Belum</div></div>
      <div class="res-box rb-hampir"><div class="num" id="r-hampir">0</div><div class="lbl">Hampir</div></div>
      <div class="res-box rb-paham"><div class="num" id="r-paham">0</div><div class="lbl">Paham</div></div>
    </div>
    <button class="btn-next-ronde" onclick="nextRonde()">Ulangi yang Belum &amp; Hampir &#x27A1;</button>
    <button class="btn-finish" onclick="showFinal()">Selesai &#x1F3C1;</button>
  </div>

  <div class="final-screen" id="final-screen">
    <div class="final-emoji">&#x1F3C6;</div>
    <h2>Luar Biasa!</h2>
    <div class="final-msg" id="final-msg"></div>
    <button class="btn-restart" onclick="restart()">&#x1F504; Mulai Lagi</button>
  </div>
</div>

// ---- CATEGORY CONFIG ----
var CATS=[
  {key:"ALL",  label:"Semua"},
  {key:"GREET",label:"Greetings"},
  {key:"PART", label:"Partings"},
  {key:"THANK",label:"Thanks"},
  {key:"EXCUSE",label:"Excuses"},
  {key:"CONGRAT",label:"Congratulations"},
  {key:"REQ",  label:"Request"},
  {key:"INVITE",label:"Invitation"},
  {key:"PERM", label:"Permission"},
  {key:"PROHIB",label:"Prohibit"}
];

// ---- STATE ----
var curCat="ALL";
var deck=[];
var idx=0;
var ronde=1;
var ratings=[];
var revealed=false;
var hintShown=false;

function getMode(){
  return document.querySelector('input[name=mode]:checked').value;
}

function getFilteredCards(){
  if(curCat==="ALL") return V.slice();
  return V.filter(function(c){return c.cat===curCat;});
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}

function getAnswer(c){
  return getMode()==="en" ? c.id : c.en;
}

function getQuestion(c){
  return getMode()==="en" ? c.en : c.id;
}

function catLabel(cat){
  for(var i=0;i<CATS.length;i++) if(CATS[i].key===cat) return CATS[i].label;
  return cat;
}

function updateSub(){
  var total=getFilteredCards().length;
  var label=curCat==="ALL"?"Semua Kategori":catLabel(curCat);
  document.getElementById("sub-lbl").textContent=label+" \u2022 "+total+" frasa";
}

function buildFilters(){
  var el=document.getElementById("filters");
  el.innerHTML="";
  CATS.forEach(function(c){
    var btn=document.createElement("button");
    btn.textContent=c.label;
    btn.className=c.key===curCat?"active":"";
    btn.onclick=function(){setCat(c.key);};
    el.appendChild(btn);
  });
}

function setCat(c){
  curCat=c;
  buildFilters();
  updateSub();
  startQuiz();
}

function startQuiz(){
  deck=shuffle(getFilteredCards());
  idx=0;
  ronde=1;
  ratings=new Array(deck.length).fill(-1);
  showQuizView();
  showCard();
}

function showQuizView(){
  document.getElementById("quiz-view").style.display="";
  document.getElementById("result-screen").style.display="none";
  document.getElementById("final-screen").style.display="none";
}

function showCard(){
  if(idx>=deck.length){showResult();return;}
  revealed=false;
  hintShown=false;
  var c=deck[idx];
  var card=document.getElementById("card");
  card.style.transition="none";
  card.classList.remove("flipped");
  setTimeout(function(){card.style.transition="";},20);
  document.getElementById("cat-badge").textContent=catLabel(c.cat);
  document.getElementById("card-phrase").textContent=getQuestion(c);
  var ansLbl=getMode()==="en"?"TERJEMAHAN INDONESIA":"TERJEMAHAN INGGRIS";
  document.getElementById("card-lbl").textContent=ansLbl;
  document.getElementById("card-answer").textContent=getAnswer(c);
  document.getElementById("card-orig").textContent="\u2014 "+getQuestion(c);
  document.getElementById("hint-box").style.display="none";
  document.getElementById("hint-box").textContent="";
  document.getElementById("rating").style.display="none";
  updateProgress();
}

function reveal(){
  if(revealed) return;
  revealed=true;
  document.getElementById("card").classList.add("flipped");
  setTimeout(function(){
    document.getElementById("rating").style.display="flex";
  },300);
}

function showHint(){
  if(revealed) return;
  var c=deck[idx];
  var ans=getAnswer(c);
  var words=ans.split(" ");
  var hint=words.slice(0,3).join(" ")+(words.length>3?"...":"");
  var hb=document.getElementById("hint-box");
  hb.textContent="\u1F4A1 Hint: "+hint;
  hb.style.display="block";
  hintShown=true;
}

function rate(score){
  ratings[idx]=score;
  idx++;
  showCard();
}

function updateProgress(){
  var total=deck.length;
  var done=idx;
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-text").textContent=done+" / "+total;
  document.getElementById("ronde-text").textContent="Ronde "+ronde;
}

function showResult(){
  document.getElementById("quiz-view").style.display="none";
  document.getElementById("result-screen").style.display="";
  var belum=ratings.filter(function(r){return r===0;}).length;
  var hampir=ratings.filter(function(r){return r===1;}).length;
  var paham=ratings.filter(function(r){return r===2;}).length;
  document.getElementById("r-belum").textContent=belum;
  document.getElementById("r-hampir").textContent=hampir;
  document.getElementById("r-paham").textContent=paham;
  document.getElementById("result-msg").textContent="Ronde "+ronde+" selesai! Total: "+deck.length+" kartu";
  var repeatBtn=document.querySelector(".btn-next-ronde");
  if(belum+hampir===0){
    repeatBtn.style.display="none";
  } else {
    repeatBtn.style.display="";
    repeatBtn.textContent="Ulangi yang Belum & Hampir ("+( belum+hampir)+") \u27A1";
  }
}

function nextRonde(){
  var repeat=[];
  for(var i=0;i<deck.length;i++){
    if(ratings[i]===0||ratings[i]===1) repeat.push(deck[i]);
  }
  if(repeat.length===0){showFinal();return;}
  deck=shuffle(repeat);
  idx=0;
  ronde++;
  ratings=new Array(deck.length).fill(-1);
  document.getElementById("prog-fill").style.width="0%";
  showQuizView();
  showCard();
}

function showFinal(){
  document.getElementById("quiz-view").style.display="none";
  document.getElementById("result-screen").style.display="none";
  document.getElementById("final-screen").style.display="";
  var total=getFilteredCards().length;
  document.getElementById("final-msg").textContent=
    "Selesai dalam "+ronde+" ronde! Kamu mempelajari "+total+" frasa bahasa Inggris. Luar biasa!";
}

function restart(){
  startQuiz();
}

// ---- MODE CHANGE ----
document.querySelectorAll("input[name=mode]").forEach(function(el){
  el.addEventListener("change",function(){
    startQuiz();
  });
});

// ---- INIT ----
buildFilters();
updateSub();
startQuiz();
</script>
