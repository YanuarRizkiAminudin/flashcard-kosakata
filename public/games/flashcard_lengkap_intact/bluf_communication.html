<title>BLUF — Bottom Line Up Front</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef2f7;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;}
h1{font-size:15px;font-weight:700;color:#1a1814;text-align:center;margin-bottom:3px;}
.sub{font-size:12px;color:#8a8478;text-align:center;margin-bottom:10px;}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.fb{padding:5px 12px;border-radius:99px;border:1px solid #e8e4dc;background:#fff;color:#8a8478;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb:hover{border-color:#7c3aed;color:#7c3aed;}
.fb.on{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.fb.c-KONSEP.on{background:#2563eb;border-color:#2563eb;}
.fb.c-CONTOH.on{background:#059669;border-color:#059669;}
.fb.c-TIPS.on{background:#d97706;border-color:#d97706;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#f3e8ff;color:#7c3aed;}
.ctr{font-size:13px;color:#8a8478;}
.pbar-bg{height:4px;background:#e8e4dc;border-radius:99px;margin-bottom:.4rem;}
.pbar{height:4px;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:99px;transition:width .4s;}
.plabels{display:flex;justify-content:space-between;font-size:11px;color:#8a8478;margin-bottom:.7rem;}
.pills{display:flex;gap:6px;margin-bottom:.8rem;}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;}
.pl-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.pl-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.pl-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#15803d;}.dh{background:#a05c00;}.db{background:#dc2626;}
.card{background:#fff;border:1px solid #e8e4dc;border-radius:20px;box-shadow:0 4px 20px rgba(124,58,237,.08);min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,linear-gradient(90deg,#7c3aed,#2563eb));}
.card:hover:not(.done){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.15);}
.card-badges{display:flex;gap:6px;margin-bottom:.7rem;flex-wrap:wrap;justify-content:center;}
.card-num{font-size:10px;font-weight:600;color:#a0aec0;background:#f7f8fa;border:1px solid #e8e4dc;border-radius:99px;padding:2px 8px;}
.cat-badge{font-size:10px;font-weight:700;border-radius:99px;padding:2px 10px;}
.en-front{font-size:16px;font-weight:600;color:#1a1814;line-height:1.7;text-align:center;}
.tap{font-size:12px;color:#b0a8c4;margin-top:1rem;display:flex;align-items:center;gap:5px;}
.ans{margin-top:.8rem;text-align:center;animation:fup .25s ease;width:100%;}
@keyframes fup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.dl{width:36px;height:1px;background:#e8e4dc;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b0a8c4;margin-bottom:4px;}
.ans-id{font-size:15px;font-weight:600;color:#1a1814;line-height:1.7;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}.cb-p:hover{background:#dcfce7;}
.cb-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}.cb-h:hover{background:#fde8c2;}
.cb-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}.cb-b:hover{background:#fee2e2;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#1a1814;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#8a8478;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.sbh{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.sbb{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8a8478;margin-bottom:6px;}
.rlist{border:1px solid #e8e4dc;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fff;}
.ri:last-child{border-bottom:none;}
.ri-en{font-size:12px;color:#1a1814;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#fff1f2;color:#dc2626;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>
<body>
<div id="app">
  <h1>🎯 Bottom Line Up Front (BLUF)</h1>
  <div class="sub" id="sub-lbl">Ketuk untuk terjemahan Indonesia</div>

    <div class="pills">
      <div class="pill pl-p"><span class="dot dp"></span>&nbsp;<span id="sp">0</span>&nbsp;Paham</div>

      <button class="cb cb-p" onclick="rate(2)"><span class="cb-ico">✅</span><span>Paham</span><span class="cb-sub">Selesai</span></button>

  <div id="rv" style="display:none">

        <div class="sbox sbp"><div class="sn" id="rp">0</div><div class="sl">Paham</div></div>

        <div class="sbox sbb"><div class="sn" id="rbb">0</div><div class="sl">Belum</div></div>

    </div>

</div>
<script>
var V=[
  {cat:"KONSEP",en:"Bottom line up front is a military communications principle that's designed to enforce speed and clarity in reports and emails.",id:"Bottom line up front adalah prinsip komunikasi militer yang dirancang untuk menegakkan kecepatan dan kejelasan dalam laporan dan email."},
  {cat:"KONSEP",en:"It was the single most important lesson I learned back in junior year during my summer internship.",id:"Itu adalah satu pelajaran terpenting yang saya pelajari saat tahun ketiga selama magang musim panas saya."},
  {cat:"KONSEP",en:"This communications principle helped me build credibility with clients, colleagues, and managers regardless of my tenure.",id:"Prinsip komunikasi ini membantu saya membangun kredibilitas dengan klien, rekan, dan manajer terlepas dari masa kerja saya."},
  {cat:"KONSEP",en:"Bottom line up front now goes by many other names: top-down communication, the pyramid principle, but the core concept has stayed the same.",id:"Bottom line up front kini dikenal dengan banyak nama lain: komunikasi top-down, prinsip piramida, tetapi konsep intinya tetap sama."},
  {cat:"KONSEP",en:"It's a style of communication that prioritizes results and outcomes over the process and the steps you took to get there.",id:"Ini adalah gaya komunikasi yang mengutamakan hasil dan capaian di atas proses dan langkah-langkah yang Anda ambil untuk sampai ke sana."},
  {cat:"KONSEP",en:"Employers have consistently rated effective communication as the number one soft skill they look for in their employees.",id:"Pemberi kerja secara konsisten menilai komunikasi efektif sebagai soft skill nomor satu yang mereka cari pada karyawan mereka."},
  {cat:"KONSEP",en:"When there is a breakdown in communication, often efficiency, morale, and objectives can all suffer.",id:"Ketika terjadi kegagalan komunikasi, sering kali efisiensi, moral, dan tujuan semuanya bisa terdampak."},
  {cat:"KONSEP",en:"Just think back to the last time you worked with a colleague who provided you with the exact information you needed with just enough background for you to act upon.",id:"Cukup ingat kembali terakhir kali Anda bekerja dengan rekan yang memberi Anda informasi tepat yang Anda butuhkan dengan latar belakang yang cukup untuk Anda tindaklanjuti."},
  {cat:"KONSEP",en:"They have proven they're respectful of your time by providing you with only relevant information while leaving out all that needless fluff.",id:"Mereka telah membuktikan bahwa mereka menghargai waktu Anda dengan hanya memberikan informasi yang relevan sambil meninggalkan semua hal yang tidak perlu."},
  {cat:"KONSEP",en:"As a product marketer working on four to five campaigns at any given time, I need to be very efficient in my communications with the sales, product, and marketing teams in order to keep myself sane.",id:"Sebagai pemasar produk yang mengerjakan empat hingga lima kampanye sekaligus, saya perlu sangat efisien dalam komunikasi saya dengan tim penjualan, produk, dan pemasaran agar tetap waras."},
  {cat:"CONTOH",en:"There's a popular question often asked in the middle of consulting case interviews where the interviewer interrupts your analysis and says something like, 'Hey, the senior partner just walked into the room and asked how the project's going. What do you say?'",id:"Ada pertanyaan populer yang sering ditanyakan di tengah wawancara kasus konsultan di mana pewawancara menyela analisis Anda dan berkata seperti, 'Hei, senior partner baru saja masuk ke ruangan dan bertanya bagaimana proyek berjalan. Apa yang Anda katakan?'"},
  {cat:"CONTOH",en:"The idea, of course, is to see how well you can summarize all the information you've gathered so far and present them in an efficient way.",id:"Idenya, tentu saja, adalah untuk melihat seberapa baik Anda dapat merangkum semua informasi yang telah Anda kumpulkan sejauh ini dan menyajikannya dengan cara yang efisien."},
  {cat:"CONTOH",en:"Let's say you're the marketing manager of the iMac portion of a recent Apple product launch event.",id:"Katakanlah Anda adalah manajer pemasaran untuk bagian iMac dari acara peluncuran produk Apple baru-baru ini."},
  {cat:"CONTOH",en:"Your director pings you while she is in a meeting with other senior stakeholders and she needs a quick status update.",id:"Direktur Anda menghubungi Anda saat dia sedang rapat dengan pemangku kepentingan senior lainnya dan dia membutuhkan pembaruan status yang cepat."},
  {cat:"CONTOH",en:"Hi Isabel, so we ran into some shipping issues and I had to get approval to pay an additional $10,000 for overnight FedEx and that took a while to sort out.",id:"Hai Isabel, jadi kami mengalami beberapa masalah pengiriman dan saya harus mendapat persetujuan untuk membayar tambahan $10.000 untuk FedEx semalam dan itu butuh waktu untuk diselesaikan."},
  {cat:"CONTOH",en:"I was also told by the AirTags team that they needed to go before us so there was nothing I could do about that.",id:"Saya juga diberitahu oleh tim AirTags bahwa mereka perlu tampil sebelum kami sehingga tidak ada yang bisa saya lakukan tentang hal itu."},
  {cat:"CONTOH",en:"But I think overall the creative agency is on track now that we have received the blue iMacs so you can review the final draft of the video by April 1st.",id:"Tapi saya pikir secara keseluruhan agensi kreatif sudah on track sekarang setelah kami menerima iMac biru sehingga Anda dapat meninjau draf akhir video pada 1 April."},
  {cat:"CONTOH",en:"Hi Isabel, overall we're currently on schedule to have the final draft of the video for your review by April 1st.",id:"Hai Isabel, secara keseluruhan kami saat ini sesuai jadwal untuk memiliki draf akhir video untuk ditinjau pada 1 April."},
  {cat:"CONTOH",en:"Our shipping cost increased by $10,000 because we had to overnight the blue iMacs or they would have been late.",id:"Biaya pengiriman kami meningkat $10.000 karena kami harus mengirim iMac biru semalaman atau mereka akan terlambat."},
  {cat:"CONTOH",en:"Our slot got pushed back behind the AirTags announcement. I would need your help to escalate this issue if we want our original slot back.",id:"Slot kami didorong ke belakang pengumuman AirTags. Saya perlu bantuan Anda untuk mengeskalasi masalah ini jika kita ingin slot asli kita kembali."},
  {cat:"CONTOH",en:"After review the final draft of the video, we can submit to the PR team for distribution.",id:"Setelah meninjau draf akhir video, kita dapat mengirimkan ke tim PR untuk distribusi."},
  {cat:"KONSEP",en:"Example one is very process-oriented. You first did this, then that happened, then you had to go fix that. Oh, and finally, here's the result.",id:"Contoh pertama sangat berorientasi proses. Anda pertama melakukan ini, lalu itu terjadi, lalu Anda harus pergi memperbaiki itu. Oh, dan akhirnya, inilah hasilnya."},
  {cat:"KONSEP",en:"Example two adheres more to the bottom line up front principle by prioritizing the one thing that director cares most about.",id:"Contoh kedua lebih mengikuti prinsip bottom line up front dengan mengutamakan satu hal yang paling diperhatikan direktur."},
  {cat:"KONSEP",en:"If your director only had a few seconds to skim your reply and respond to Tim Cook, she'll be able to confidently say the final draft of the iMac video can be reviewed by April 1st.",id:"Jika direktur Anda hanya punya beberapa detik untuk membaca sekilas balasan Anda dan merespons Tim Cook, dia akan bisa dengan percaya diri mengatakan draf akhir video iMac dapat ditinjau pada 1 April."},
  {cat:"TIPS",en:"Practice makes perfect and there is one method you can incorporate immediately into your daily lives.",id:"Latihan membuat sempurna dan ada satu metode yang bisa Anda masukkan segera ke dalam kehidupan sehari-hari Anda."},
  {cat:"TIPS",en:"That method is active listening.",id:"Metode itu adalah mendengarkan aktif."},
  {cat:"TIPS",en:"The next time you ask your teammate or colleague about a project they're working on, listen to how they present it to you, then summarize using the bottom-line upfront principle.",id:"Lain kali Anda bertanya kepada rekan tim atau kolega tentang proyek yang sedang mereka kerjakan, dengarkan bagaimana mereka mempresentasikannya kepada Anda, lalu buat rangkuman menggunakan prinsip bottom-line upfront."},
  {cat:"CONTOH",en:"Hi Elon, how's the Tesla Roadster car coming along?",id:"Hai Elon, bagaimana perkembangan mobil Tesla Roadster?"},
  {cat:"CONTOH",en:"Well, we finally have enough vibranium to make our wheels, but we haven't started production.",id:"Nah, kami akhirnya punya cukup vibranium untuk membuat roda kami, tapi kami belum mulai produksi."},
  {cat:"CONTOH",en:"We're going to decide on the color soon, probably black, white, and maybe red to get that MKBHD love.",id:"Kami akan segera memutuskan warnanya, kemungkinan hitam, putih, dan mungkin merah untuk mendapat perhatian MKBHD."},
  {cat:"CONTOH",en:"We're going to get approval from the EPA, so all in all, we should be good to launch by the year 2050.",id:"Kami akan mendapatkan persetujuan dari EPA, jadi semuanya, kami seharusnya siap diluncurkan pada tahun 2050."},
  {cat:"CONTOH",en:"So, the tentative launch date for the Tesla Roadster is 2050 because number one, we have yet to start production on the vibranium wheels, number two, we still have yet to decide on the colors, and finally, we're pending approval from the EPA.",id:"Jadi, tanggal peluncuran tentatif untuk Tesla Roadster adalah 2050 karena pertama, kita belum mulai produksi roda vibranium, kedua, kita masih belum memutuskan warnanya, dan terakhir, kita menunggu persetujuan dari EPA."},
  {cat:"TIPS",en:"The great thing about active listening is that you can practice by flipping it around.",id:"Hal bagus tentang mendengarkan aktif adalah Anda bisa berlatih dengan membaliknya."},
  {cat:"TIPS",en:"The next time someone asks you, 'Hey, how's your day going?' instead of rambling, take a second, gather your thoughts, and reply with a structured answer.",id:"Lain kali seseorang bertanya kepada Anda, 'Hei, bagaimana harimu?' alih-alih berbicara panjang lebar, ambil sejenak, kumpulkan pikiran Anda, dan jawab dengan jawaban yang terstruktur."},
  {cat:"CONTOH",en:"I had back-to-back meetings this morning and had a huge presentation this afternoon. I was so busy preparing for that, I didn't get to eat lunch. And oh, I didn't even get to sleep well last night cuz I was so nervous about today.",id:"Saya punya rapat berturut-turut pagi ini dan presentasi besar sore ini. Saya sangat sibuk mempersiapkan itu, saya tidak sempat makan siang. Dan oh, saya bahkan tidak tidur nyenyak semalam karena saya sangat gugup tentang hari ini."},
  {cat:"CONTOH",en:"I'm having a rough day. First, I had back-to-back meetings this morning and a big presentation this afternoon. Second, I didn't get to eat lunch because I was so busy. And finally, I didn't get much sleep last night because I was so anxious about today.",id:"Saya sedang mengalami hari yang berat. Pertama, saya punya rapat berturut-turut pagi ini dan presentasi besar sore ini. Kedua, saya tidak sempat makan siang karena sangat sibuk. Dan terakhir, saya tidak banyak tidur semalam karena sangat cemas tentang hari ini."},
  {cat:"TIPS",en:"Does this exercise sound ridiculous? Probably. But is it what management consultants and project managers do on a daily basis? In my experience, yeah.",id:"Apakah latihan ini terdengar konyol? Mungkin. Tapi apakah itu yang dilakukan konsultan manajemen dan manajer proyek setiap hari? Dari pengalaman saya, ya."},
  {cat:"TIPS",en:"It might start off a bit awkward, but like anything else, the more you practice, the more natural this will feel.",id:"Ini mungkin terasa sedikit canggung di awal, tapi seperti hal lainnya, semakin banyak Anda berlatih, semakin alami rasanya."},
  {cat:"TIPS",en:"By adopting this bottom-line-up-front style of communication at work, you by default show that you're respectful of your colleagues' time.",id:"Dengan mengadopsi gaya komunikasi bottom-line-up-front di tempat kerja, secara otomatis Anda menunjukkan bahwa Anda menghargai waktu rekan-rekan Anda."},
  {cat:"TIPS",en:"Consciously or unconsciously, they will appreciate you for it.",id:"Secara sadar atau tidak sadar, mereka akan menghargai Anda karenanya."}
];

var curCat="ALL",deck=[],idx=0,ronde=1,cp=0,ch=0,cbv=0,rev=false,toRev=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}
function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}
function getFiltered(){return curCat==="ALL"?V.slice():V.filter(function(c){return c.cat===curCat;});}
function fullRestart(){
  var src=getFiltered();deck=shuffle(src);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua":CAT_CFG[curCat]?CAT_CFG[curCat].label:"?";
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" kalimat";
  document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Ronde "+ronde;
  upStats();showCard();
}
function nextRonde(){ronde++;deck=shuffle(toRev);cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("rb").textContent="Ronde "+ronde;upStats();showCard();}
function showCard(){
  rev=false;var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.KONSEP;
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  var ctb=document.getElementById("ctb");ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;
  document.getElementById("en-disp").textContent=c.en;
  document.getElementById("ans-id-txt").textContent=c.id;
  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}
function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}
function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}
function upStats(){document.getElementById("sp").textContent=cp;document.getElementById("sh").textContent=ch;document.getElementById("sb").textContent=cbv;}
function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;document.getElementById("rh").textContent=ch;document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🎉":pct>=70?"😊":pct>=50?"😐":"💪";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" kartu tersisa.":pct>=70?"Bagus! "+toRev.length+" kartu perlu diulang.":pct>=50?"Lumayan! Ulangi "+toRev.length+" kartu.":"Semangat! "+toRev.length+" kartu menunggumu.";
  document.getElementById("nb").textContent="Lanjut Ronde "+(ronde+1)+" → "+toRev.length+" kartu";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return (b._b||0)-(a._b||0);});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-en'>"+v.en.substring(0,65)+"…</span>"+score;
      rl.appendChild(d);
    });
  }
  document.getElementById("rlw").style.display="";
}
ronde=1;fullRestart();
</script>
</body>
</html>
