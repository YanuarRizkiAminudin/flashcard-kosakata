<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATLAB Image Filter — Flashcard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef2f7;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;}
h1{font-size:15px;font-weight:700;color:#1a1814;text-align:center;margin-bottom:3px;}
.sub{font-size:12px;color:#8a8478;text-align:center;margin-bottom:10px;}
.mode-sw{display:flex;background:#fff;border:1px solid #e8e4dc;border-radius:99px;padding:3px;gap:2px;margin-bottom:10px;}
.mode-sw label{flex:1;text-align:center;font-size:11px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:99px;color:#8a8478;transition:all .2s;user-select:none;}
.mode-sw input[type=radio]{display:none;}
.mode-sw input[type=radio]:checked+label{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.3);}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.fb{padding:5px 12px;border-radius:99px;border:1px solid #e8e4dc;background:#fff;color:#8a8478;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb:hover{border-color:#7c3aed;color:#7c3aed;}
.fb.on{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#f3e8ff;color:#7c3aed;}
.ctr{font-size:13px;color:#8a8478;}
.pbar-bg{height:4px;background:#e8e4dc;border-radius:99px;margin-bottom:.4rem;}
.pbar{height:4px;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:99px;transition:width .4s;}
.plabels{display:flex;justify-content:space-between;font-size:11px;color:#8a8478;margin-bottom:.7rem;}
.pills{display:flex;gap:6px;margin-bottom:.8rem;}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;}
.pl-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.pl-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.pl-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#15803d;}.dh{background:#a05c00;}.db{background:#dc2626;}
.card{background:#fff;border:1px solid #e8e4dc;border-radius:20px;box-shadow:0 4px 20px rgba(124,58,237,.08);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,linear-gradient(90deg,#7c3aed,#2563eb));}
.card:hover:not(.done){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.15);}
.card-badges{display:flex;gap:6px;margin-bottom:.8rem;flex-wrap:wrap;justify-content:center;}
.card-num{font-size:10px;font-weight:600;color:#a0aec0;background:#f7f8fa;border:1px solid #e8e4dc;border-radius:99px;padding:2px 8px;}
.cat-badge{font-size:10px;font-weight:700;border-radius:99px;padding:2px 10px;}
.line-badge{font-size:10px;font-weight:600;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:99px;padding:2px 8px;}
.code-hint{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:600;color:#1a1814;text-align:center;background:#f8f5ff;border:1.5px solid #c4b5fd;border-radius:12px;padding:12px 16px;width:100%;line-height:1.8;}
.code-hint .dots{color:#7c3aed;font-size:20px;letter-spacing:2px;}
.tap{font-size:12px;color:#b0a8c4;margin-top:1rem;display:flex;align-items:center;gap:5px;}
.ans{margin-top:.8rem;width:100%;animation:fup .25s ease;}
@keyframes fup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.dl{width:36px;height:1px;background:#e8e4dc;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b0a8c4;margin-bottom:6px;text-align:center;}
.code-full{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;color:#1e40af;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:12px 16px;width:100%;white-space:pre-wrap;line-height:1.8;text-align:left;}
.ans-note{font-size:11px;color:#a05c00;background:#fef3e2;border-radius:8px;padding:6px 12px;margin-top:8px;font-style:italic;text-align:center;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}.cb-p:hover{background:#dcfce7;}
.cb-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}.cb-h:hover{background:#fde8c2;}
.cb-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}.cb-b:hover{background:#fee2e2;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#1a1814;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#8a8478;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.sbh{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.sbb{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8a8478;margin-bottom:6px;}
.rlist{border:1px solid #e8e4dc;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fff;}
.ri:last-child{border-bottom:none;}
.ri-code{font-family:"JetBrains Mono",monospace;font-size:12px;color:#2563eb;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#fff1f2;color:#dc2626;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>
<body>
<div id="app">
  <h1>💻 MATLAB — Image Filter Flashcard</h1>
  <div class="sub" id="sub-lbl">Lihat awal kode → tebak sisanya</div>

  <div style="font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8a8478;text-align:center;margin-bottom:5px;">MODE</div>
  <div class="mode-sw">
    <input type="radio" name="mode" id="m-front" value="front" checked>
    <label for="m-front">💻 Awal → Tebak Lanjutan</label>
    <input type="radio" name="mode" id="m-back" value="back">
    <label for="m-back">🔁 Akhir → Tebak Awal</label>
  </div>

  <div class="filters">
    <button class="fb on" onclick="setCat('ALL')">🗂 Semua</button>
    <button class="fb" onclick="setCat('INIT')">🔧 Inisialisasi</button>
    <button class="fb" onclick="setCat('LOWPASS')">🔵 Low-Pass</button>
    <button class="fb" onclick="setCat('HIGHPASS')">🔴 High-Pass</button>
    <button class="fb" onclick="setCat('MEDIAN')">🟢 Median</button>
    <button class="fb" onclick="setCat('MODE')">🟡 Mode</button>
    <button class="fb" onclick="setCat('EDGE')">⚡ Edge</button>
  </div>

  <div id="qv">
    <div class="topbar"><span class="badge" id="rb">Step 1</span><span class="ctr" id="ctr">1/--</span></div>
    <div class="pbar-bg"><div class="pbar" id="pb" style="width:0%"></div></div>
    <div class="plabels"><span id="pl">0 selesai</span><span id="pr">-- kartu</span></div>
    <div class="pills">
      <div class="pill pl-p"><span class="dot dp"></span>&nbsp;<span id="sp">0</span>&nbsp;Paham</div>
      <div class="pill pl-h"><span class="dot dh"></span>&nbsp;<span id="sh">0</span>&nbsp;Hampir</div>
      <div class="pill pl-b"><span class="dot db"></span>&nbsp;<span id="sb">0</span>&nbsp;Belum</div>
    </div>
    <div class="card" id="card" onclick="reveal()">
      <div class="card-badges">
        <span class="card-num" id="cn">#1</span>
        <span class="line-badge" id="ob">Line 1</span>
        <span class="cat-badge" id="ctb"></span>
      </div>
      <div class="code-hint" id="front-code"></div>
      <div class="tap" id="tap"><span>👆</span>Ketuk untuk jawaban</div>
      <div class="ans" id="ans" style="display:none">
        <div class="dl"></div>
        <div class="atag">✅ KODE LENGKAP</div>
        <div class="code-full" id="ans-code"></div>
        <div class="ans-note" id="ans-note" style="display:none"></div>
      </div>
    </div>
    <div class="btnrow" id="ba" style="display:none">
      <button class="cb cb-b" onclick="rate(0)"><span class="cb-ico">😵</span><span>Belum</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-h" onclick="rate(1)"><span class="cb-ico">🤔</span><span>Hampir</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-p" onclick="rate(2)"><span class="cb-ico">✅</span><span>Paham</span><span class="cb-sub">Lanjut</span></button>
    </div>
  </div>

  <div id="rv" style="display:none">
    <div class="res">
      <div class="res-ico" id="ri2"></div>
      <div class="res-title" id="rt"></div>
      <div class="res-sub" id="rs"></div>
      <div class="srow">
        <div class="sbox sbp"><div class="sn" id="rp">0</div><div class="sl">Paham</div></div>
        <div class="sbox sbh"><div class="sn" id="rh">0</div><div class="sl">Hampir</div></div>
        <div class="sbox sbb"><div class="sn" id="rbb">0</div><div class="sl">Belum</div></div>
      </div>
      <div id="rlw" style="display:none">
        <div class="rlist-wrap">
          <div class="rlist-ttl">Perlu diulang 📌</div>
          <div class="rlist" id="rl"></div>
        </div>
      </div>
      <button class="btnbig btn-purple" id="nb" onclick="nextRonde()"></button>
      <button class="btnbig btn-ghost" onclick="fullRestart()">🔄 Mulai dari awal</button>
    </div>
  </div>
  <div id="fv3" style="display:none">
    <div class="final">
      <div style="font-size:64px;margin-bottom:.8rem">🏆</div>
      <div class="res-title">Semua dikuasai!</div>
      <button class="btnbig btn-purple" onclick="fullRestart()">🔄 Ulangi lagi</button>
    </div>
  </div>
</div>
<script>
var V=[
{o:1,cat:"INIT",h:"clear;",t:"close all;",code:"clear; clc; close all;",note:"Selalu dijalankan pertama untuk mulai bersih."},
{o:2,cat:"INIT",h:"img = imread(",t:"'cameraman.tif');",code:"img = imread('cameraman.tif');",note:"imread() membaca citra dari file."},
{o:3,cat:"INIT",h:"if size(img,3) == 3",t:"rgb2gray(img);\nend",code:"if size(img,3) == 3\n    img = rgb2gray(img);\nend",note:"size(img,3)==3 cek apakah ada 3 channel warna."},
{o:4,cat:"INIT",h:"I = double(",t:"double(img);",code:"I = double(img);",note:"Konvolusi butuh tipe double, bukan integer."},
{o:5,cat:"INIT",h:"[r, c] =",t:"size(I);",code:"[r, c] = size(I);",note:"r = rows (tinggi), c = cols (lebar)."},
{o:6,cat:"INIT",h:"P = I([1 1:r r],",t:"[1 1:c c]);",code:"P = I([1 1:r r], [1 1:c c]);",note:"Padding replikasi piksel tepi agar konvolusi same-size."},
{o:7,cat:"INIT",h:"figure; imshow(img);",t:"title('Original Image');",code:"figure; imshow(img); title('Original Image');",note:"imshow() tampilkan, title() beri judul."},
{o:8,cat:"LOWPASS",h:"lowpass =",t:"ones(3) / 9;",code:"lowpass = ones(3) / 9;",note:"Jumlah semua elemen = 1 → filter rata-rata (averaging)."},
{o:9,cat:"LOWPASS",h:"blurImg = conv2(P,",t:"rot90(lowpass,2), 'valid');",code:"blurImg = conv2(P, rot90(lowpass,2), 'valid');",note:"rot90(k,2) = rotasi 180°. 'valid' = output same-size dengan I."},
{o:10,cat:"LOWPASS",h:"figure; imshow(uint8(blurImg));",t:"title('Blur Image (Low-pass 3x3)');",code:"figure; imshow(uint8(blurImg)); title('Blur Image (Low-pass 3x3)');",note:"Low-pass = menghaluskan gambar / mengurangi noise."},
{o:11,cat:"HIGHPASS",h:"highpass = [-1 -1 -1;",t:"-1 9 -1; -1 -1 -1];",code:"highpass = [-1 -1 -1; -1 9 -1; -1 -1 -1];",note:"Pusat 9, sekitar -1. Memperkuat perbedaan antar piksel."},
{o:12,cat:"HIGHPASS",h:"sharpImg = conv2(P,",t:"rot90(highpass,2), 'valid');",code:"sharpImg = conv2(P, rot90(highpass,2), 'valid');",note:"Hasilnya bisa negatif atau >255, perlu di-clip."},
{o:13,cat:"HIGHPASS",h:"sharpImg = min(",t:"max(sharpImg, 0), 255);",code:"sharpImg = min(max(sharpImg, 0), 255);",note:"max(x,0) hilangkan negatif. min(x,255) batasi atas 255."},
{o:14,cat:"HIGHPASS",h:"figure; imshow(uint8(sharpImg));",t:"title('Sharpening Image (High-pass 3x3)');",code:"figure; imshow(uint8(sharpImg)); title('Sharpening Image (High-pass 3x3)');",note:"High-pass = mempertajam tepi gambar."},
{o:15,cat:"MEDIAN",h:"medImg =",t:"zeros(r, c);",code:"medImg = zeros(r, c);",note:"zeros() membuat matriks nol berukuran r x c."},
{o:16,cat:"MEDIAN",h:"for i = 1:r",t:"for j = 1:c",code:"for i = 1:r\n    for j = 1:c",note:"Loop nested iterasi setiap piksel (baris i, kolom j)."},
{o:17,cat:"MEDIAN",h:"w = P(",t:"i:i+2, j:j+2);",code:"w = P(i:i+2, j:j+2);",note:"Ambil window 3x3 dari citra padded di posisi (i,j)."},
{o:18,cat:"MEDIAN",h:"medImg(i,j) =",t:"median(w(:));",code:"medImg(i,j) = median(w(:));",note:"w(:) ubah 3x3 jadi vektor 9 elemen. median() nilai tengah."},
{o:19,cat:"MEDIAN",h:"figure; imshow(uint8(medImg));",t:"title('Median Image (3x3)');",code:"figure; imshow(uint8(medImg)); title('Median Image (3x3)');",note:"Efektif untuk menghilangkan salt-and-pepper noise."},
{o:20,cat:"MODE",h:"modeImg =",t:"zeros(r, c);",code:"modeImg = zeros(r, c);",note:"Sama seperti inisialisasi median filter."},
{o:21,cat:"MODE",h:"modeImg(i,j) =",t:"mode(w(:));",code:"modeImg(i,j) = mode(w(:));",note:"mode() = nilai dengan frekuensi tertinggi di window."},
{o:22,cat:"MODE",h:"figure; imshow(uint8(modeImg));",t:"title('Mode Image (3x3)');",code:"figure; imshow(uint8(modeImg)); title('Mode Image (3x3)');",note:"Mode filter menjaga nilai dominan di setiap area."},
{o:23,cat:"EDGE",h:"sobelX = [-1 0 1;",t:"-2 0 2; -1 0 1];",code:"sobelX = [-1 0 1; -2 0 2; -1 0 1];",note:"sobelX deteksi perubahan intensitas arah kiri-kanan."},
{o:24,cat:"EDGE",h:"sobelY = [-1 -2 -1;",t:"0 0 0; 1 2 1];",code:"sobelY = [-1 -2 -1; 0 0 0; 1 2 1];",note:"sobelY deteksi perubahan intensitas arah atas-bawah."},
{o:25,cat:"EDGE",h:"Gx = conv2(P,",t:"rot90(sobelX,2), 'valid');",code:"Gx = conv2(P, rot90(sobelX,2), 'valid');",note:"Gx = respons tepi arah X."},
{o:26,cat:"EDGE",h:"Gy = conv2(P,",t:"rot90(sobelY,2), 'valid');",code:"Gy = conv2(P, rot90(sobelY,2), 'valid');",note:"Gy = respons tepi arah Y."},
{o:27,cat:"EDGE",h:"edgeImg = min(",t:"sqrt(Gx.^2 + Gy.^2), 255);",code:"edgeImg = min(sqrt(Gx.^2 + Gy.^2), 255);",note:"Gx.^2 = kuadrat element-wise. min() clip nilai atas 255."},
{o:28,cat:"EDGE",h:"figure; imshow(uint8(edgeImg));",t:"title('Edge Detection Image (Sobel 3x3)');",code:"figure; imshow(uint8(edgeImg)); title('Edge Detection Image (Sobel 3x3)');",note:"Tepi terang = area perubahan intensitas tajam."},
];

var CAT_CFG={
  INIT:{label:"🔧 Init",bg:"#f3e8ff",fg:"#7c3aed",acc:"linear-gradient(90deg,#7c3aed,#2563eb)"},
  LOWPASS:{label:"🔵 Low-Pass",bg:"#dbeafe",fg:"#1d4ed8",acc:"linear-gradient(90deg,#2563eb,#0ea5e9)"},
  HIGHPASS:{label:"🔴 High-Pass",bg:"#fee2e2",fg:"#b91c1c",acc:"linear-gradient(90deg,#dc2626,#f97316)"},
  MEDIAN:{label:"🟢 Median",bg:"#d1fae5",fg:"#065f46",acc:"linear-gradient(90deg,#059669,#2563eb)"},
  MODE:{label:"🟡 Mode",bg:"#fef3c7",fg:"#92400e",acc:"linear-gradient(90deg,#d97706,#f97316)"},
  EDGE:{label:"⚡ Edge",bg:"#ede9fe",fg:"#6d28d9",acc:"linear-gradient(90deg,#7c3aed,#6366f1)"}
};

var curCat="ALL",deck=[],idx=0,ronde=1,cp=0,ch=0,cbv=0,rev=false,toRev=[];

function getMode(){return document.querySelector('input[name="mode"]:checked').value;}

function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}

function getFiltered(){
  var arr=curCat==="ALL"?V.slice():V.filter(function(c){return c.cat===curCat;});
  arr.sort(function(a,b){return a.o-b.o;});
  return arr;
}

function fullRestart(){
  deck=getFiltered();
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" baris";
  document.getElementById("qv").style.display="";
  document.getElementById("rv").style.display="none";
  document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Step "+ronde;
  upStats();showCard();
}

function nextRonde(){
  ronde++;
  deck=toRev.slice();deck.sort(function(a,b){return a.o-b.o;});
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  document.getElementById("qv").style.display="";
  document.getElementById("rv").style.display="none";
  document.getElementById("rb").textContent="Step "+ronde;
  upStats();showCard();
}

function showCard(){
  rev=false;
  var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.INIT;
  var mode=getMode();
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  document.getElementById("ob").textContent="Line "+c.o;
  var ctb=document.getElementById("ctb");
  ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;

  var fc=document.getElementById("front-code");
  if(mode==="front"){
    fc.innerHTML=c.h+'<span class="dots"> ···</span>';
  } else {
    fc.innerHTML='<span class="dots">··· </span>'+c.t;
  }

  document.getElementById("ans-code").textContent=c.code;
  var noteEl=document.getElementById("ans-note");
  if(c.note){noteEl.textContent="💡 "+c.note;noteEl.style.display="";}
  else{noteEl.style.display="none";}

  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  document.getElementById("pb").style.width=Math.round(idx/deck.length*100)+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}

function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}

function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}

function upStats(){
  document.getElementById("sp").textContent=cp;
  document.getElementById("sh").textContent=ch;
  document.getElementById("sb").textContent=cbv;
}

function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;
  document.getElementById("rh").textContent=ch;
  document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🏆":pct>=70?"🌟":pct>=50?"💪":"😤";
  document.getElementById("rt").textContent="Selesai Ronde "+ronde+"!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" baris tersisa.":pct>=70?"Bagus! "+toRev.length+" baris perlu diulang.":"Semangat! "+toRev.length+" baris menunggumu.";
  document.getElementById("nb").textContent="Ulangi "+toRev.length+" baris yang belum";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return a.o-b.o;});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-code'>"+v.h+" ···</span>"+score;
      rl.appendChild(d);
    });
    document.getElementById("rlw").style.display="";
  }
}

document.querySelectorAll('input[name="mode"]').forEach(function(r){
  r.addEventListener("change",function(){if(!rev)showCard();});
});

ronde=1;fullRestart();
</script>
</body>
</html>
