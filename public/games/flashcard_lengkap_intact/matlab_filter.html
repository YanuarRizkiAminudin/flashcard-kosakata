<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATLAB Image Filter — Flashcard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f172a;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:560px;}
h1{font-size:15px;font-weight:700;color:#f1f5f9;text-align:center;margin-bottom:3px;}
.sub{font-size:12px;color:#64748b;text-align:center;margin-bottom:10px;}
.mode-sw{display:flex;background:#1e293b;border:1px solid #334155;border-radius:99px;padding:3px;gap:2px;margin-bottom:10px;}
.mode-sw label{flex:1;text-align:center;font-size:11px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:99px;color:#64748b;transition:all .2s;user-select:none;}
.mode-sw input[type=radio]{display:none;}
.mode-sw input[type=radio]:checked+label{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3);}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;}
.fb{padding:5px 12px;border-radius:99px;border:1px solid #334155;background:#1e293b;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb:hover{border-color:#6366f1;color:#6366f1;}
.fb.on{background:#6366f1;color:#fff;border-color:#6366f1;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#1e293b;color:#6366f1;border:1px solid #334155;}
.ctr{font-size:13px;color:#64748b;}
.pbar-bg{height:3px;background:#1e293b;border-radius:99px;margin-bottom:.4rem;}
.pbar{height:3px;background:linear-gradient(90deg,#6366f1,#0ea5e9);border-radius:99px;transition:width .4s;}
.plabels{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:.7rem;}
.pills{display:flex;gap:6px;margin-bottom:.8rem;}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;}
.pl-p{background:#052e16;border-color:#166534;color:#4ade80;}
.pl-h{background:#1c1917;border-color:#78350f;color:#fbbf24;}
.pl-b{background:#1c0f0f;border-color:#7f1d1d;color:#f87171;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#4ade80;}.dh{background:#fbbf24;}.db{background:#f87171;}
.card{background:#1e293b;border:1px solid #334155;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.4);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,linear-gradient(90deg,#6366f1,#0ea5e9));}
.card:hover:not(.done){transform:translateY(-2px);box-shadow:0 8px 32px rgba(99,102,241,.2);}
.card-badges{display:flex;gap:6px;margin-bottom:.8rem;flex-wrap:wrap;justify-content:center;}
.card-num{font-size:10px;font-weight:600;color:#475569;background:#0f172a;border:1px solid #334155;border-radius:99px;padding:2px 8px;}
.cat-badge{font-size:10px;font-weight:700;border-radius:99px;padding:2px 10px;}
.order-badge{font-size:10px;font-weight:600;color:#0ea5e9;background:#0c1a2e;border:1px solid #1d4ed8;border-radius:99px;padding:2px 8px;}
/* Code display */
.code-front{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:#e2e8f0;text-align:center;background:#0f172a;border-radius:10px;padding:12px 16px;width:100%;word-break:break-all;line-height:1.7;border:1px solid #334155;}
.desc-front{font-size:15px;font-weight:600;color:#e2e8f0;text-align:center;line-height:1.6;}
.tap{font-size:12px;color:#475569;margin-top:1rem;display:flex;align-items:center;gap:5px;}
.ans{margin-top:.8rem;width:100%;animation:fup .25s ease;}
@keyframes fup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.dl{width:36px;height:1px;background:#334155;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#475569;margin-bottom:6px;text-align:center;}
.ans-code{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;color:#a5f3fc;text-align:center;background:#0f172a;border-radius:10px;padding:10px 14px;width:100%;word-break:break-all;line-height:1.7;border:1px solid #1e40af;}
.ans-desc{font-size:14px;color:#e2e8f0;text-align:center;line-height:1.7;}
.ans-note{font-size:11px;color:#fbbf24;background:#1c1206;border-radius:8px;padding:6px 12px;margin-top:8px;font-style:italic;text-align:center;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#052e16;border-color:#166534;color:#4ade80;}.cb-p:hover{background:#14532d;}
.cb-h{background:#1c1917;border-color:#78350f;color:#fbbf24;}.cb-h:hover{background:#292524;}
.cb-b{background:#1c0f0f;border-color:#7f1d1d;color:#f87171;}.cb-b:hover{background:#2d1515;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#64748b;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#052e16;border-color:#166534;color:#4ade80;}
.sbh{background:#1c1917;border-color:#78350f;color:#fbbf24;}
.sbb{background:#1c0f0f;border-color:#7f1d1d;color:#f87171;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin-bottom:6px;}
.rlist{border:1px solid #334155;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #1e293b;background:#0f172a;}
.ri:last-child{border-bottom:none;}
.ri-code{font-family:"JetBrains Mono",monospace;font-size:12px;color:#a5f3fc;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#1c0f0f;color:#f87171;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-indigo{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;box-shadow:0 3px 10px rgba(99,102,241,.3);}
.btn-indigo:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #334155!important;color:#64748b;}
.btn-ghost:hover{background:#1e293b;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>
<body>
<div id="app">
  <h1>💻 MATLAB — Image Filter Flashcard</h1>
  <div class="sub" id="sub-lbl">Urut sesuai kode · ketuk untuk jawaban</div>

  <!-- Mode switch -->
  <div style="font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#475569;text-align:center;margin-bottom:5px;">MODE</div>
  <div class="mode-sw">
    <input type="radio" name="mode" id="m-code" value="code" checked>
    <label for="m-code">💻 Kode → Fungsi</label>
    <input type="radio" name="mode" id="m-desc" value="desc">
    <label for="m-desc">📖 Fungsi → Kode</label>
  </div>

  <!-- Category filter -->
  <div class="filters">
    <button class="fb on" onclick="setCat('ALL')">🗂 Semua</button>
    <button class="fb" onclick="setCat('INIT')">🔧 Inisialisasi</button>
    <button class="fb" onclick="setCat('LOWPASS')">🔵 Low-Pass</button>
    <button class="fb" onclick="setCat('HIGHPASS')">🔴 High-Pass</button>
    <button class="fb" onclick="setCat('MEDIAN')">🟢 Median</button>
    <button class="fb" onclick="setCat('MODE')">🟡 Mode</button>
    <button class="fb" onclick="setCat('EDGE')">⚡ Edge</button>
  </div>

  <div id="qv">
    <div class="topbar"><span class="badge" id="rb">Step 1</span><span class="ctr" id="ctr">1/--</span></div>
    <div class="pbar-bg"><div class="pbar" id="pb" style="width:0%"></div></div>
    <div class="plabels"><span id="pl">0 selesai</span><span id="pr">-- kartu</span></div>
    <div class="pills">
      <div class="pill pl-p"><span class="dot dp"></span>&nbsp;<span id="sp">0</span>&nbsp;Paham</div>
      <div class="pill pl-h"><span class="dot dh"></span>&nbsp;<span id="sh">0</span>&nbsp;Hampir</div>
      <div class="pill pl-b"><span class="dot db"></span>&nbsp;<span id="sb">0</span>&nbsp;Belum</div>
    </div>
    <div class="card" id="card" onclick="reveal()">
      <div class="card-badges">
        <span class="card-num" id="cn">#1</span>
        <span class="order-badge" id="ob"></span>
        <span class="cat-badge" id="ctb"></span>
      </div>
      <div id="front-code" class="code-front"></div>
      <div id="front-desc" class="desc-front" style="display:none"></div>
      <div class="tap" id="tap"><span>👆</span>Ketuk untuk jawaban</div>
      <div class="ans" id="ans" style="display:none">
        <div class="dl"></div>
        <div id="ans-code-wrap">
          <div class="atag">🔑 KODE</div>
          <div class="ans-code" id="ans-code"></div>
        </div>
        <div id="ans-desc-wrap" style="display:none">
          <div class="atag">📖 FUNGSI</div>
          <div class="ans-desc" id="ans-desc"></div>
        </div>
        <div class="ans-note" id="ans-note" style="display:none"></div>
      </div>
    </div>
    <div class="btnrow" id="ba" style="display:none">
      <button class="cb cb-b" onclick="rate(0)"><span class="cb-ico">😵</span><span>Belum</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-h" onclick="rate(1)"><span class="cb-ico">🤔</span><span>Hampir</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-p" onclick="rate(2)"><span class="cb-ico">✅</span><span>Paham</span><span class="cb-sub">Lanjut</span></button>
    </div>
  </div>

  <div id="rv" style="display:none">
    <div class="res">
      <div class="res-ico" id="ri2"></div>
      <div class="res-title" id="rt"></div>
      <div class="res-sub" id="rs"></div>
      <div class="srow">
        <div class="sbox sbp"><div class="sn" id="rp">0</div><div class="sl">Paham</div></div>
        <div class="sbox sbh"><div class="sn" id="rh">0</div><div class="sl">Hampir</div></div>
        <div class="sbox sbb"><div class="sn" id="rbb">0</div><div class="sl">Belum</div></div>
      </div>
      <div id="rlw" style="display:none">
        <div class="rlist-wrap">
          <div class="rlist-ttl">Perlu diulang 📌</div>
          <div class="rlist" id="rl"></div>
        </div>
      </div>
      <button class="btnbig btn-indigo" id="nb" onclick="nextRonde()"></button>
      <button class="btnbig btn-ghost" onclick="fullRestart()">🔄 Mulai dari awal</button>
    </div>
  </div>
  <div id="fv3" style="display:none">
    <div class="final">
      <div style="font-size:64px;margin-bottom:.8rem">🏆</div>
      <div class="res-title" style="color:#f1f5f9;">Semua baris dikuasai!</div>
      <button class="btnbig btn-indigo" onclick="fullRestart()">🔄 Ulangi lagi</button>
    </div>
  </div>
</div>

<script>
// order: urutan di kode asli
// cat: kategori section
// code: kode MATLAB
// desc: penjelasan fungsi
// note: catatan tambahan (opsional)
var V=[
// ── INISIALISASI ──
{order:1,cat:"INIT",code:"clear; clc; close all;",desc:"Bersihkan workspace, command window, dan tutup semua figure.",note:"Selalu dijalankan pertama untuk mulai bersih."},
{order:2,cat:"INIT",code:"img = imread('cameraman.tif');",desc:"Baca file gambar 'cameraman.tif' dan simpan ke variabel img.",note:"imread() membaca citra dari file."},
{order:3,cat:"INIT",code:"if size(img,3) == 3\n    img = rgb2gray(img);\nend",desc:"Jika gambar berwarna (3 channel RGB), konversi ke grayscale.",note:"size(img,3)==3 cek apakah ada 3 channel warna."},
{order:4,cat:"INIT",code:"I = double(img);",desc:"Konversi matriks citra dari uint8 ke tipe double untuk perhitungan matematis.",note:"Konvolusi butuh tipe double, bukan integer."},
{order:5,cat:"INIT",code:"[r, c] = size(I);",desc:"Ambil jumlah baris (r) dan kolom (c) dari citra.",note:"r = rows (tinggi), c = cols (lebar)."},
{order:6,cat:"INIT",code:"P = I([1 1:r r], [1 1:c c]);",desc:"Padding citra dengan replikasi piksel tepi (pad 1 piksel di semua sisi).",note:"Agar hasil konvolusi same-size dengan citra asli."},
{order:7,cat:"INIT",code:"figure; imshow(img); title('Original Image');",desc:"Tampilkan citra asli di figure baru dengan judul 'Original Image'.",note:"imshow() untuk menampilkan, title() untuk judul."},
// ── LOW-PASS ──
{order:8,cat:"LOWPASS",code:"lowpass = ones(3) / 9;",desc:"Buat kernel low-pass 3×3: semua elemen bernilai 1/9 (rata-rata).",note:"Jumlah semua elemen = 1 → filter rata-rata (averaging)."},
{order:9,cat:"LOWPASS",code:"blurImg = conv2(P, rot90(lowpass,2), 'valid');",desc:"Konvolusi citra padded P dengan kernel low-pass, ambil bagian 'valid' (tanpa border effect).",note:"rot90(k,2) = rotasi 180° = korelasi silang. 'valid' = output same-size dengan I."},
{order:10,cat:"LOWPASS",code:"figure; imshow(uint8(blurImg)); title('Blur Image (Low-pass 3x3)');",desc:"Tampilkan hasil blur. uint8() konversi kembali ke 0-255 untuk imshow.",note:"Low-pass = menghaluskan gambar / mengurangi noise."},
// ── HIGH-PASS ──
{order:11,cat:"HIGHPASS",code:"highpass = [-1 -1 -1; -1 9 -1; -1 -1 -1];",desc:"Definisikan kernel high-pass 3×3 untuk sharpening (penajaman tepi).",note:"Pusat bernilai 9, sekitarnya -1. Memperkuat perbedaan antar piksel."},
{order:12,cat:"HIGHPASS",code:"sharpImg = conv2(P, rot90(highpass,2), 'valid');",desc:"Konvolusi citra dengan kernel high-pass untuk menghasilkan gambar tajam.",note:"Hasilnya bisa negatif atau >255, perlu di-clip."},
{order:13,cat:"HIGHPASS",code:"sharpImg = min(max(sharpImg, 0), 255);",desc:"Clip nilai piksel agar tetap dalam rentang 0–255.",note:"max(x,0) hilangkan negatif. min(x,255) batasi atas 255."},
{order:14,cat:"HIGHPASS",code:"figure; imshow(uint8(sharpImg)); title('Sharpening Image (High-pass 3x3)');",desc:"Tampilkan hasil sharpening dengan judul.",note:"High-pass = mempertajam tepi gambar."},
// ── MEDIAN FILTER ──
{order:15,cat:"MEDIAN",code:"medImg = zeros(r, c);",desc:"Buat matriks output kosong berukuran r×c untuk median filter.",note:"zeros() membuat matriks nol."},
{order:16,cat:"MEDIAN",code:"for i = 1:r\n    for j = 1:c",desc:"Loop nested untuk iterasi setiap piksel (baris i, kolom j).",note:"Median filter tidak bisa vectorized, butuh loop."},
{order:17,cat:"MEDIAN",code:"w = P(i:i+2, j:j+2);",desc:"Ambil window 3×3 dari citra padded P di posisi (i,j).",note:"i:i+2 = 3 baris, j:j+2 = 3 kolom."},
{order:18,cat:"MEDIAN",code:"medImg(i,j) = median(w(:));",desc:"Hitung median dari semua 9 piksel window, simpan ke output.",note:"w(:) = ubah window 3×3 jadi vektor 9 elemen. median() ambil nilai tengah."},
{order:19,cat:"MEDIAN",code:"figure; imshow(uint8(medImg)); title('Median Image (3x3)');",desc:"Tampilkan hasil median filter.",note:"Median filter sangat efektif untuk menghilangkan salt-and-pepper noise."},
// ── MODE FILTER ──
{order:20,cat:"MODE",code:"modeImg = zeros(r, c);",desc:"Buat matriks output kosong untuk mode filter.",note:"Sama seperti inisialisasi median filter."},
{order:21,cat:"MODE",code:"w = P(i:i+2, j:j+2);",desc:"Ambil window 3×3 dari citra padded (sama seperti median).",note:"Loop for i dan for j sama persis dengan median filter."},
{order:22,cat:"MODE",code:"modeImg(i,j) = mode(w(:));",desc:"Hitung mode (nilai yang paling sering muncul) dari window 3×3.",note:"mode() = nilai yang frekuensinya tertinggi di window."},
{order:23,cat:"MODE",code:"figure; imshow(uint8(modeImg)); title('Mode Image (3x3)');",desc:"Tampilkan hasil mode filter.",note:"Mode filter menjaga nilai dominan di setiap area kecil."},
// ── EDGE DETECTION ──
{order:24,cat:"EDGE",code:"sobelX = [-1 0 1; -2 0 2; -1 0 1];",desc:"Definisikan kernel Sobel arah horizontal (deteksi tepi vertikal).",note:"sobelX mendeteksi perubahan intensitas arah kiri-kanan."},
{order:25,cat:"EDGE",code:"sobelY = [-1 -2 -1; 0 0 0; 1 2 1];",desc:"Definisikan kernel Sobel arah vertikal (deteksi tepi horizontal).",note:"sobelY mendeteksi perubahan intensitas arah atas-bawah."},
{order:26,cat:"EDGE",code:"Gx = conv2(P, rot90(sobelX,2), 'valid');",desc:"Hitung gradien horizontal Gx dengan konvolusi kernel sobelX.",note:"Gx = respons tepi arah X."},
{order:27,cat:"EDGE",code:"Gy = conv2(P, rot90(sobelY,2), 'valid');",desc:"Hitung gradien vertikal Gy dengan konvolusi kernel sobelY.",note:"Gy = respons tepi arah Y."},
{order:28,cat:"EDGE",code:"edgeImg = min(sqrt(Gx.^2 + Gy.^2), 255);",desc:"Hitung magnitudo gradien = √(Gx² + Gy²), clip ke maksimum 255.",note:"Gx.^2 = kuadrat element-wise. sqrt() akar kuadrat. min() clip nilai."},
{order:29,cat:"EDGE",code:"figure; imshow(uint8(edgeImg)); title('Edge Detection Image (Sobel 3x3)');",desc:"Tampilkan hasil deteksi tepi Sobel.",note:"Tepi terang = area perubahan intensitas tajam."},
];

var CAT_CFG={
  INIT:{label:"🔧 Init",bg:"#1e293b",fg:"#94a3b8",acc:"linear-gradient(90deg,#475569,#6366f1)"},
  LOWPASS:{label:"🔵 Low-Pass",bg:"#0c1a2e",fg:"#60a5fa",acc:"linear-gradient(90deg,#1d4ed8,#0ea5e9)"},
  HIGHPASS:{label:"🔴 High-Pass",bg:"#1c0f0f",fg:"#f87171",acc:"linear-gradient(90deg,#dc2626,#f97316)"},
  MEDIAN:{label:"🟢 Median",bg:"#052e16",fg:"#4ade80",acc:"linear-gradient(90deg,#16a34a,#0ea5e9)"},
  MODE:{label:"🟡 Mode",bg:"#1c1906",fg:"#fbbf24",acc:"linear-gradient(90deg,#ca8a04,#f97316)"},
  EDGE:{label:"⚡ Edge",bg:"#1c0a2e",fg:"#a78bfa",acc:"linear-gradient(90deg,#7c3aed,#6366f1)"}
};

var curCat="ALL", curMode="code";
var deck=[], idx=0, ronde=1, cp=0, ch=0, cbv=0, rev=false, toRev=[];

function getMode(){return document.querySelector('input[name="mode"]:checked').value;}

function shuffle(a){return a.slice();}  // NO SHUFFLE — urut

function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1; fullRestart();
}

function getFiltered(){
  var arr = curCat==="ALL" ? V.slice() : V.filter(function(c){return c.cat===curCat;});
  // Sort by order — always sequential
  arr.sort(function(a,b){return a.order-b.order;});
  return arr;
}

function fullRestart(){
  deck=getFiltered();
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" baris · "+getMode();
  document.getElementById("qv").style.display="";
  document.getElementById("rv").style.display="none";
  document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Step 1";
  upStats(); showCard();
}

function nextRonde(){
  ronde++;
  deck=toRev.slice(); deck.sort(function(a,b){return a.order-b.order;});
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  document.getElementById("qv").style.display="";
  document.getElementById("rv").style.display="none";
  document.getElementById("rb").textContent="Step "+ronde;
  upStats(); showCard();
}

function showCard(){
  rev=false;
  var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.INIT;
  var mode=getMode();
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  document.getElementById("ob").textContent="Line "+c.order;
  var ctb=document.getElementById("ctb");
  ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;

  if(mode==="code"){
    document.getElementById("front-code").textContent=c.code;
    document.getElementById("front-code").style.display="";
    document.getElementById("front-desc").style.display="none";
    document.getElementById("ans-code-wrap").style.display="none";
    document.getElementById("ans-desc-wrap").style.display="";
    document.getElementById("ans-desc").textContent=c.desc;
  } else {
    document.getElementById("front-desc").textContent=c.desc;
    document.getElementById("front-desc").style.display="";
    document.getElementById("front-code").style.display="none";
    document.getElementById("ans-desc-wrap").style.display="none";
    document.getElementById("ans-code-wrap").style.display="";
    document.getElementById("ans-code").textContent=c.code;
  }

  var noteEl=document.getElementById("ans-note");
  if(c.note){noteEl.textContent="💡 "+c.note;noteEl.style.display="";}
  else{noteEl.style.display="none";}

  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}

function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}

function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}

function upStats(){
  document.getElementById("sp").textContent=cp;
  document.getElementById("sh").textContent=ch;
  document.getElementById("sb").textContent=cbv;
}

function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;
  document.getElementById("rh").textContent=ch;
  document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🏆":pct>=70?"🌟":pct>=50?"💪":"😤";
  document.getElementById("rt").textContent="Selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" baris tersisa.":pct>=70?"Bagus! "+toRev.length+" baris perlu diulang.":"Semangat! "+toRev.length+" baris menunggumu.";
  document.getElementById("nb").textContent="Ulangi "+toRev.length+" baris yang belum";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return a.order-b.order;});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#64748b;text-align:center'>Tidak ada yang sulit! 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-code'>"+v.code.substring(0,35)+(v.code.length>35?"…":"")+"</span>"+score;
      rl.appendChild(d);
    });
    document.getElementById("rlw").style.display="";
  }
}

// Mode switch listener
document.querySelectorAll('input[name="mode"]').forEach(function(r){
  r.addEventListener("change",function(){
    document.getElementById("sub-lbl").textContent=
      (curCat==="ALL"?"Semua":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat)+
      " · "+deck.length+" baris · "+getMode();
    if(!rev) showCard();
  });
});

ronde=1; fullRestart();
</script>
</body>
</html>
