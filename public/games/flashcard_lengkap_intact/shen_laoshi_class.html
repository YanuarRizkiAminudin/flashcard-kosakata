.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}

.rlist-wrap{text-align:left;margin-bottom:1rem;}

.ri:last-child{border-bottom:none;}
.ri-zh{font-family:"Noto Serif TC",serif;font-size:13px;color:#1a1814;flex:1;}

.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}

<script>
var V=[
// KELAS
{cat:"KELAS",zh:"臺灣的學生對我來講，也是最重要的，但是我們也是不能說我都全部講中文然後我不理他們。",id:"Mahasiswa Taiwan bagi saya juga yang paling penting, tapi kita tidak bisa hanya bicara Mandarin terus tidak peduli mereka."},
{cat:"KELAS",zh:"如果你有什麼想法或是什麼，可以私信我或是可以在臉書的群組講都無所謂。",id:"Kalau kamu punya pikiran atau apapun, bisa DM saya atau bicara di grup Facebook, tidak masalah."},
{cat:"KELAS",zh:"我比較希望用臉書因為 Line 的群組你通常換手機除非你備份否則就沒有了。",id:"Saya lebih suka pakai Facebook karena grup Line kalau ganti HP kalau tidak backup biasanya hilang."},
{cat:"KELAS",zh:"雖然我外表看不太清楚，其實我應該是你們阿公阿媽級的。",id:"Walaupun penampilan saya tidak terlalu kelihatan tua, sebenarnya saya sudah level kakek nenek kalian."},
{cat:"KELAS",zh:"我比較希望你們叫老師姐姐，不要叫我大嬸也不要叫我婆婆或是阿嬤。",id:"Saya lebih suka kalian panggil 'kakak guru', jangan panggil saya 'tante' atau 'nenek'."},
{cat:"KELAS",zh:"因為我們有外籍生，所以我上課的時間跟進度就會有一點沒辦法很迅速。",id:"Karena ada mahasiswa asing, waktu mengajar dan kemajuan kelas tidak bisa terlalu cepat."},
{cat:"KELAS",zh:"我的 quality 絕對不會差，但是我的進度就很慢。",id:"Kualitas saya pasti tidak akan buruk, tapi kemajuannya akan lambat."},
{cat:"KELAS",zh:"如果是三節課，我不會三節課全部上完，因為那個是沒有效果的。",id:"Kalau ada tiga sesi, saya tidak akan mengajar penuh tiga sesi karena itu tidak efektif."},
{cat:"KELAS",zh:"剩下你們可以在這裡自由討論或是做作業都是可以的。",id:"Sisanya kalian bisa bebas diskusi atau mengerjakan tugas di sini."},
{cat:"KELAS",zh:"我希望大家可以接受，如果不能接受，也請你先跟我講。",id:"Saya harap semua bisa menerima, kalau tidak bisa tolong beritahu saya dulu."},
{cat:"KELAS",zh:"任何問題都歡迎，只要是課堂上都非常歡迎跟我詢問。",id:"Pertanyaan apapun diterima, selama di kelas sangat welcome untuk bertanya kepada saya."},
{cat:"KELAS",zh:"大家都是 Z 世代的人，我們就是不要太做作，就是自然就好，自然最重要。",id:"Semua adalah generasi Z, jangan terlalu dibuat-buat, yang natural saja, natural itu yang paling penting."},
{cat:"KELAS",zh:"到期中呢，我希望大家能夠做自己專業的自我介紹。",id:"Sampai UTS, saya harap semua bisa membuat perkenalan diri yang profesional."},
{cat:"KELAS",zh:"你不要覺得說你抱著以前大學的心態，你就是來這邊上課，然後就坐著像 NPC 一樣。",id:"Jangan berpikir dengan mentalitas kuliah S1 dulu, duduk di sini seperti NPC saja."},
{cat:"KELAS",zh:"今年你們應該是人數最少的，這就告訴我們是一個趨勢。",id:"Tahun ini kalian seharusnya yang paling sedikit jumlahnya, ini menunjukkan suatu tren."},
// TESIS
{cat:"TESIS",zh:"設計研究方法必修就是你可以任選3個你喜歡的，你覺得你可能會用到的。",id:"Metode Penelitian Desain yang wajib adalah kamu bisa pilih 3 yang kamu suka, yang kamu kira mungkin akan kamu pakai."},
{cat:"TESIS",zh:"我並沒有說不能用 AI，但是你一定要自己看過去，因為你在寫論文的時候。",id:"Saya tidak bilang tidak boleh pakai AI, tapi kamu harus melihatnya sendiri dulu, karena waktu menulis tesis."},
{cat:"TESIS",zh:"沒有什麼題目是好做也沒有什麼題目是不能做的，重點你想專注在什麼地方。",id:"Tidak ada topik yang mudah dikerjakan dan tidak ada topik yang tidak bisa dikerjakan, intinya kamu mau fokus di mana."},
{cat:"TESIS",zh:"題目不用急，一定會改的，甚至改到一年以後、一年半之後都會改。",id:"Judul tidak perlu terburu-buru, pasti akan berubah, bahkan sampai setahun kemudian, setahun setengah kemudian pun akan berubah."},
{cat:"TESIS",zh:"你要看範本，因為叫你自己做，你也不知道要怎麼做。",id:"Kamu perlu melihat contoh, karena kalau disuruh buat sendiri kamu juga tidak tahu harus bagaimana."},
{cat:"TESIS",zh:"我希望你至少選3種然後去比較它的優缺點。",id:"Saya harap kamu pilih minimal 3 jenis lalu bandingkan kelebihan dan kekurangannya."},
{cat:"TESIS",zh:"整理資料不在於多，在於你自己能夠看清楚多少。",id:"Mengorganisir data bukan soal banyaknya, tapi soal seberapa jelas kamu bisa memahaminya."},
{cat:"TESIS",zh:"你到最後你還是可能會用到問卷的方式。",id:"Pada akhirnya kamu masih mungkin menggunakan metode kuesioner."},
{cat:"TESIS",zh:"你一定要多閱讀，你沒有多閱讀你絕對問題有限。",id:"Kamu harus banyak membaca, kalau tidak banyak membaca pertanyaan-pertanyaanmu pasti terbatas."},
{cat:"TESIS",zh:"論文寫不出來不是因為上了沈老師的課，你論文馬上就寫出來，沒有這種事的。",id:"Tidak bisa menulis tesis bukan karena sudah ikut kelas saya lalu langsung bisa nulis, tidak ada yang seperti itu."},
{cat:"TESIS",zh:"我可以告訴你方法，可是你自己要去做，時間管理是你的不是我的。",id:"Saya bisa beritahu caranya, tapi kamu sendiri yang harus melakukannya, manajemen waktu adalah milikmu bukan milikku."},
{cat:"TESIS",zh:"大部分都拖到2到3年，準時2年以內畢業很少。",id:"Kebanyakan molor sampai 2 sampai 3 tahun, sangat jarang yang selesai tepat waktu dalam 2 tahun."},
{cat:"TESIS",zh:"你同一時間進來不一定同一時間出得去，所以是你自己時間管理的問題。",id:"Masuk bersamaan tidak berarti keluar bersamaan, itu masalah manajemen waktu kamu sendiri."},
{cat:"TESIS",zh:"做創作呢，你可能要有一個展演或者是參加一個比賽的證明。",id:"Untuk karya kreatif, kamu mungkin perlu bukti pertunjukan atau mengikuti kompetisi."},
{cat:"TESIS",zh:"做論文的可能要參加某個研討會去發表，你要有這樣的資格門檻才可以提出口考。",id:"Untuk penulisan tesis mungkin perlu ikut seminar untuk presentasi, kamu butuh kualifikasi seperti itu baru bisa mengajukan ujian lisan."},
{cat:"TESIS",zh:"不要急著找老師，每一個老師都去談談看，哪一個跟你的理念比較合適。",id:"Jangan terburu-buru mencari dosen pembimbing, coba ngobrol dengan setiap dosen dulu, mana yang paling cocok dengan ide kamu."},
// ADMINISTRASI
{cat:"ADMIN",zh:"東西寫出來了，一定要上傳到圖書館，圖書館會幫你做一個論文原創性的比對系統。",id:"Setelah selesai ditulis, harus diunggah ke perpustakaan, perpustakaan akan membantu cek sistem keaslian tesis."},
{cat:"ADMIN",zh:"如果36%是太高，一般是要13以下會比較好。",id:"Kalau 36% itu terlalu tinggi, umumnya di bawah 13% lebih baik."},
{cat:"ADMIN",zh:"研究倫理就是6個小時，你可以上臺灣學術倫理教育資源，免費的，但是你要註冊。",id:"Etika penelitian itu 6 jam, kamu bisa ikut di sumber pendidikan etika akademik Taiwan, gratis tapi harus daftar."},
{cat:"ADMIN",zh:"論文比對系統在67月大塞車，你口考完之後還要再上傳繳交一些文件。",id:"Sistem pembandingan tesis di bulan 6-7 sangat macet, setelah ujian lisan kamu masih harus unggah dan serahkan beberapa dokumen."},
{cat:"ADMIN",zh:"假設你全部弄完，731以前就可以順利拿到畢業證書。",id:"Asumsi kamu selesaikan semuanya, sebelum 31 Juli kamu bisa terima ijazah dengan lancar."},
{cat:"ADMIN",zh:"口考完成之後，你要自己去跑，不管你女朋友、家人，大部分都自己弄。",id:"Setelah ujian lisan selesai, kamu harus urus sendiri, tidak peduli pacar atau keluarga, sebagian besar urus sendiri."},
{cat:"ADMIN",zh:"論文摘要跟關鍵詞，都是要英文的版本，不是只有中文的，要附在那一本碩論的最後。",id:"Abstrak tesis dan kata kunci harus ada versi bahasa Inggrisnya, tidak cukup hanya Mandarin, harus dilampirkan di akhir tesis."},
{cat:"ADMIN",zh:"碩生在11月底就要確定指導老師，系上會告訴班代。",id:"Mahasiswa S2 harus konfirmasi dosen pembimbing di akhir November, departemen akan beritahu ketua kelas."},
{cat:"ADMIN",zh:"我只是一個授課老師，你的選課系統跟我沒關係，我的系統也進不去。",id:"Saya hanya dosen pengajar, sistem pemilihan mata kuliah kamu tidak ada hubungannya dengan saya, saya juga tidak bisa masuk sistemnya."},
{cat:"ADMIN",zh:"你的15000元不是都到我口袋裡，那是繳給教務處的。",id:"15.000 NT kamu tidak masuk semua ke kantong saya, itu dibayarkan ke Bagian Akademik."},
// NASIHAT
{cat:"NASIHAT",zh:"你要想想看你為什麼要投資這2年，這2年不見得能夠準時畢業。",id:"Pikirkan mengapa kamu mau investasikan 2 tahun ini, 2 tahun belum tentu bisa lulus tepat waktu."},
{cat:"NASIHAT",zh:"你同樣花2年，你自己去工作，因為你們學費不便宜。",id:"Untuk 2 tahun yang sama kamu bisa kerja, karena biaya kuliah kalian tidak murah."},
{cat:"NASIHAT",zh:"你來這裡一定有某種的原因，你是要來圓夢的還是當跳板還是怎麼樣的。",id:"Kamu pasti punya alasan tertentu untuk ke sini, apakah untuk mewujudkan mimpi, jembatan karir, atau apa."},

];

var CAT_CFG={
  KELAS:{label:"📚 Kelas",bg:"#dbeafe",fg:"#1d4ed8",acc:"linear-gradient(90deg,#2563eb,#7c3aed)"},
  TESIS:{label:"📝 Tesis",bg:"#d1fae5",fg:"#065f46",acc:"linear-gradient(90deg,#059669,#2563eb)"},
  ADMIN:{label:"📋 Administrasi",bg:"#fee2e2",fg:"#b91c1c",acc:"linear-gradient(90deg,#dc2626,#d97706)"},
  NASIHAT:{label:"💡 Nasihat",bg:"#fef3c7",fg:"#92400e",acc:"linear-gradient(90deg,#d97706,#059669)"}
};

var curCat="ALL",deck=[],idx=0,ronde=1,cp=0,ch=0,cbv=0,rev=false,toRev=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}
function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}
function getFiltered(){return curCat==="ALL"?V.slice():V.filter(function(c){return c.cat===curCat;});}
function fullRestart(){
  var src=getFiltered();deck=shuffle(src);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" kalimat";
  document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Ronde "+ronde;
  upStats();showCard();
}
function nextRonde(){ronde++;deck=shuffle(toRev);cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("rb").textContent="Ronde "+ronde;upStats();showCard();}
function showCard(){
  rev=false;var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.KELAS;
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  var ctb=document.getElementById("ctb");ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;
  document.getElementById("zh-disp").textContent=c.zh;
  document.getElementById("ans-id").textContent=c.id;
  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}
function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}
function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}
function upStats(){document.getElementById("sp").textContent=cp;document.getElementById("sh").textContent=ch;document.getElementById("sb").textContent=cbv;}
function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;document.getElementById("rh").textContent=ch;document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🎉":pct>=70?"😊":pct>=50?"😐":"💪";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" kartu tersisa.":pct>=70?"Bagus! "+toRev.length+" kartu perlu diulang.":"Semangat! "+toRev.length+" kartu menunggumu.";
  document.getElementById("nb").textContent="Lanjut Ronde "+(ronde+1)+" → "+toRev.length+" kartu";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return (b._b||0)-(a._b||0);});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-zh'>"+v.zh.substring(0,20)+"…</span>"+score;
      rl.appendChild(d);
    });
  }
  document.getElementById("rlw").style.display="";
}
ronde=1;fullRestart();
</script>
</body>
</html>
