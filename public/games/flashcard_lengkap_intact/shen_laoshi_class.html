<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef2f7;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;}
h1{font-size:15px;font-weight:700;color:#1a1814;text-align:center;margin-bottom:3px;}
.sub{font-size:12px;color:#8a8478;text-align:center;margin-bottom:10px;}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.fb{padding:5px 12px;border-radius:99px;border:1px solid #e8e4dc;background:#fff;color:#8a8478;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb:hover{border-color:#7c3aed;color:#7c3aed;}
.fb.on{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.fb.c-KELAS.on{background:#2563eb;border-color:#2563eb;}
.fb.c-TESIS.on{background:#059669;border-color:#059669;}
.fb.c-ADMIN.on{background:#dc2626;border-color:#dc2626;}
.fb.c-NASIHAT.on{background:#d97706;border-color:#d97706;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#f3e8ff;color:#7c3aed;}
.ctr{font-size:13px;color:#8a8478;}
.pbar-bg{height:4px;background:#e8e4dc;border-radius:99px;margin-bottom:.4rem;}
.pbar{height:4px;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:99px;transition:width .4s;}
.plabels{display:flex;justify-content:space-between;font-size:11px;color:#8a8478;margin-bottom:.7rem;}
.pills{display:flex;gap:6px;margin-bottom:.8rem;}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;}
.pl-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.pl-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.pl-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#15803d;}.dh{background:#a05c00;}.db{background:#dc2626;}
.card{background:#fff;border:1px solid #e8e4dc;border-radius:20px;box-shadow:0 4px 20px rgba(124,58,237,.08);min-height:185px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,linear-gradient(90deg,#7c3aed,#2563eb));}
.card:hover:not(.done){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.15);}
.card-badges{display:flex;gap:6px;margin-bottom:.7rem;flex-wrap:wrap;justify-content:center;}
.card-num{font-size:10px;font-weight:600;color:#a0aec0;background:#f7f8fa;border:1px solid #e8e4dc;border-radius:99px;padding:2px 8px;}
.cat-badge{font-size:10px;font-weight:700;border-radius:99px;padding:2px 10px;}
.zh-front{font-family:"Noto Serif TC",serif;font-weight:700;color:#1a1814;text-align:center;line-height:1.55;font-size:16px;}
.tap{font-size:12px;color:#b0a8c4;margin-top:1rem;display:flex;align-items:center;gap:5px;}
.ans{margin-top:.8rem;width:100%;animation:fup .25s ease;}
@keyframes fup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.dl{width:36px;height:1px;background:#e8e4dc;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b0a8c4;margin-bottom:4px;text-align:center;}
.ans-id{font-size:14px;font-weight:600;color:#1a1814;text-align:center;line-height:1.7;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}.cb-p:hover{background:#dcfce7;}
.cb-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}.cb-h:hover{background:#fde8c2;}
.cb-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}.cb-b:hover{background:#fee2e2;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#1a1814;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#8a8478;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.sbh{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.sbb{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8a8478;margin-bottom:6px;}
.rlist{border:1px solid #e8e4dc;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fff;}
.ri:last-child{border-bottom:none;}
.ri-zh{font-family:"Noto Serif TC",serif;font-size:13px;color:#1a1814;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#fff1f2;color:#dc2626;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>
<body>
<div id="app">
  <h1>🏫 沈老師的課 — 設計研究方法</h1>
  <div class="sub" id="sub-lbl">Ketuk untuk terjemahan Indonesia</div>
  <div class="filters">
    <button class="fb on" onclick="setCat('ALL')">🗂 Semua</button>
    <button class="fb c-KELAS" onclick="setCat('KELAS')">📚 Kelas</button>
    <button class="fb c-TESIS" onclick="setCat('TESIS')">📝 Tesis</button>
    <button class="fb c-ADMIN" onclick="setCat('ADMIN')">📋 Administrasi</button>
    <button class="fb c-NASIHAT" onclick="setCat('NASIHAT')">💡 Nasihat</button>
  </div>
  <div id="qv">
    <div class="topbar"><span class="badge" id="rb">Ronde 1</span><span class="ctr" id="ctr">1/--</span></div>
    <div class="pbar-bg"><div class="pbar" id="pb" style="width:0%"></div></div>
    <div class="plabels"><span id="pl">0 selesai</span><span id="pr">-- kartu</span></div>
    <div class="pills">
      <div class="pill pl-p"><span class="dot dp"></span>&nbsp;<span id="sp">0</span>&nbsp;Paham</div>
      <div class="pill pl-h"><span class="dot dh"></span>&nbsp;<span id="sh">0</span>&nbsp;Hampir</div>

      <div class="card-badges">
        <span class="card-num" id="cn">#1</span>

      <div class="zh-front" id="zh-disp"></div>

      <div class="ans" id="ans" style="display:none">
        <div class="dl"></div>
        <div class="atag">PINYIN</div>
        <div id="ans-py" style="font-size:14px;font-weight:700;color:#7c3aed;text-align:center;margin-bottom:8px;line-height:1.6;"></div>
        <div class="atag">🇮🇩 Indonesia</div>
        <div class="ans-id" id="ans-id"></div>

    </div>
    <div class="btnrow" id="ba" style="display:none">
      <button class="cb cb-b" onclick="rate(0)"><span class="cb-ico">😓</span><span>Belum</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-h" onclick="rate(1)"><span class="cb-ico">🤔</span><span>Hampir</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-p" onclick="rate(2)"><span class="cb-ico">✅</span><span>Paham</span><span class="cb-sub">Selesai</span></button>
    </div>
  </div>
  <div id="rv" style="display:none">
    <div class="res">
      <div class="res-ico" id="ri2"></div>

        <div class="sbox sbp"><div class="sn" id="rp">0</div><div class="sl">Paham</div></div>
        <div class="sbox sbh"><div class="sn" id="rh">0</div><div class="sl">Hampir</div></div>
        <div class="sbox sbb"><div class="sn" id="rbb">0</div><div class="sl">Belum</div></div>

      <button class="btnbig btn-purple" onclick="fullRestart()">🔄 Ulangi dari awal</button>

<script>
var V=[
// ── KELAS ──
{cat:"KELAS",zh:"學校他要收我們，老師只是一個授課的老師，你不能因為他就是訂立雙語，就不理學生。",py:"xué xiào tā yào shōu wǒ men lǎo shī zhǐ shì yī gè shòu kè de lǎo shī nǐ bù néng yīn wèi tā jiù shì dìng lì shuāng yǔ jiù bù lǐ xué shēng",id:"Sekolah yang menerima kita, guru hanya dosen pengajar. Kamu tidak bisa karena sudah bilang bilingual lalu tidak peduli mahasiswa."},
{cat:"KELAS",zh:"因為沈老師的課，可能沒辦法百分之百完全說中文，因為有國際學生。",py:"yīn wèi shěn lǎo shī de kè kě néng méi bàn fǎ bǎi fēn zhī bǎi wán quán shuō zhōng wén yīn wèi yǒu guó jì xué shēng",id:"Karena kelas Shen Laoshi, mungkin tidak bisa 100% berbicara Mandarin, karena ada mahasiswa internasional."},
{cat:"KELAS",zh:"我課堂的時間可能就變成切一半，要去克服我的國際學生。",py:"wǒ kè táng de shí jiān kě néng jiù biàn chéng qiè yī bàn yào qù kè fú wǒ de guó jì xué shēng",id:"Waktu mengajar saya mungkin jadi terbagi dua, untuk mengakomodasi mahasiswa internasional saya."},
{cat:"KELAS",zh:"臺灣的學生對我來講，也是最重要的，但是我們也是不能說我都全部講中文然後我不理他們。",py:"tái wān de xué shēng duì wǒ lái jiǎng yě shì zuì zhòng yào de dàn shì wǒ men yě shì bù néng shuō wǒ dōu quán bù jiǎng zhōng wén rán hòu wǒ bù lǐ tā men",id:"Mahasiswa Taiwan bagi saya juga yang paling penting, tapi kita tidak bisa hanya bicara Mandarin terus tidak peduli mereka."},
{cat:"KELAS",zh:"如果你有什麼想法或是什麼，可以私信我或是可以在臉書的群組講都無所謂。",py:"rú guǒ nǐ yǒu shén me xiǎng fǎ huò shì shén me kě yǐ sī xìn wǒ huò shì kě yǐ zài liǎn shū de qún zǔ jiǎng dōu wú suǒ wèi",id:"Kalau kamu punya pikiran atau apapun, bisa DM saya atau bicara di grup Facebook, tidak masalah."},
{cat:"KELAS",zh:"我比較希望用臉書，因為 Line 的群組你通常換手機除非你備份，否則就沒有了。",py:"wǒ bǐ jiào xī wàng yòng liǎn shū yīn wèi de qún zǔ nǐ tōng cháng huàn shǒu jī chú fēi nǐ bèi fèn fǒu zé jiù méi yǒu le",id:"Saya lebih suka pakai Facebook, karena grup Line kalau ganti HP tanpa backup biasanya hilang."},
{cat:"KELAS",zh:"我的群組從我已經在教書22年了。",py:"wǒ de qún zǔ cóng wǒ yǐ jīng zài jiào shū nián le",id:"Grup saya sudah ada sejak saya mengajar selama 22 tahun."},
{cat:"KELAS",zh:"雖然我外表看不太清楚，其實我應該是你們阿公阿媽級的。",py:"suī rán wǒ wài biǎo kàn bù tài qīng chǔ qí shí wǒ yīng gāi shì nǐ men ā gōng ā mā jí de",id:"Walaupun penampilan saya tidak terlalu kelihatan tua, sebenarnya saya sudah level kakek nenek kalian."},
{cat:"KELAS",zh:"我沒有去整形喔，但是我有打玻尿酸，這是一定有的，就是維持至少看起來就是不要太老。",py:"wǒ méi yǒu qù zhěng xíng ō dàn shì wǒ yǒu dǎ bō niào suān zhè shì yī dìng yǒu de jiù shì wéi chí zhì shǎo kàn qǐ lái jiù shì bù yào tài lǎo",id:"Saya tidak operasi plastik ya, tapi saya suntik filler, itu pasti ada, supaya setidaknya tidak kelihatan terlalu tua."},
{cat:"KELAS",zh:"我比較希望你們叫老師姐姐，不要叫我大嬸，也不要叫我婆婆或是阿嬤。",py:"wǒ bǐ jiào xī wàng nǐ men jiào lǎo shī jiě jiě bù yào jiào wǒ dà shěn yě bù yào jiào wǒ pó pó huò shì ā mā",id:"Saya lebih suka kalian panggil 'kakak guru', jangan panggil saya 'tante' atau 'nenek'."},
{cat:"KELAS",zh:"老師賺的錢不會因為有國際學生就有加價，我就是居民價，因為我只是員工。",py:"lǎo shī zhuàn de qián bù huì yīn wèi yǒu guó jì xué shēng jiù yǒu jiā jià wǒ jiù shì jū mín jià yīn wèi wǒ zhǐ shì yuán gōng",id:"Gaji guru tidak naik karena ada mahasiswa internasional, saya tetap gaji standar, karena saya hanya karyawan."},
{cat:"KELAS",zh:"因為我們有外籍生，所以我上課的時間跟進度就會有一點沒辦法很迅速。",py:"yīn wèi wǒ men yǒu wài jí shēng suǒ yǐ wǒ shàng kè de shí jiān gēn jìn dù jiù huì yǒu yī diǎn méi bàn fǎ hěn xùn sù",id:"Karena ada mahasiswa asing, waktu mengajar dan kemajuan kelas tidak bisa terlalu cepat."},
{cat:"KELAS",zh:"在這邊請同學先原諒我，就說我可能有一半不講中文。",py:"zài zhè biān qǐng tóng xué xiān yuán liàng wǒ jiù shuō wǒ kě néng yǒu yī bàn bù jiǎng zhōng wén",id:"Di sini tolong teman-teman memaafkan saya dulu, karena mungkin setengahnya tidak saya sampaikan dalam bahasa Mandarin."},
{cat:"KELAS",zh:"我的 quality 絕對不會差，但是我的進度就很慢。",py:"wǒ de jué duì bù huì chà dàn shì wǒ de jìn dù jiù hěn màn",id:"Kualitas saya pasti tidak akan buruk, tapi kemajuannya akan lambat."},
{cat:"KELAS",zh:"均一價，只收到保真的，吃到飽，那你說知識是什麼？沒知識啊。",py:"jūn yī jià zhǐ shōu dào bǎo zhēn de chī dào bǎo nà nǐ shuō zhī shí shì shén me méi zhī shí a",id:"Harga seragam, bayar pas dan dapat semua yang ada, kamu tanya ilmunya apa? Ya tidak ada bayar lebihnya."},
{cat:"KELAS",zh:"如果是三節課，我不會三節課全部上完，因為那個是沒有效果的。",py:"rú guǒ shì sān jié kè wǒ bù huì sān jié kè quán bù shàng wán yīn wèi nà gè shì méi yǒu xiào guǒ de",id:"Kalau ada tiga sesi, saya tidak akan mengajar penuh tiga sesi karena itu tidak efektif."},
{cat:"KELAS",zh:"剩下你們可以在這裡自由討論或是做作業都是可以的。",py:"shèng xià nǐ men kě yǐ zài zhè lǐ zì yóu tǎo lùn huò shì zuò zuò yè dōu shì kě yǐ de",id:"Sisanya kalian bisa bebas diskusi atau mengerjakan tugas di sini."},
{cat:"KELAS",zh:"你甚至可以在課堂上做 PPT 或者做別人提報的時候自己再做簡報也可以。",py:"nǐ shèn zhì kě yǐ zài kè táng shàng zuò huò zhě zuò bié rén tí bào de shí hòu zì jǐ zài zuò jiǎn bào yě kě yǐ",id:"Kamu bahkan bisa mengerjakan PPT di kelas atau waktu orang lain presentasi kamu buat slidenya sendiri juga boleh."},
{cat:"KELAS",zh:"我都是講重點，那剩下你們可以在這裡自由討論，或是做作業都是可以的。",py:"wǒ dōu shì jiǎng zhòng diǎn nà shèng xià nǐ men kě yǐ zài zhè lǐ zì yóu tǎo lùn huò shì zuò zuò yè dōu shì kě yǐ de",id:"Saya selalu menyampaikan poinnya saja, sisanya kalian bisa bebas diskusi atau mengerjakan tugas di sini."},
{cat:"KELAS",zh:"我希望大家可以接受，如果不能接受，也請你先跟我講。",py:"wǒ xī wàng dà jiā kě yǐ jiē shòu rú guǒ bù néng jiē shòu yě qǐng nǐ xiān gēn wǒ jiǎng",id:"Saya harap semua bisa menerima, kalau tidak bisa tolong beritahu saya dulu."},
{cat:"KELAS",zh:"任何問題都歡迎，只要是課堂上都非常歡迎跟我詢問。",py:"rèn hé wèn tí dōu huān yíng zhǐ yào shì kè táng shàng dōu fēi cháng huān yíng gēn wǒ xún wèn",id:"Pertanyaan apapun diterima, selama di kelas sangat welcome untuk bertanya kepada saya."},
{cat:"KELAS",zh:"大家都是 Z 世代的人，我們就是不要太做作，就是自然就好，自然最重要。",py:"dà jiā dōu shì shì dài de rén wǒ men jiù shì bù yào tài zuò zuò jiù shì zì rán jiù hǎo zì rán zuì zhòng yào",id:"Semua adalah generasi Z, jangan terlalu dibuat-buat, yang natural saja, natural itu yang paling penting."},
{cat:"KELAS",zh:"到期中呢，我希望大家能夠做自己專業的自我介紹。",py:"dào qī zhōng ne wǒ xī wàng dà jiā néng gòu zuò zì jǐ zhuān yè de zì wǒ jiè shào",id:"Sampai UTS, saya harap semua bisa membuat perkenalan diri sesuai latar belakang profesional masing-masing."},
{cat:"KELAS",zh:"你不要覺得說你抱著以前大學的心態，你就是來這邊上課，然後就坐著像 NPC 一樣。",py:"nǐ bù yào jué dé shuō nǐ bào zhù yǐ qián dà xué de xīn tài nǐ jiù shì lái zhè biān shàng kè rán hòu jiù zuò zhù xiàng yī yàng",id:"Jangan berpikir dengan mentalitas kuliah S1 dulu, datang lalu duduk seperti NPC saja."},
{cat:"KELAS",zh:"今年你們應該是人數最少的，這就告訴我們是一個趨勢。",py:"jīn nián nǐ men yīng gāi shì rén shù zuì shǎo de zhè jiù gào sù wǒ men shì yī gè qū shì",id:"Tahun ini kalian seharusnya yang paling sedikit jumlahnya, ini menunjukkan suatu tren."},
{cat:"KELAS",zh:"雖然所不會倒，但是念書越來越少人想來，想來骨科大的也相對越來越少。",py:"suī rán suǒ bù huì dào dàn shì niàn shū yuè lái yuè shǎo rén xiǎng lái xiǎng lái gǔ kē dà de yě xiāng duì yuè lái yuè shǎo",id:"Walaupun jurusan tidak akan bubar, tapi semakin sedikit orang yang mau kuliah, yang mau ke NUE juga semakin berkurang."},
{cat:"KELAS",zh:"我們先學期就做了一個蠻好的 project，所以你們學長很高興認識不同的人然後去溝通。",py:"wǒ men xiān xué qī jiù zuò le yī gè mán hǎo de suǒ yǐ nǐ men xué zhǎng hěn gāo xìng rèn shí bù tóng de rén rán hòu qù gōu tōng",id:"Semester lalu kami sudah buat project yang cukup bagus, jadi kakak tingkatmu senang mengenal orang berbeda lalu berkomunikasi."},
{cat:"KELAS",zh:"我會看課堂的人數去調說要怎麼做，比較客製化。",py:"wǒ huì kàn kè táng de rén shù qù diào shuō yào zěn me zuò bǐ jiào kè zhì huà",id:"Saya akan melihat jumlah orang di kelas lalu menyesuaikan caranya, lebih disesuaikan secara personal."},
{cat:"KELAS",zh:"因為我們人少，就是還是有優點，可以比較好好認識每個人。",py:"yīn wèi wǒ men rén shǎo jiù shì hái shì yǒu yōu diǎn kě yǐ bǐ jiào hǎo hǎo rèn shí měi gè rén",id:"Karena kita sedikit orang, itu masih ada kelebihannya, bisa lebih mengenal satu sama lain dengan baik."},
{cat:"KELAS",zh:"開學第一週，我不能來的時候，我趕緊叫晏喜跟嘉軒還有建良來 support 一下。",py:"kāi xué dì yī zhōu wǒ bù néng lái de shí hòu wǒ gǎn jǐn jiào yàn xǐ gēn jiā xuān hái yǒu jiàn liáng lái yī xià",id:"Minggu pertama kuliah, waktu saya tidak bisa datang, saya cepat-cepat minta Yanxi, Jiaxuan, dan Jianliang untuk support."},
{cat:"KELAS",zh:"通常到期中考過後，自我介紹過後，到年底會比較熟一點。",py:"tōng cháng dào qī zhōng kǎo guò hòu zì wǒ jiè shào guò hòu dào nián dǐ huì bǐ jiào shú yī diǎn",id:"Biasanya setelah melewati UTS, setelah perkenalan diri, menjelang akhir tahun akan lebih akrab."},
{cat:"KELAS",zh:"因為他們不是歐美的，他們跟我們文化差不多，大家會比較東方，比較害羞一點。",py:"yīn wèi tā men bù shì ōu měi de tā men gēn wǒ men wén huà chà bù duō dà jiā huì bǐ jiào dōng fāng bǐ jiào hài xiū yī diǎn",id:"Karena mereka bukan orang Barat, budaya mereka mirip kita, semua lebih ke budaya Timur, lebih pemalu sedikit."},
{cat:"KELAS",zh:"老師每年都要經歷過這樣一次，每年9月都是這樣，要開始大家都 NPC 好久。",py:"lǎo shī měi nián dōu yào jīng lì guò zhè yàng yī cì měi nián yuè dōu shì zhè yàng yào kāi shǐ dà jiā dōu hǎo jiǔ",id:"Guru setiap tahun harus melewati ini sekali, setiap September selalu begini, mulai dengan semua orang ber-NPC dulu lama."},
{cat:"KELAS",zh:"沈老師的課中間不休息，你要自己上洗手間就自己去可不可以。",py:"shěn lǎo shī de kè zhōng jiān bù xiū xī nǐ yào zì jǐ shàng xǐ shǒu jiān jiù zì jǐ qù kě bù kě yǐ",id:"Kelas Shen Laoshi tidak ada istirahat di tengah, kalau mau ke toilet pergi sendiri saja boleh tidak."},
{cat:"KELAS",zh:"只要你來，你才有辦法跟我互動；你不來，我也沒辦法跟你互動。",py:"zhǐ yào nǐ lái nǐ cái yǒu bàn fǎ gēn wǒ hù dòng nǐ bù lái wǒ yě méi bàn fǎ gēn nǐ hù dòng",id:"Selama kamu datang, baru bisa berinteraksi dengan saya; kalau tidak datang, saya juga tidak bisa berinteraksi dengan kamu."},
{cat:"KELAS",zh:"我是喜歡直接面對面的溝通，如果有什麼問題，請你直接跟我講。",py:"wǒ shì xǐ huān zhí jiē miàn duì miàn de gōu tōng rú guǒ yǒu shén me wèn tí qǐng nǐ zhí jiē gēn wǒ jiǎng",id:"Saya suka komunikasi langsung tatap muka, kalau ada masalah tolong langsung bicara ke saya."},
{cat:"KELAS",zh:"本班只有7、8個同學，所以請你直接跟我講好不好。",py:"běn bān zhǐ yǒu gè tóng xué suǒ yǐ qǐng nǐ zhí jiē gēn wǒ jiǎng hǎo bù hǎo",id:"Kelas ini hanya 7-8 mahasiswa, jadi tolong langsung bicara ke saya ya."},
{cat:"KELAS",zh:"你要告訴我你的需求，我能夠幫助你；而你沒有告訴我的需求，我也不明白。",py:"nǐ yào gào sù wǒ nǐ de xū qiú wǒ néng gòu bāng zhù nǐ ér nǐ méi yǒu gào sù wǒ de xū qiú wǒ yě bù míng bái",id:"Kamu harus beritahu kebutuhanmu, saya bisa membantumu; kalau kamu tidak beritahu kebutuhanmu saya juga tidak mengerti."},
{cat:"KELAS",zh:"只要是在我課堂以內，我可以幫助你，我一定會負責到底。",py:"zhǐ yào shì zài wǒ kè táng yǐ nèi wǒ kě yǐ bāng zhù nǐ wǒ yī dìng huì fù zé dào dǐ",id:"Selama masih dalam cakupan kelas saya, saya bisa membantumu, saya pasti akan bertanggung jawab sampai selesai."},
{cat:"KELAS",zh:"碩一上跟碩一下，只要你上我的課，我就會負責，但是你不能叫我負責你的論文，這是不可能的。",py:"shuò yī shàng gēn shuò yī xià zhǐ yào nǐ shàng wǒ de kè wǒ jiù huì fù zé dàn shì nǐ bù néng jiào wǒ fù zé nǐ de lùn wén zhè shì bù kě néng de",id:"S2 semester 1 dan 2, selama kamu ikut kelas saya, saya akan bertanggung jawab, tapi kamu tidak bisa minta saya tanggung jawab atas tesismu, itu tidak mungkin."},
{cat:"KELAS",zh:"我沒有被埋怨過或者怎麼樣，所以我希望繼續 carry on 這樣的傳統。",py:"wǒ méi yǒu bèi mái yuàn guò huò zhě zěn me yàng suǒ yǐ wǒ xī wàng jì xù zhè yàng de chuán tǒng",id:"Saya tidak pernah dikeluhkan atau apapun, jadi saya harap bisa terus lanjutkan tradisi seperti ini."},
{cat:"KELAS",zh:"如果我可能答非所問或者怎樣，就是有的時候切換的時候有一點秀逗，請同學一定要點醒老師。",py:"rú guǒ wǒ kě néng dá fēi suǒ wèn huò zhě zěn yàng jiù shì yǒu de shí hòu qiè huàn de shí hòu yǒu yī diǎn xiù dòu qǐng tóng xué yī dìng yào diǎn xǐng lǎo shī",id:"Kalau saya mungkin menjawab tidak sesuai pertanyaan atau bagaimana, kadang waktu berganti bahasa ada sedikit kacau, tolong mahasiswa ingatkan guru."},
{cat:"KELAS",zh:"你不用不好意思跟我講，我覺得不好意思一定要跟我講，如果我可能說錯了。",py:"nǐ bù yòng bù hǎo yì sī gēn wǒ jiǎng wǒ jué dé bù hǎo yì sī yī dìng yào gēn wǒ jiǎng rú guǒ wǒ kě néng shuō cuò le",id:"Jangan sungkan untuk bilang ke saya, saya rasa harus bilang ke saya kalau mungkin saya salah bicara."},
// ── TESIS ──
{cat:"TESIS",zh:"設計研究方法必修就是你可以任選3個你喜歡的，你覺得你可能會用到的。",py:"shè jì yán jiū fāng fǎ bì xiū jiù shì nǐ kě yǐ rèn xuǎn gè nǐ xǐ huān de nǐ jué dé nǐ kě néng huì yòng dào de",id:"Wajib Metode Penelitian Desain adalah kamu bisa pilih 3 yang kamu suka, yang kamu kira mungkin akan kamu pakai."},
{cat:"TESIS",zh:"我已經帶了歷屆學長解了範本給你看，同學，我知道同學一定要看範本。",py:"wǒ yǐ jīng dài le lì jiè xué zhǎng jiě le fàn běn gěi nǐ kàn tóng xué wǒ zhī dào tóng xué yī dìng yào kàn fàn běn",id:"Saya sudah bawa contoh dari kakak tingkat semua angkatan untuk kalian lihat, karena saya tahu mahasiswa pasti harus lihat contoh."},
{cat:"TESIS",zh:"我並沒有說不能用 AI，但是你一定要自己看過去，因為你在寫論文的時候你還是會用到的。",py:"wǒ bìng méi yǒu shuō bù néng yòng dàn shì nǐ yī dìng yào zì jǐ kàn guò qù yīn wèi nǐ zài xiě lùn wén de shí hòu nǐ hái shì huì yòng dào de",id:"Saya tidak bilang tidak boleh pakai AI, tapi kamu harus melihatnya sendiri dulu, karena waktu menulis tesis kamu masih akan memakainya."},
{cat:"TESIS",zh:"你把這本書吃透或者怎樣，但是我覺得你還是要自己問過一遍。",py:"nǐ bǎ zhè běn shū chī tòu huò zhě zěn yàng dàn shì wǒ jué dé nǐ hái shì yào zì jǐ wèn guò yī biàn",id:"Kamu habiskan buku ini atau bagaimana, tapi saya rasa kamu tetap harus menanyai dirimu sendiri dulu."},
{cat:"TESIS",zh:"沒有什麼題目是好做也沒有什麼題目是不能做的，重點你想專注在什麼地方。",py:"méi yǒu shén me tí mù shì hǎo zuò yě méi yǒu shén me tí mù shì bù néng zuò de zhòng diǎn nǐ xiǎng zhuān zhù zài shén me dì fāng",id:"Tidak ada topik yang mudah dikerjakan dan tidak ada topik yang tidak bisa dikerjakan, intinya kamu mau fokus di mana."},
{cat:"TESIS",zh:"題目不用急，一定會改的，甚至改到一年以後、一年半之後都會改。",py:"tí mù bù yòng jí yī dìng huì gǎi de shèn zhì gǎi dào yī nián yǐ hòu yī nián bàn zhī hòu dōu huì gǎi",id:"Judul tidak perlu terburu-buru, pasti akan berubah, bahkan sampai setahun atau setahun setengah kemudian pun masih akan berubah."},
{cat:"TESIS",zh:"你要看範本，因為叫你自己做，你也不知道要怎麼做。",py:"nǐ yào kàn fàn běn yīn wèi jiào nǐ zì jǐ zuò nǐ yě bù zhī dào yào zěn me zuò",id:"Kamu perlu melihat contoh, karena kalau disuruh buat sendiri kamu juga tidak tahu harus bagaimana."},
{cat:"TESIS",zh:"我希望你至少選3種然後去比較它的優缺點，了解一下他要怎麼樣。",py:"wǒ xī wàng nǐ zhì shǎo xuǎn zhǒng rán hòu qù bǐ jiào tā de yōu quē diǎn le jiě yī xià tā yào zěn me yàng",id:"Saya harap kamu pilih minimal 3 jenis lalu bandingkan kelebihan dan kekurangannya, pahami bagaimana cara kerjanya."},
{cat:"TESIS",zh:"整理資料不在於多，在於你自己能夠看清楚多少。",py:"zhěng lǐ zī liào bù zài yú duō zài yú nǐ zì jǐ néng gòu kàn qīng chǔ duō shǎo",id:"Mengorganisir data bukan soal banyaknya, tapi soal seberapa jelas kamu bisa memahaminya."},
{cat:"TESIS",zh:"你到最後你還是可能會用到問卷的方式，所以我希望你自己幫同學找跟設計最相關的。",py:"nǐ dào zuì hòu nǐ hái shì kě néng huì yòng dào wèn juǎn de fāng shì suǒ yǐ wǒ xī wàng nǐ zì jǐ bāng tóng xué zhǎo gēn shè jì zuì xiāng guān de",id:"Pada akhirnya kamu masih mungkin menggunakan metode kuesioner, jadi saya harap kamu sendiri cari yang paling relevan dengan desain."},
{cat:"TESIS",zh:"你一定要多閱讀，你沒有多閱讀，你絕對問題有限。",py:"nǐ yī dìng yào duō yuè dú nǐ méi yǒu duō yuè dú nǐ jué duì wèn tí yǒu xiàn",id:"Kamu harus banyak membaca, kalau tidak banyak membaca pertanyaan-pertanyaanmu pasti terbatas."},
{cat:"TESIS",zh:"論文寫不出來不是因為上了沈老師的課你論文馬上就寫出來，沒有這種事的。",py:"lùn wén xiě bù chū lái bù shì yīn wèi shàng le shěn lǎo shī de kè nǐ lùn wén mǎ shàng jiù xiě chū lái méi yǒu zhè zhǒng shì de",id:"Tidak bisa menulis tesis bukan karena sudah ikut kelas saya lalu langsung bisa nulis tesis, tidak ada yang seperti itu."},
{cat:"TESIS",zh:"我可以告訴你方法，可是你自己要去做，時間管理是你的，不是我的。",py:"wǒ kě yǐ gào sù nǐ fāng fǎ kě shì nǐ zì jǐ yào qù zuò shí jiān guǎn lǐ shì nǐ de bù shì wǒ de",id:"Saya bisa beritahu caranya, tapi kamu sendiri yang harus melakukannya, manajemen waktu adalah milikmu, bukan milikku."},
{cat:"TESIS",zh:"大部分都拖到2到3年，準時2年以內畢業很少。",py:"dà bù fēn dōu tuō dào dào nián zhǔn shí nián yǐ nèi bì yè hěn shǎo",id:"Kebanyakan molor sampai 2-3 tahun, sangat jarang yang selesai tepat waktu dalam 2 tahun."},
{cat:"TESIS",zh:"你同一時間進來，不一定同一時間出得去，所以是你自己時間管理的問題。",py:"nǐ tóng yī shí jiān jìn lái bù yī dìng tóng yī shí jiān chū dé qù suǒ yǐ shì nǐ zì jǐ shí jiān guǎn lǐ de wèn tí",id:"Masuk bersamaan tidak berarti keluar bersamaan, itu masalah manajemen waktu kamu sendiri."},
{cat:"TESIS",zh:"做創作呢，你可能要有一個展演或者是參加一個比賽的證明。",py:"zuò chuàng zuò ne nǐ kě néng yào yǒu yī gè zhǎn yǎn huò zhě shì cān jiā yī gè bǐ sài de zhèng míng",id:"Untuk karya kreatif, kamu mungkin perlu bukti pertunjukan atau mengikuti kompetisi."},
{cat:"TESIS",zh:"做論文的可能要參加某個研討會去發表，你要有這樣的資格門檻才可以提出口考。",py:"zuò lùn wén de kě néng yào cān jiā mǒu gè yán tǎo huì qù fā biǎo nǐ yào yǒu zhè yàng de zī gé mén kǎn cái kě yǐ tí chū kǒu kǎo",id:"Untuk penulisan tesis perlu ikut seminar untuk presentasi, kamu butuh kualifikasi seperti itu baru bisa mengajukan ujian lisan."},
{cat:"TESIS",zh:"不要急著找老師，每一個老師都去談談看，哪一個跟你的理念比較合適。",py:"bù yào jí zhù zhǎo lǎo shī měi yī gè lǎo shī dōu qù tán tán kàn nǎ yī gè gēn nǐ de lǐ niàn bǐ jiào hé shì",id:"Jangan terburu-buru mencari dosen pembimbing, coba ngobrol dengan setiap dosen dulu, mana yang paling cocok dengan ide kamu."},
{cat:"TESIS",zh:"你本來選了 A，後來又覺得不合適，就再換了 B，就是會耽誤了一些時間。",py:"nǐ běn lái xuǎn le hòu lái yòu jué dé bù hé shì jiù zài huàn le jiù shì huì dān wù le yī xiē shí jiān",id:"Kamu awalnya pilih A, lalu merasa tidak cocok, lalu ganti ke B, itu akan membuang waktu."},
{cat:"TESIS",zh:"除非已經有老師拉你，你覺得還不錯，不然我都鼓勵同學不要太急著找老師。",py:"chú fēi yǐ jīng yǒu lǎo shī lā nǐ nǐ jué dé hái bù cuò bù rán wǒ dōu gǔ lì tóng xué bù yào tài jí zhù zhǎo lǎo shī",id:"Kecuali sudah ada dosen yang mengajak kamu dan kamu rasa oke, kalau tidak saya selalu anjurkan mahasiswa jangan terburu cari pembimbing."},
{cat:"TESIS",zh:"每一個老師都去談談看，哪一個跟你的坐的方向比較契合，你再去選。",py:"měi yī gè lǎo shī dōu qù tán tán kàn nǎ yī gè gēn nǐ de zuò de fāng xiàng bǐ jiào qì hé nǐ zài qù xuǎn",id:"Coba ngobrol dengan setiap dosen dulu, mana yang arah penelitiannya lebih cocok dengan kamu, baru kamu pilih."},
{cat:"TESIS",zh:"比較懶惰的，你要找能夠盯住的、穩定的老師，因為你自己的狀況你最清楚。",py:"bǐ jiào lǎn duò de nǐ yào zhǎo néng gòu dīng zhù de wěn dìng de lǎo shī yīn wèi nǐ zì jǐ de zhuàng kuàng nǐ zuì qīng chǔ",id:"Yang agak malas, kamu perlu cari dosen yang bisa mengawasi dan konsisten, karena kamu paling tahu kondisimu sendiri."},
{cat:"TESIS",zh:"像嘉軒，他就是很認真，他就是要2210個月畢業，他已經知道自己要做什麼，只是需要老師去跑一下流程。",py:"xiàng jiā xuān tā jiù shì hěn rèn zhēn tā jiù shì yào gè yuè bì yè tā yǐ jīng zhī dào zì jǐ yào zuò shén me zhǐ shì xū yào lǎo shī qù pǎo yī xià liú chéng",id:"Seperti Jiaxuan, dia sangat serius, dia ingin lulus 22 bulan, dia sudah tahu mau buat apa, hanya butuh dosen untuk menjalankan prosedurnya."},
{cat:"TESIS",zh:"目前你一定沒有什麼特定想法，可是通常都會延續大學專題的方向或者之前的工作方向。",py:"mù qián nǐ yī dìng méi yǒu shén me tè dìng xiǎng fǎ kě shì tōng cháng dōu huì yán xù dà xué zhuān tí de fāng xiàng huò zhě zhī qián de gōng zuò fāng xiàng",id:"Sekarang kamu pasti belum punya ide khusus, tapi biasanya melanjutkan arah proyek skripsi atau arah kerja sebelumnya."},
{cat:"TESIS",zh:"很多人說我要做 AR，好看了很多，AI 看多了，他不知道做什麼，然後說絕對不要做 AI。",py:"hěn duō rén shuō wǒ yào zuò hǎo kàn le hěn duō kàn duō le tā bù zhī dào zuò shén me rán hòu shuō jué duì bù yào zuò",id:"Banyak yang bilang mau buat AR, sudah lihat banyak, terlalu banyak lihat AI, lalu tidak tahu mau buat apa, terus bilang pasti tidak mau buat AI."},
{cat:"TESIS",zh:"沒有什麼題目是好做的，也沒有什麼題目是不能做的，重點你想 shift 在什麼地方。",py:"méi yǒu shén me tí mù shì hǎo zuò de yě méi yǒu shén me tí mù shì bù néng zuò de zhòng diǎn nǐ xiǎng zài shén me dì fāng",id:"Tidak ada topik yang mudah, juga tidak ada topik yang tidak bisa dikerjakan, intinya kamu mau fokus di mana."},
{cat:"TESIS",zh:"你要多看，你沒有多看，你絕對問題有限。",py:"nǐ yào duō kàn nǐ méi yǒu duō kàn nǐ jué duì wèn tí yǒu xiàn",id:"Kamu harus banyak melihat, kalau tidak banyak melihat, pertanyaan-pertanyaanmu pasti terbatas."},
{cat:"TESIS",zh:"你可以問 AI，但是重點就是你要弄懂，你不懂是沒有用的。",py:"nǐ kě yǐ wèn dàn shì zhòng diǎn jiù shì nǐ yào nòng dǒng nǐ bù dǒng shì méi yǒu yòng de",id:"Kamu bisa tanya AI, tapi intinya kamu harus mengerti, kalau tidak mengerti tidak ada gunanya."},
{cat:"TESIS",zh:"老師跳得太快，請你也跟我講好，請你也跟我講喔。",py:"lǎo shī tiào dé tài kuài qǐng nǐ yě gēn wǒ jiǎng hǎo qǐng nǐ yě gēn wǒ jiǎng ō",id:"Kalau guru terlalu cepat, tolong beritahu saya ya, tolong beritahu saya ya."},
{cat:"TESIS",zh:"嘉軒是非常認真的同學，上學期畢業，終於，還蠻辛苦的，他是直升的，沒有工作經驗。",py:"jiā xuān shì fēi cháng rèn zhēn de tóng xué shàng xué qī bì yè zhōng yú hái mán xīn kǔ de tā shì zhí shēng de méi yǒu gōng zuò jīng yàn",id:"Jiaxuan adalah mahasiswa yang sangat serius, semester lalu lulus, akhirnya, cukup berat perjuangannya, dia langsung lanjut S2, tidak punya pengalaman kerja."},
{cat:"TESIS",zh:"整理資料不在於多，在於你自己能夠看清楚多少。好，當然，看的那一本可能很難懂。",py:"zhěng lǐ zī liào bù zài yú duō zài yú nǐ zì jǐ néng gòu kàn qīng chǔ duō shǎo hǎo dāng rán kàn de nà yī běn kě néng hěn nán dǒng",id:"Mengorganisir data bukan soal banyaknya, tapi seberapa jelas kamu bisa memahaminya. Dan tentu, buku yang dibaca mungkin sulit dipahami."},
{cat:"TESIS",zh:"你要縫你不懂是沒有用的，你可能會以為你懂了，但是自己整理資料，有沒有可能自己還是會忘記的。",py:"nǐ yào fèng nǐ bù dǒng shì méi yǒu yòng de nǐ kě néng huì yǐ wèi nǐ dǒng le dàn shì zì jǐ zhěng lǐ zī liào yǒu méi yǒu kě néng zì jǐ hái shì huì wàng jì de",id:"Kalau kamu tidak mengerti tidak ada gunanya, kamu mungkin pikir sudah mengerti, tapi mengorganisir data sendiri, ada kemungkinan kamu masih bisa lupa."},
{cat:"TESIS",zh:"你要縫你不懂是沒有用的，所以你一定要花時間下去想。",py:"nǐ yào fèng nǐ bù dǒng shì méi yǒu yòng de suǒ yǐ nǐ yī dìng yào huā shí jiān xià qù xiǎng",id:"Kalau kamu hanya hafal tanpa mengerti tidak ada gunanya, jadi kamu harus luangkan waktu untuk benar-benar memikirkannya."},
{cat:"TESIS",zh:"準時2年內畢業是指畢業在2年以內，因為他是本來就很清楚，要做什麼，而且他做事非常認真。",py:"zhǔn shí nián nèi bì yè shì zhǐ bì yè zài nián yǐ nèi yīn wèi tā shì běn lái jiù hěn qīng chǔ yào zuò shén me ér qiě tā zuò shì fēi cháng rèn zhēn",id:"Lulus tepat waktu dalam 2 tahun artinya selesai sebelum 2 tahun, karena dia memang sudah sangat jelas mau buat apa, dan dia sangat serius dalam mengerjakan."},
{cat:"TESIS",zh:"大家最常用的就那幾個：問卷調查法、訪談法、焦點團體法，同學選的都差不多。",py:"dà jiā zuì cháng yòng de jiù nà jǐ gè wèn juǎn diào chá fǎ fǎng tán fǎ jiāo diǎn tuán tǐ fǎ tóng xué xuǎn de dōu chà bù duō",id:"Yang paling sering dipakai semua orang hanya beberapa: survei kuesioner, wawancara, focus group discussion, pilihan mahasiswa hampir sama."},
{cat:"TESIS",zh:"如果每個人選的或多或少一樣，到學期末的時候，每個人提報一遍，這本書是不是就等於用完了。",py:"rú guǒ měi gè rén xuǎn de huò duō huò shǎo yī yàng dào xué qī mò de shí hòu měi gè rén tí bào yī biàn zhè běn shū shì bù shì jiù děng yú yòng wán le",id:"Kalau semua orang pilih yang kurang lebih sama, di akhir semester, setiap orang presentasi sekali, bukunya jadi seolah sudah habis dipelajari."},
{cat:"TESIS",zh:"有些人喜歡用圖案，有些人不喜歡用圖案，他跟我講說老師我真的認真看了很久哦，那整理資料不在於多。",py:"yǒu xiē rén xǐ huān yòng tú àn yǒu xiē rén bù xǐ huān yòng tú àn tā gēn wǒ jiǎng shuō lǎo shī wǒ zhēn de rèn zhēn kàn le hěn jiǔ ó nà zhěng lǐ zī liào bù zài yú duō",id:"Ada yang suka pakai gambar, ada yang tidak suka pakai gambar, dia bilang guru saya benar-benar baca lama lho, nah mengorganisir data bukan soal banyaknya."},
{cat:"TESIS",zh:"以後有機會，因為他要跟老師去福岡11月去福岡發表，因為剛好我也要去。",py:"yǐ hòu yǒu jī huì yīn wèi tā yào gēn lǎo shī qù fú gāng yuè qù fú gāng fā biǎo yīn wèi gāng hǎo wǒ yě yào qù",id:"Ke depan ada kesempatan, karena dia akan ikut guru ke Fukuoka November untuk presentasi, kebetulan saya juga mau pergi."},
// ── ADMINISTRASI ──
{cat:"ADMIN",zh:"東西寫出來了，一定要上傳到圖書館，圖書館會幫你做一個論文原創性的比對系統。",py:"dōng xī xiě chū lái le yī dìng yào shàng chuán dào tú shū guǎn tú shū guǎn huì bāng nǐ zuò yī gè lùn wén yuán chuàng xìng de bǐ duì xì tǒng",id:"Setelah selesai ditulis, harus diunggah ke perpustakaan, perpustakaan akan membantu cek sistem keaslian tesis."},
{cat:"ADMIN",zh:"如果36%是太高，一般是要13以下會比較好，就是說你有沒有跟人家的論文相似。",py:"rú guǒ shì tài gāo yī bān shì yào yǐ xià huì bǐ jiào hǎo jiù shì shuō nǐ yǒu méi yǒu gēn rén jiā de lùn wén xiāng shì",id:"Kalau 36% itu terlalu tinggi, umumnya di bawah 13% lebih baik, artinya apakah tesismu mirip dengan tesis orang lain."},
{cat:"ADMIN",zh:"研究倫理就是6個小時，你可以上臺灣學術倫理教育資源，免費的，但是你要註冊。",py:"yán jiū lún lǐ jiù shì gè xiǎo shí nǐ kě yǐ shàng tái wān xué shù lún lǐ jiào yù zī yuán miǎn fèi de dàn shì nǐ yào zhù cè",id:"Etika penelitian itu 6 jam, bisa ikut di sumber pendidikan etika akademik Taiwan, gratis tapi harus daftar."},
{cat:"ADMIN",zh:"他會給你一張數位的證明，你要這個你才可以提出口考。",py:"tā huì gěi nǐ yī zhāng shù wèi de zhèng míng nǐ yào zhè gè nǐ cái kě yǐ tí chū kǒu kǎo",id:"Mereka akan memberi kamu sertifikat digital, kamu butuh ini baru bisa mengajukan ujian lisan."},
{cat:"ADMIN",zh:"論文比對系統在6、7月大塞車，你口考完之後還要再上傳繳交一些文件。",py:"lùn wén bǐ duì xì tǒng zài yuè dà sāi chē nǐ kǒu kǎo wán zhī hòu hái yào zài shàng chuán jiǎo jiāo yī xiē wén jiàn",id:"Sistem pembandingan tesis di bulan 6-7 sangat macet, setelah ujian lisan kamu masih harus unggah dan serahkan beberapa dokumen."},
{cat:"ADMIN",zh:"假設你全部弄完，731以前就可以順利拿到畢業證書。",py:"jiǎ shè nǐ quán bù nòng wán yǐ qián jiù kě yǐ shùn lì ná dào bì yè zhèng shū",id:"Asumsi kamu selesaikan semuanya, sebelum 31 Juli kamu bisa terima ijazah dengan lancar."},
{cat:"ADMIN",zh:"如果有任何一個步驟沒有完成，那你就是要到8、9月才有辦法拿到畢業證書。",py:"rú guǒ yǒu rèn hé yī gè bù zhòu méi yǒu wán chéng nà nǐ jiù shì yào dào yuè cái yǒu bàn fǎ ná dào bì yè zhèng shū",id:"Kalau ada salah satu langkah yang belum selesai, kamu baru bisa dapat ijazah di bulan 8-9."},
{cat:"ADMIN",zh:"口考完成之後，你要自己去跑，不管你女朋友、家人，大部分都自己弄。",py:"kǒu kǎo wán chéng zhī hòu nǐ yào zì jǐ qù pǎo bù guǎn nǐ nǚ péng yǒu jiā rén dà bù fēn dōu zì jǐ nòng",id:"Setelah ujian lisan selesai, kamu harus urus sendiri, tidak peduli pacar atau keluarga, sebagian besar urus sendiri."},
{cat:"ADMIN",zh:"論文摘要跟關鍵詞，都是要英文的版本，不是只有中文的，要附在那一本碩論的最後。",py:"lùn wén zhāi yào gēn guān jiàn cí dōu shì yào yīng wén de bǎn běn bù shì zhǐ yǒu zhōng wén de yào fù zài nà yī běn shuò lùn de zuì hòu",id:"Abstrak tesis dan kata kunci harus ada versi bahasa Inggrisnya, tidak cukup hanya Mandarin, harus dilampirkan di akhir tesis."},
{cat:"ADMIN",zh:"這個 template 都有在系網的上面，你要 download 最新的。",py:"zhè gè dōu yǒu zài xì wǎng de shàng miàn nǐ yào zuì xīn de",id:"Template ini semua ada di website jurusan, kamu harus download yang terbaru."},
{cat:"ADMIN",zh:"碩生在11月底就要確定指導老師，系上會告訴班代，然後班代通知同學。",py:"shuò shēng zài yuè dǐ jiù yào què dìng zhǐ dǎo lǎo shī xì shàng huì gào sù bān dài rán hòu bān dài tōng zhī tóng xué",id:"Mahasiswa S2 harus konfirmasi dosen pembimbing di akhir November, departemen akan beritahu ketua kelas, lalu ketua kelas kasih tahu mahasiswa."},
{cat:"ADMIN",zh:"我只是一個授課老師，你的選課系統跟我沒關係，我的系統也進不去。",py:"wǒ zhǐ shì yī gè shòu kè lǎo shī nǐ de xuǎn kè xì tǒng gēn wǒ méi guān xì wǒ de xì tǒng yě jìn bù qù",id:"Saya hanya dosen pengajar, sistem pemilihan mata kuliah kamu tidak ada hubungannya dengan saya, saya juga tidak bisa masuk sistemnya."},
{cat:"ADMIN",zh:"你的15000元不是都到我口袋裡，那是繳給教務處的。",py:"nǐ de yuán bù shì dōu dào wǒ kǒu dài lǐ nà shì jiǎo gěi jiào wù chù de",id:"15.000 NT kamu tidak masuk semua ke kantong saya, itu dibayarkan ke Bagian Akademik."},
{cat:"ADMIN",zh:"我只是一個企業下的員工，所以你的學費不知道我口袋，我怎麼幫你發畢業證書？",py:"wǒ zhǐ shì yī gè qǐ yè xià de yuán gōng suǒ yǐ nǐ de xué fèi bù zhī dào wǒ kǒu dài wǒ zěn me bāng nǐ fā bì yè zhèng shū",id:"Saya hanya karyawan di bawah institusi, jadi biaya kuliahmu tidak masuk kantong saya, bagaimana saya bisa kasih kamu ijazah?"},
{cat:"ADMIN",zh:"加退學，那個步驟我不可能幫你加，我沒有辦法進入那個系統，我也不是學生身份。",py:"jiā tuì xué nà gè bù zhòu wǒ bù kě néng bāng nǐ jiā wǒ méi yǒu bàn fǎ jìn rù nà gè xì tǒng wǒ yě bù shì xué shēng shēn fèn",id:"Tambah atau drop mata kuliah, prosedur itu tidak mungkin saya lakukan untuk kamu, saya tidak bisa masuk sistem itu, saya juga bukan dengan status mahasiswa."},
{cat:"ADMIN",zh:"你的畢業，這些要繳交：原創性比對、研究倫理證書、口考成績，還有論文。這些東西要自己跑，不是系上幫你弄。",py:"nǐ de bì yè zhè xiē yào jiǎo jiāo yuán chuàng xìng bǐ duì yán jiū lún lǐ zhèng shū kǒu kǎo chéng jī hái yǒu lùn wén zhè xiē dōng xī yào zì jǐ pǎo bù shì xì shàng bāng nǐ nòng",id:"Kelulusanmu, hal-hal yang harus diserahkan: uji keaslian, sertifikat etika penelitian, nilai ujian lisan, dan tesis. Semua ini harus kamu urus sendiri, bukan departemen yang urus."},
{cat:"ADMIN",zh:"你在投考的時候你不用布置嗎？你叫我布置嗎？我不可能幫你布置啊，那個都不用時間嗎？",py:"nǐ zài tóu kǎo de shí hòu nǐ bù yòng bù zhì ma nǐ jiào wǒ bù zhì ma wǒ bù kě néng bāng nǐ bù zhì a nà gè dōu bù yòng shí jiān ma",id:"Waktu ujian kamu tidak perlu atur ruangan? Kamu minta saya atur? Saya tidak mungkin atur untuk kamu, itu tidak butuh waktu?"},
{cat:"ADMIN",zh:"你要邀我當口委，我也不見得有時間，你不能說你要的老師一定要在你想要的時間來。",py:"nǐ yào yāo wǒ dāng kǒu wěi wǒ yě bù jiàn dé yǒu shí jiān nǐ bù néng shuō nǐ yào de lǎo shī yī dìng yào zài nǐ xiǎng yào de shí jiān lái",id:"Kamu mau undang saya jadi penguji, saya belum tentu ada waktu, kamu tidak bisa bilang dosen yang kamu mau harus datang di waktu yang kamu inginkan."},
{cat:"ADMIN",zh:"56月是我的忘記好，那個就是我的口考忘記，7月我通常就不做。",py:"yuè shì wǒ de wàng jì hǎo nà gè jiù shì wǒ de kǒu kǎo wàng jì yuè wǒ tōng cháng jiù bù zuò",id:"Bulan 5-6 itu jadwal ujian lisan saya yang sudah penuh, bulan 7 saya biasanya tidak terima lagi."},
{cat:"ADMIN",zh:"太趕我也暑假，我有別的行程，所以我通常對我來講，56月是我的忘記好。",py:"tài gǎn wǒ yě shǔ jiǎ wǒ yǒu bié de xíng chéng suǒ yǐ wǒ tōng cháng duì wǒ lái jiǎng yuè shì wǒ de wàng jì hǎo",id:"Terlalu terburu-buru dan saya juga liburan musim panas, ada jadwal lain, jadi biasanya bagi saya bulan 5-6 itu sudah penuh."},
{cat:"ADMIN",zh:"你既然講了這個學費進來，你投資的這兩年，你的確要把自己搞畢業。",py:"nǐ jì rán jiǎng le zhè gè xué fèi jìn lái nǐ tóu zī de zhè liǎng nián nǐ de què yào bǎ zì jǐ gǎo bì yè",id:"Karena kamu sudah bayar biaya kuliah dan masuk, investasi 2 tahun ini, kamu memang harus bisa wisudakan dirimu sendiri."},
{cat:"ADMIN",zh:"你還有學倫喔，這個法規應該會有再更改一點點，可是大部分不會離太遠。",py:"nǐ hái yǒu xué lún ō zhè gè fǎ guī yīng gāi huì yǒu zài gèng gǎi yī diǎn diǎn kě shì dà bù fēn bù huì lí tài yuǎn",id:"Kamu masih ada etika penelitian ya, peraturan ini mungkin akan sedikit berubah, tapi kebanyakan tidak akan jauh berbeda."},
{cat:"ADMIN",zh:"你要去正式繳交之前，你可能3、4月就要送了，所以不知道同學你還有學倫哦。",py:"nǐ yào qù zhèng shì jiǎo jiāo zhī qián nǐ kě néng yuè jiù yào sòng le suǒ yǐ bù zhī dào tóng xué nǐ hái yǒu xué lún ó",id:"Sebelum kamu menyerahkan secara resmi, mungkin bulan 3-4 sudah harus dikirim, jadi tidak tahu mahasiswa apakah kamu masih punya etika penelitian ya."},
{cat:"ADMIN",zh:"口考的時候你的錄影，還有你在口考的時候，如果要布置場地那都是你自己要準備的。",py:"kǒu kǎo de shí hòu nǐ de lù yǐng hái yǒu nǐ zài kǒu kǎo de shí hòu rú guǒ yào bù zhì chǎng dì nà dōu shì nǐ zì jǐ yào zhǔn bèi de",id:"Saat ujian lisan rekaman videonya, dan saat ujian lisan, kalau perlu tata ruangan itu semua yang harus kamu siapkan sendiri."},
{cat:"ADMIN",zh:"我只能告訴你 know how，但是執行的人是你，你了解嗎？",py:"wǒ zhǐ néng gào sù nǐ dàn shì zhí xíng de rén shì nǐ nǐ le jiě ma",id:"Saya hanya bisa memberitahu cara-caranya, tapi yang mengerjakan adalah kamu, kamu mengerti?"},
// ── NASIHAT ──
{cat:"NASIHAT",zh:"你要想想看你為什麼要投資這2年，這2年不見得能夠準時畢業。",py:"nǐ yào xiǎng xiǎng kàn nǐ wèi shén me yào tóu zī zhè nián zhè nián bù jiàn dé néng gòu zhǔn shí bì yè",id:"Pikirkan mengapa kamu mau investasikan 2 tahun ini, 2 tahun belum tentu bisa lulus tepat waktu."},
{cat:"NASIHAT",zh:"你同樣花2年，你自己去工作，因為你們學費不便宜。",py:"nǐ tóng yàng huā nián nǐ zì jǐ qù gōng zuò yīn wèi nǐ men xué fèi bù biàn yí",id:"Untuk 2 tahun yang sama kamu bisa kerja, karena biaya kuliah kalian tidak murah."},
{cat:"NASIHAT",zh:"你來這裡一定有某種的原因，你是要來圓夢的還是當跳板還是怎麼樣的。",py:"nǐ lái zhè lǐ yī dìng yǒu mǒu zhǒng de yuán yīn nǐ shì yào lái yuán mèng de hái shì dāng tiào bǎn hái shì zěn me yàng de",id:"Kamu pasti punya alasan tertentu untuk ke sini, apakah untuk mewujudkan mimpi, jembatan karir, atau apa."},
{cat:"NASIHAT",zh:"你既然來了，你就要想想看，你投資的這2年，你要怎麼回本。",py:"nǐ jì rán lái le nǐ jiù yào xiǎng xiǎng kàn nǐ tóu zī de zhè nián nǐ yào zěn me huí běn",id:"Karena sudah datang, kamu harus pikirkan, investasi 2 tahun ini, bagaimana cara mendapat balik modalnya."},
{cat:"NASIHAT",zh:"假設你到人生地不熟的地方，你要怎麼運用你的專業，你要怎麼賺錢。",py:"jiǎ shè nǐ dào rén shēng dì bù shú de dì fāng nǐ yào zěn me yùn yòng nǐ de zhuān yè nǐ yào zěn me zhuàn qián",id:"Misalkan kamu ke tempat yang asing, bagaimana kamu memanfaatkan keahlianmu, bagaimana kamu menghasilkan uang."},
{cat:"NASIHAT",zh:"我雖然不會講越南話，那至少我可以去教中文，我可以去教英文，開補習班也可以。",py:"wǒ suī rán bù huì jiǎng yuè nán huà nà zhì shǎo wǒ kě yǐ qù jiào zhōng wén wǒ kě yǐ qù jiào yīng wén kāi bǔ xí bān yě kě yǐ",id:"Walaupun saya tidak bisa bahasa Vietnam, setidaknya saya bisa mengajar Mandarin, mengajar Inggris, buka bimbel juga bisa."},
{cat:"NASIHAT",zh:"不要覺得越南落後，那個全部都是工作機會啊，我們是已經過度發展。",py:"bù yào jué dé yuè nán luò hòu nà gè quán bù dōu shì gōng zuò jī huì a wǒ men shì yǐ jīng guò dù fā zhǎn",id:"Jangan pikir Vietnam terbelakang, itu semua adalah peluang kerja, kita sudah terlalu jenuh berkembang."},
{cat:"NASIHAT",zh:"胡志明市、峴港、那個全部都是工作機會啊，我們臺灣是已經過度發展，然後少子化。",py:"hú zhì míng shì xiàn gǎng nà gè quán bù dōu shì gōng zuò jī huì a wǒ men tái wān shì yǐ jīng guò dù fā zhǎn rán hòu shǎo zi huà",id:"Ho Chi Minh City, Da Nang, itu semua peluang kerja, Taiwan kita sudah terlalu jenuh berkembang, dan populasi terus menurun."},
{cat:"NASIHAT",zh:"你輪得到嗎？每個人都想卡好的位置，但是輪得到你們嗎？",py:"nǐ lún dé dào ma měi gè rén dōu xiǎng kǎ hǎo de wèi zhì dàn shì lún dé dào nǐ men ma",id:"Apa kamu bisa dapat giliran? Semua orang mau rebut posisi bagus, tapi apa giliran kamu akan datang?"},
{cat:"NASIHAT",zh:"我們要學會跟國際人士相處，因為我們的人口真的沒辦法，那些基礎的工作一定會有人來做。",py:"wǒ men yào xué huì gēn guó jì rén shì xiāng chù yīn wèi wǒ men de rén kǒu zhēn de méi bàn fǎ nà xiē jī chǔ de gōng zuò yī dìng huì yǒu rén lái zuò",id:"Kita harus belajar bergaul dengan orang internasional, karena jumlah penduduk kita memang tidak cukup, pekerjaan-pekerjaan dasar itu pasti akan ada yang datang mengisi."},
{cat:"NASIHAT",zh:"就像我們到東南亞去工作被公司派遣那樣，所以我們一定要學會跟國際的人相處。",py:"jiù xiàng wǒ men dào dōng nán yà qù gōng zuò bèi gōng sī pài qiǎn nà yàng suǒ yǐ wǒ men yī dìng yào xué huì gēn guó jì de rén xiāng chù",id:"Seperti kita pergi bekerja ke Asia Tenggara dikirim oleh perusahaan, jadi kita harus belajar bergaul dengan orang internasional."},
{cat:"NASIHAT",zh:"臺灣相對的安全，但是任何事情都有可能發生，自己也要小心。",py:"tái wān xiāng duì de ān quán dàn shì rèn hé shì qíng dōu yǒu kě néng fā shēng zì jǐ yě yào xiǎo xīn",id:"Taiwan relatif aman, tapi hal apapun bisa terjadi, kamu juga harus berhati-hati."},
{cat:"NASIHAT",zh:"你要把大學生的心態拿來做碩論，碩論是要自己付出的，要勤勞一點，不是永遠坐在背後聽。",py:"nǐ yào bǎ dà xué shēng de xīn tài ná lái zuò shuò lùn shuò lùn shì yào zì jǐ fù chū de yào qín láo yī diǎn bù shì yǒng yuǎn zuò zài bèi hòu tīng",id:"Kamu tidak boleh pakai mentalitas mahasiswa S1 untuk tesis S2, tesis harus dikerjakan sendiri, harus lebih rajin, bukan selalu duduk di belakang saja mendengarkan."},
{cat:"NASIHAT",zh:"你不能說啊，我怪老師，怨天怨地，就不會怨自己，那個都是個人的因素。",py:"nǐ bù néng shuō a wǒ guài lǎo shī yuàn tiān yuàn dì jiù bù huì yuàn zì jǐ nà gè dōu shì gè rén de yīn sù",id:"Kamu tidak bisa menyalahkan dosen, menyalahkan ini itu, tapi tidak salahkan diri sendiri, itu semua faktor pribadi."},
{cat:"NASIHAT",zh:"時間是你的還是我的？我沒有擦啊，你就是要配合我在這22年。",py:"shí jiān shì nǐ de hái shì wǒ de wǒ méi yǒu cā a nǐ jiù shì yào pèi hé wǒ zài zhè nián",id:"Waktu itu punyamu atau punyaku? Saya tidak yang minta, kamu yang memilih menemani saya dalam 22 tahun ini."},
{cat:"NASIHAT",zh:"碩論是你這一生可能最後一次念書的機會，如果你不想念博士的話，你就好好的珍惜。",py:"shuò lùn shì nǐ zhè yī shēng kě néng zuì hòu yī cì niàn shū de jī huì rú guǒ nǐ bù xiǎng niàn bó shì de huà nǐ jiù hǎo hǎo de zhēn xī",id:"Tesis S2 mungkin adalah kesempatan belajar terakhirmu seumur hidup, kalau tidak mau lanjut S3, manfaatkan dengan baik."},
{cat:"NASIHAT",zh:"AI 對我來講只是一個工具，我不會因為 AI 走投無路，因為我還有其他能力。",py:"duì wǒ lái jiǎng zhǐ shì yī gè gōng jù wǒ bù huì yīn wèi zǒu tóu wú lù yīn wèi wǒ hái yǒu qí tā néng lì",id:"AI bagi saya hanya sebuah alat, saya tidak akan terdesak karena AI, karena saya masih punya kemampuan lain."},
{cat:"NASIHAT",zh:"就算臺灣的學校關了，我也可以去別的學校教書，我不排除去越南，只要能夠講英語就可以去。",py:"jiù suàn tái wān de xué xiào guān le wǒ yě kě yǐ qù bié de xué xiào jiào shū wǒ bù pái chú qù yuè nán zhǐ yào néng gòu jiǎng yīng yǔ jiù kě yǐ qù",id:"Walaupun sekolah di Taiwan tutup, saya bisa pergi mengajar di sekolah lain, saya tidak menutup kemungkinan ke Vietnam, selama bisa berbicara bahasa Inggris bisa pergi."},
{cat:"NASIHAT",zh:"你不要覺得他皮膚比我們黑，他們就比我們落後，臺灣不見得是好的環境。",py:"nǐ bù yào jué dé tā pí fū bǐ wǒ men hēi tā men jiù bǐ wǒ men luò hòu tái wān bù jiàn dé shì hǎo de huán jìng",id:"Jangan pikir karena kulitnya lebih gelap dari kita, mereka lebih terbelakang dari kita, Taiwan belum tentu lingkungan yang bagus."},
{cat:"NASIHAT",zh:"臺灣不見得是好的環境，地震啊、斷電、缺水，一大堆問題對不對。",py:"tái wān bù jiàn dé shì hǎo de huán jìng dì zhèn a duàn diàn quē shuǐ yī dà duī wèn tí duì bù duì",id:"Taiwan belum tentu lingkungan yang bagus, gempa, mati lampu, kekurangan air, banyak masalah kan."},
{cat:"NASIHAT",zh:"我會鼓勵同學多看多走，認識一點，我覺得也蠻不錯的。",py:"wǒ huì gǔ lì tóng xué duō kàn duō zǒu rèn shí yī diǎn wǒ jué dé yě mán bù cuò de",id:"Saya akan dorong mahasiswa untuk banyak melihat dan berjalan, mengenal sedikit lebih banyak, saya rasa itu cukup bagus."},
{cat:"NASIHAT",zh:"你自己最實在，真的，不要想別人，老師也好，同學誰誰誰也好，你自己最實在。",py:"nǐ zì jǐ zuì shí zài zhēn de bù yào xiǎng bié rén lǎo shī yě hǎo tóng xué shuí shuí shuí yě hǎo nǐ zì jǐ zuì shí zài",id:"Dirimu sendiri yang paling nyata, benar-benar, jangan pikirkan orang lain, guru ataupun teman siapapun, dirimu sendiri yang paling nyata."},
{cat:"NASIHAT",zh:"我可能不是完美的機器人，我可能也會犯錯誤，可能速度不夠快，講話可能沒辦法讓你理解。",py:"wǒ kě néng bù shì wán měi de jī qì rén wǒ kě néng yě huì fàn cuò wù kě néng sù dù bù gòu kuài jiǎng huà kě néng méi bàn fǎ ràng nǐ lǐ jiě",id:"Saya mungkin bukan mesin yang sempurna, saya mungkin juga akan membuat kesalahan, mungkin kecepatan tidak cukup, bicara mungkin tidak bisa membuatmu mengerti."},
{cat:"NASIHAT",zh:"那你心裡也跟我講，我願意聽，但是就是你要讓我知道你的難處在哪。",py:"nà nǐ xīn lǐ yě gēn wǒ jiǎng wǒ yuàn yì tīng dàn shì jiù shì nǐ yào ràng wǒ zhī dào nǐ de nán chù zài nǎ",id:"Nah itu ceritakan juga ke saya, saya mau mendengarkan, tapi kamu harus beri tahu saya di mana kesulitanmu."},
{cat:"NASIHAT",zh:"作文你沒有看文章你就寫得出來嗎？你覺得不可能啊，你要多閱讀才寫得出來啊。",py:"zuò wén nǐ méi yǒu kàn wén zhāng nǐ jiù xiě dé chū lái ma nǐ jué dé bù kě néng a nǐ yào duō yuè dú cái xiě dé chū lái a",id:"Karangan tanpa membaca artikel kamu bisa menulis? Menurutmu tidak mungkin kan, kamu harus banyak membaca baru bisa menulis."},
{cat:"NASIHAT",zh:"Reset 好自己的心情，不要永遠只想當 NPC，你要把大學生的心態放下。",py:"hǎo zì jǐ de xīn qíng bù yào yǒng yuǎn zhǐ xiǎng dāng nǐ yào bǎ dà xué shēng de xīn tài fàng xià",id:"Reset suasana hatimu, jangan selalu hanya mau jadi NPC, kamu harus melepaskan mentalitas mahasiswa S1."},
{cat:"NASIHAT",zh:"碩論是要自己付出的，要勤勞一點，不是永遠坐在背後哦，那聽一聽哦。",py:"shuò lùn shì yào zì jǐ fù chū de yào qín láo yī diǎn bù shì yǒng yuǎn zuò zài bèi hòu ó nà tīng yī tīng ó",id:"Tesis S2 harus dikerjakan sendiri, harus lebih rajin, bukan selalu duduk di belakang saja, dengar-dengarin ya."},
{cat:"NASIHAT",zh:"我跟你講，你絕對寫不出來，所以你要想清楚，你到底為什麼要念碩士。",py:"wǒ gēn nǐ jiǎng nǐ jué duì xiě bù chū lái suǒ yǐ nǐ yào xiǎng qīng chǔ nǐ dào dǐ wèi shén me yào niàn shuò shì",id:"Saya bilang ke kamu, kamu pasti tidak akan bisa menulis, jadi kamu harus pikir jelas, sebenarnya kenapa kamu mau ambil S2."},
{cat:"NASIHAT",zh:"你有沒有辦法做設計相關的東西，在跟同學講一下，因為 homework 的工作一定要落實。",py:"nǐ yǒu méi yǒu bàn fǎ zuò shè jì xiāng guān de dōng xī zài gēn tóng xué jiǎng yī xià yīn wèi de gōng zuò yī dìng yào luò shí",id:"Bisakah kamu membuat sesuatu yang berkaitan dengan desain, ingatkan teman-teman juga, karena pekerjaan rumah harus benar-benar dilaksanakan."},
{cat:"NASIHAT",zh:"你要不要去做長照、殯葬，那也是蠻神聖的一個工作，你願不願意？",py:"nǐ yào bù yào qù zuò zhǎng zhào bìn zàng nà yě shì mán shén shèng de yī gè gōng zuò nǐ yuàn bù yuàn yì",id:"Apakah kamu mau kerja di perawatan lansia, pemakaman, itu juga pekerjaan yang cukup mulia, maukah kamu?"},
{cat:"NASIHAT",zh:"那些基礎的工作是要做的，我們要學會對，不要鄙視就是說國際的人士來臺灣工作。",py:"nà xiē jī chǔ de gōng zuò shì yào zuò de wǒ men yào xué huì duì bù yào bǐ shì jiù shì shuō guó jì de rén shì lái tái wān gōng zuò",id:"Pekerjaan-pekerjaan dasar itu harus ada yang mengerjakan, kita harus belajar menghargai, jangan meremehkan orang internasional yang datang bekerja ke Taiwan."},
{cat:"NASIHAT",zh:"現在才是開始哦，放輕鬆，你要覺得你自己的強項是什麼先把它做起來。",py:"xiàn zài cái shì kāi shǐ ó fàng qīng sōng nǐ yào jué dé nǐ zì jǐ de qiáng xiàng shì shén me xiān bǎ tā zuò qǐ lái",id:"Ini baru awal, santai saja, kamu perlu tahu apa kelebihan dirimu sendiri, mulai dari situ dulu."},
{cat:"NASIHAT",zh:"你上我的課應該是感覺像三溫暖，就是老師跟你講一些很恐怖的，然後又說摸摸，你不用擔心。",py:"nǐ shàng wǒ de kè yīng gāi shì gǎn jué xiàng sān wēn nuǎn jiù shì lǎo shī gēn nǐ jiǎng yī xiē hěn kǒng bù de rán hòu yòu shuō mō mō nǐ bù yòng dān xīn",id:"Ikut kelas saya harusnya terasa seperti sauna, guru bicara hal-hal yang menakutkan, lalu bilang tenang saja, tidak perlu khawatir."},
{cat:"NASIHAT",zh:"準時2年畢業的，歷屆學長姐大概只有一兩個，大部分都是3年。",py:"zhǔn shí nián bì yè de lì jiè xué zhǎng jiě dà gài zhǐ yǒu yī liǎng gè dà bù fēn dōu shì nián",id:"Yang lulus tepat waktu 2 tahun, dari semua angkatan kakak tingkat hanya sekitar satu dua orang, kebanyakan 3 tahun."},
{cat:"NASIHAT",zh:"你要不要念博士也可以，但是我比較建議就是說，他再想想，因為念博士也是個蠻長遠的。",py:"nǐ yào bù yào niàn bó shì yě kě yǐ dàn shì wǒ bǐ jiào jiàn yì jiù shì shuō tā zài xiǎng xiǎng yīn wèi niàn bó shì yě shì gè mán zhǎng yuǎn de",id:"Mau lanjut S3 juga bisa, tapi saya lebih sarankan untuk dipikir ulang dulu, karena ambil S3 itu cukup panjang jalannya."},
{cat:"NASIHAT",zh:"你碩士出去，你覺得幾萬塊，你可以接受？這樣問答，你覺得4萬塊以下你可以接受舉手。",py:"nǐ shuò shì chū qù nǐ jué dé jǐ wàn kuài nǐ kě yǐ jiē shòu zhè yàng wèn dá nǐ jué dé wàn kuài yǐ xià nǐ kě yǐ jiē shòu jǔ shǒu",id:"Kamu lulus S2 keluar, menurutmu berapa puluh ribu, kamu bisa terima? Tanya jawab seperti ini, menurutmu di bawah 40 ribu kamu bisa terima angkat tangan."},
{cat:"KELAS",zh:"開學第一週第二週我請了事假，學校是有批准的，那我期末再慢慢補課好不好。",py:"kāi xué dì yī zhōu dì èr zhōu wǒ qǐng le shì jiǎ xué xiào shì yǒu pī zhǔn de nà wǒ qī mò zài màn màn bǔ kè hǎo bù hǎo",id:"Minggu pertama dan kedua kuliah saya ambil cuti, sekolah sudah menyetujui, nanti akhir semester perlahan saya ganti ya."},
{cat:"KELAS",zh:"我們把禮拜三的課，就是專考靈學分，因為都是必修，一起殺，歷屆的學長姐比較喜歡。",py:"wǒ men bǎ lǐ bài sān de kè jiù shì zhuān kǎo líng xué fēn yīn wèi dōu shì bì xiū yī qǐ shā lì jiè de xué zhǎng jiě bǐ jiào xǐ huān",id:"Kita gabungkan kelas Rabu, yaitu kredit ujian khusus, karena semua wajib, selesaikan bersama, kakak tingkat semua angkatan lebih suka begini."},
{cat:"KELAS",zh:"你不要覺得說你抱著以前大學的心態，你就是來這邊上課，然後就坐著像 NPC 一樣時間到了就換另一個場景。",py:"nǐ bù yào jué dé shuō nǐ bào zhù yǐ qián dà xué de xīn tài nǐ jiù shì lái zhè biān shàng kè rán hòu jiù zuò zhù xiàng yī yàng shí jiān dào le jiù huàn lìng yī gè chǎng jǐng",id:"Jangan berpikir dengan mentalitas kuliah S1 dulu, datang ke sini lalu duduk seperti NPC, waktunya habis pindah ke adegan lain."},
{cat:"KELAS",zh:"在我的課堂學生都是 NPC，沒有，沒有，我覺得 international student 他是較有反應。",py:"zài wǒ de kè táng xué shēng dōu shì méi yǒu méi yǒu wǒ jué dé tā shì jiào yǒu fǎn yīng",id:"Di kelas saya muridnya semua NPC, tidak tidak, saya rasa mahasiswa internasional lebih responsif."},
{cat:"KELAS",zh:"今年是人數最少的，以前都10個以上到16個18個，這就告訴我們是一個趨勢。",py:"jīn nián shì rén shù zuì shǎo de yǐ qián dōu gè yǐ shàng dào gè gè zhè jiù gào sù wǒ men shì yī gè qū shì",id:"Tahun ini jumlah paling sedikit, dulu selalu lebih dari 10 sampai 16-18 orang, ini menunjukkan sebuah tren."},
{cat:"KELAS",zh:"我覺得我人緣還不錯，開學第一週我不能來，我趕緊叫晏喜跟嘉軒還有建良來 support 一下。",py:"wǒ jué dé wǒ rén yuán hái bù cuò kāi xué dì yī zhōu wǒ bù néng lái wǒ gǎn jǐn jiào yàn xǐ gēn jiā xuān hái yǒu jiàn liáng lái yī xià",id:"Saya rasa pergaulan saya cukup baik, minggu pertama kuliah saya tidak bisa datang, saya cepat minta Yanxi Jiaxuan dan Jianliang untuk support."},
{cat:"KELAS",zh:"我可以每週都，我的光碟片非常多，所以慢慢看，看到你們轉為止，你不用擔心。",py:"wǒ kě yǐ měi zhōu dōu wǒ de guāng dié piàn fēi cháng duō suǒ yǐ màn màn kàn kàn dào nǐ men zhuǎn wèi zhǐ nǐ bù yòng dān xīn",id:"Saya bisa setiap minggu, koleksi slide saya sangat banyak, jadi lihat perlahan, sampai kalian lulus, tidak perlu khawatir."},
{cat:"KELAS",zh:"因為像 Line 的話，Line 群組你通常換手機除非你備份，否則基本上就是沒有了。",py:"yīn wèi xiàng de huà qún zǔ nǐ tōng cháng huàn shǒu jī chú fēi nǐ bèi fèn fǒu zé jī běn shàng jiù shì méi yǒu le",id:"Karena seperti Line, grup Line biasanya kalau ganti HP kecuali ada backup, kalau tidak pada dasarnya sudah hilang."},
{cat:"KELAS",zh:"我的群組從我已經在教22年了，雖然我外表看不太清楚，其實我應該是你們阿公阿媽級的。",py:"wǒ de qún zǔ cóng wǒ yǐ jīng zài jiào nián le suī rán wǒ wài biǎo kàn bù tài qīng chǔ qí shí wǒ yīng gāi shì nǐ men ā gōng ā mā jí de",id:"Grup saya sudah dari saya mengajar 22 tahun, walaupun penampilan saya tidak kelihatan tua, sebenarnya saya sudah level kakek nenek kalian."},
{cat:"KELAS",zh:"我可以 show 給你看一屆的，待會開給你們看，因為我每一屆都有，我也可以 show 給你看。",py:"wǒ kě yǐ gěi nǐ kàn yī jiè de dài huì kāi gěi nǐ men kàn yīn wèi wǒ měi yī jiè dōu yǒu wǒ yě kě yǐ gěi nǐ kàn",id:"Saya bisa tunjukkan satu angkatan punya ke kamu, nanti saya buka untuk kalian lihat, karena saya punya tiap angkatan."},
{cat:"KELAS",zh:"學校當然就是爽啊，為什麼？因為我們只是員工，不管來多少人，我們就是客服。",py:"xué xiào dāng rán jiù shì shuǎng a wèi shén me yīn wèi wǒ men zhǐ shì yuán gōng bù guǎn lái duō shǎo rén wǒ men jiù shì kè fú",id:"Sekolah tentu enak, kenapa? Karena kita hanya karyawan, tidak peduli berapa orang datang, kita adalah customer service."},
{cat:"KELAS",zh:"所以請你也體諒一下老師，沒辦法，我不是萬能的啊，我可能忙中也會錯。",py:"suǒ yǐ qǐng nǐ yě tǐ liàng yī xià lǎo shī méi bàn fǎ wǒ bù shì wàn néng de a wǒ kě néng máng zhōng yě huì cuò",id:"Jadi tolong maklumi guru juga, tidak bisa dihindari, saya tidak serba bisa, saya mungkin di sela kesibukan juga bisa salah."},
{cat:"KELAS",zh:"你不用不好意思跟我講，因為有的時候，我這樣講一下，因為我不是機器人，我沒有那麼厲害。",py:"nǐ bù yòng bù hǎo yì sī gēn wǒ jiǎng yīn wèi yǒu de shí hòu wǒ zhè yàng jiǎng yī xià yīn wèi wǒ bù shì jī qì rén wǒ méi yǒu nà me lì hài",id:"Jangan sungkan bilang ke saya, karena kadang saya bicara seperti ini, karena saya bukan robot, saya tidak sehebat itu."},
{cat:"KELAS",zh:"那個登錄的時候就會因為密碼好多種，有的要改，有的要8位，有的要10位，就很麻煩。",py:"nà gè dēng lù de shí hòu jiù huì yīn wèi mì mǎ hǎo duō zhǒng yǒu de yào gǎi yǒu de yào wèi yǒu de yào wèi jiù hěn má fán",id:"Waktu login karena passwordnya banyak jenis, ada yang harus diganti, ada yang 8 karakter, ada yang 10 karakter, jadi repot."},
{cat:"KELAS",zh:"你不來，我也沒辦法跟你互動，好不好，請問這樣有什麼問題嗎？沒有沒有什麼問題。",py:"nǐ bù lái wǒ yě méi bàn fǎ gēn nǐ hù dòng hǎo bù hǎo qǐng wèn zhè yàng yǒu shén me wèn tí ma méi yǒu méi yǒu shén me wèn tí",id:"Kalau kamu tidak datang, saya juga tidak bisa berinteraksi dengan kamu, ya kan, ada pertanyaan soal ini? Tidak ada pertanyaan."},
{cat:"KELAS",zh:"如果有修我人機的禮拜四再來，禮拜四會有更多的外籍生，那請大家自己輕鬆一下。",py:"rú guǒ yǒu xiū wǒ rén jī de lǐ bài sì zài lái lǐ bài sì huì yǒu gèng duō de wài jí shēng nà qǐng dà jiā zì jǐ qīng sōng yī xià",id:"Kalau ada yang ambil HCI kelas Kamis datang lagi, Kamis akan ada lebih banyak mahasiswa asing, silakan semua santai dulu."},
{cat:"KELAS",zh:"我待會開放時間，你們可以想一下，還有就是說我為什麼要選臉書。",py:"wǒ dài huì kāi fàng shí jiān nǐ men kě yǐ xiǎng yī xià hái yǒu jiù shì shuō wǒ wèi shén me yào xuǎn liǎn shū",id:"Nanti saya akan buka waktu bebas, kalian bisa memikirkan, dan juga kenapa saya pilih Facebook."},
{cat:"KELAS",zh:"大家進來氣氛都很亮，我跟同學講準時2年畢業，歷屆學長姐大概只有一兩個，春3年的都3年是最普遍的。",py:"dà jiā jìn lái qì fēn dōu hěn liàng wǒ gēn tóng xué jiǎng zhǔn shí nián bì yè lì jiè xué zhǎng jiě dà gài zhǐ yǒu yī liǎng gè chūn nián de dōu nián shì zuì pǔ biàn de",id:"Semua masuk suasananya cerah, saya bilang ke mahasiswa lulus tepat 2 tahun, dari semua angkatan hanya sekitar satu dua, yang 3 tahun semua 3 tahun itu yang paling umum."},
{cat:"KELAS",zh:"通常到期中考過後，自我介紹過後，到年底會比較熟一點，因為大部分加上又有國際生，所以大家難免會比較害羞。",py:"tōng cháng dào qī zhōng kǎo guò hòu zì wǒ jiè shào guò hòu dào nián dǐ huì bǐ jiào shú yī diǎn yīn wèi dà bù fēn jiā shàng yòu yǒu guó jì shēng suǒ yǐ dà jiā nán miǎn huì bǐ jiào hài xiū",id:"Biasanya setelah melewati UTS, setelah perkenalan diri, menjelang akhir tahun akan lebih akrab, karena kebanyakan ditambah ada mahasiswa internasional, jadi semua terpaksa lebih pemalu."},
{cat:"KELAS",zh:"之後就會講的話，然後之後一定是老師還吵吵的，這很正常，所以老師每年都要經歷過這樣一次。",py:"zhī hòu jiù huì jiǎng de huà rán hòu zhī hòu yī dìng shì lǎo shī hái chǎo chǎo de zhè hěn zhèng cháng suǒ yǐ lǎo shī měi nián dōu yào jīng lì guò zhè yàng yī cì",id:"Setelah itu mulai banyak bicara, dan setelah itu pasti guru masih ribut, ini sangat normal, jadi guru setiap tahun harus melewati ini sekali."},
{cat:"TESIS",zh:"我知道同學一定要看範本，因為叫你自己做，而且現在你們比以前的更方便，你用 AI 弄就好了。",py:"wǒ zhī dào tóng xué yī dìng yào kàn fàn běn yīn wèi jiào nǐ zì jǐ zuò ér qiě xiàn zài nǐ men bǐ yǐ qián de gèng fāng biàn nǐ yòng nòng jiù hǎo le",id:"Saya tahu mahasiswa pasti harus lihat contoh, karena disuruh buat sendiri, dan sekarang kalian lebih praktis dari dulu, pakai AI saja."},
{cat:"TESIS",zh:"但是我覺得你還是要自己問過一遍，我個人建議，我並沒有說不能用 AI。",py:"dàn shì wǒ jué dé nǐ hái shì yào zì jǐ wèn guò yī biàn wǒ gè rén jiàn yì wǒ bìng méi yǒu shuō bù néng yòng",id:"Tapi saya rasa kamu tetap harus menanyai dirimu sendiri dulu, saran pribadi saya, saya tidak bilang tidak boleh pakai AI."},
{cat:"TESIS",zh:"你一定要自己看過去，因為你在寫論文的時候，不管你是做創作或者是做理論，你到最後你還是可能會用到問卷。",py:"nǐ yī dìng yào zì jǐ kàn guò qù yīn wèi nǐ zài xiě lùn wén de shí hòu bù guǎn nǐ shì zuò chuàng zuò huò zhě shì zuò lǐ lùn nǐ dào zuì hòu nǐ hái shì kě néng huì yòng dào wèn juǎn",id:"Kamu harus melihatnya sendiri dulu, karena waktu menulis tesis apapun yang kamu buat, pada akhirnya kamu masih mungkin pakai kuesioner."},
{cat:"TESIS",zh:"我希望大家到期中以前，可以排時間做提報，待會給同學看範本好不好。",py:"wǒ xī wàng dà jiā dào qī zhōng yǐ qián kě yǐ pái shí jiān zuò tí bào dài huì gěi tóng xué kàn fàn běn hǎo bù hǎo",id:"Saya harap semua sebelum UTS, bisa atur waktu untuk presentasi, nanti saya tunjukkan contoh ke mahasiswa ya."},
{cat:"TESIS",zh:"你也可以跟學長姐買，如果有人要賣或怎樣，這個我就不知道，但是這個就是借你看沒有問題。",py:"nǐ yě kě yǐ gēn xué zhǎng jiě mǎi rú guǒ yǒu rén yào mài huò zěn yàng zhè gè wǒ jiù bù zhī dào dàn shì zhè gè jiù shì jiè nǐ kàn méi yǒu wèn tí",id:"Kamu juga bisa beli dari kakak tingkat, kalau ada yang mau jual atau bagaimana, ini saya tidak tahu, tapi ini dipinjamkan untuk kamu lihat tidak apa-apa."},
{cat:"TESIS",zh:"嘉軒用了4種，可是他是撐到最後一刻，所以他就把研究方法跟自我介紹混搭了。",py:"jiā xuān yòng le zhǒng kě shì tā shì chēng dào zuì hòu yī kè suǒ yǐ tā jiù bǎ yán jiū fāng fǎ gēn zì wǒ jiè shào hùn dā le",id:"Jiaxuan pakai 4 metode, tapi dia bertahan sampai menit terakhir, jadi dia campur metode penelitian dengan perkenalan dirinya."},
{cat:"TESIS",zh:"當然，你選擇的不見得能夠全部用得上，我希望你至少選3種然後去比較它的優缺點了解一下。",py:"dāng rán nǐ xuǎn zé de bù jiàn dé néng gòu quán bù yòng dé shàng wǒ xī wàng nǐ zhì shǎo xuǎn zhǒng rán hòu qù bǐ jiào tā de yōu quē diǎn le jiě yī xià",id:"Tentu yang kamu pilih belum tentu semua bisa dipakai, saya harap kamu pilih minimal 3 jenis lalu bandingkan kelebihan kekurangannya untuk dipahami."},
{cat:"TESIS",zh:"請看一下哦，都在書本上啊，當然，也可以自己去找，我相信網路上有很多資料，或者是叫 AI 生成也可以。",py:"qǐng kàn yī xià ó dōu zài shū běn shàng a dāng rán yě kě yǐ zì jǐ qù zhǎo wǒ xiāng xìn wǎng lù shàng yǒu hěn duō zī liào huò zhě shì jiào shēng chéng yě kě yǐ",id:"Tolong lihat ya, semua ada di buku, tentu juga bisa cari sendiri, saya yakin di internet ada banyak referensi, atau suruh AI generate juga bisa."},
{cat:"TESIS",zh:"有同學說啊老師，要做幾頁？不用擔心，沈老師不會限制你，你想做幾頁就做幾頁，我絕對不會叫你一定要怎麼做。",py:"yǒu tóng xué shuō a lǎo shī yào zuò jǐ yè bù yòng dān xīn shěn lǎo shī bù huì xiàn zhì nǐ nǐ xiǎng zuò jǐ yè jiù zuò jǐ yè wǒ jué duì bù huì jiào nǐ yī dìng yào zěn me zuò",id:"Ada mahasiswa bilang guru harus buat berapa halaman? Tidak perlu khawatir, Shen Laoshi tidak akan membatasimu, mau buat berapa halaman ya sebanyak itu."},
{cat:"TESIS",zh:"Likert 量表就是那個1到5、1到7、1到9，不知道大家有沒有印象，那沒有關係，我們按部就班來。",py:"liàng biǎo jiù shì nà gè dào dào dào bù zhī dào dà jiā yǒu méi yǒu yìn xiàng nà méi yǒu guān xì wǒ men àn bù jiù bān lái",id:"Skala Likert itu yang 1-5, 1-7, 1-9, tidak tahu apakah kalian masih ingat, tidak apa-apa, kita lakukan secara bertahap."},
{cat:"TESIS",zh:"結構式、非結構式、半結構式都在書中，焦點團體法是比較直性的，其實不多了。",py:"jié gòu shì fēi jié gòu shì bàn jié gòu shì dōu zài shū zhōng jiāo diǎn tuán tǐ fǎ shì bǐ jiào zhí xìng de qí shí bù duō le",id:"Terstruktur, tidak terstruktur, semi-terstruktur semuanya ada di buku, focus group discussion lebih langsung, sebenarnya tidak banyak."},
{cat:"TESIS",zh:"那問卷的方式有很多種，這幾個 mandatory，非常夯的 Likert 量表，常常在我們設計或者做遊戲相關的一定會有。",py:"nà wèn juǎn de fāng shì yǒu hěn duō zhǒng zhè jǐ gè fēi cháng hāng de liàng biǎo cháng cháng zài wǒ men shè jì huò zhě zuò yóu xì xiāng guān de yī dìng huì yǒu",id:"Metode kuesioner ada banyak cara, beberapa yang wajib ini, Skala Likert yang sangat populer, sering di desain atau yang berkaitan game pasti ada."},
{cat:"TESIS",zh:"碩班你要比較有獨立思考，不是跟著老師說告訴你你要怎麼做就做。",py:"shuò bān nǐ yào bǐ jiào yǒu dú lì sī kǎo bù shì gēn zhù lǎo shī shuō gào sù nǐ nǐ yào zěn me zuò jiù zuò",id:"S2 kamu harus lebih punya pemikiran independen, bukan mengikuti guru yang memberitahu caranya lalu dikerjakan begitu saja."},
{cat:"TESIS",zh:"為什麼有些學長唸的3年到4年，因為他自己自我控管時間的能力，時間管理。",py:"wèi shén me yǒu xiē xué zhǎng niàn de nián dào nián yīn wèi tā zì jǐ zì wǒ kòng guǎn shí jiān de néng lì shí jiān guǎn lǐ",id:"Kenapa ada kakak tingkat yang kuliah 3 sampai 4 tahun, karena kemampuan kontrol diri dan manajemen waktu mereka sendiri."},
{cat:"TESIS",zh:"他就是很奇怪，他就是默默的來了，而且每次都在2點左右才出現，1點20分的課都快下課了。",py:"tā jiù shì hěn qí guài tā jiù shì mò mò de lái le ér qiě měi cì dōu zài diǎn zuǒ yòu cái chū xiàn diǎn fēn de kè dōu kuài xià kè le",id:"Dia memang aneh, dia tetap diam-diam datang, dan setiap kali selalu muncul sekitar jam 2, jam 1:20 kelas sudah hampir selesai."},
{cat:"TESIS",zh:"我的課不知道其他老師，但是我一定是從基礎開始打起，因為有很多學長的論文那些都想跟你們分享。",py:"wǒ de kè bù zhī dào qí tā lǎo shī dàn shì wǒ yī dìng shì cóng jī chǔ kāi shǐ dǎ qǐ yīn wèi yǒu hěn duō xué zhǎng de lùn wén nà xiē dōu xiǎng gēn nǐ men fēn xiǎng",id:"Kelas saya tidak tahu guru lain, tapi saya pasti mulai dari dasar dulu, karena ada banyak tesis kakak tingkat yang ingin saya bagikan ke kalian."},
{cat:"TESIS",zh:"看多不見得是好事，但是就是說你自己要先有一個大概，我們再來討論會比較好。",py:"kàn duō bù jiàn dé shì hǎo shì dàn shì jiù shì shuō nǐ zì jǐ yào xiān yǒu yī gè dà gài wǒ men zài lái tǎo lùn huì bǐ jiào hǎo",id:"Melihat banyak belum tentu bagus, tapi intinya kamu sendiri harus punya gambaran dulu, baru kita diskusi akan lebih baik."},
{cat:"TESIS",zh:"學生之前是想要做 ChatGPT 比對，還有另外比對一個在做社交相關的通訊者內容的東西，但是他後來又換了。",py:"xué shēng zhī qián shì xiǎng yào zuò bǐ duì hái yǒu lìng wài bǐ duì yī gè zài zuò shè jiāo xiāng guān de tōng xùn zhě nèi róng de dōng xī dàn shì tā hòu lái yòu huàn le",id:"Mahasiswa sebelumnya mau buat perbandingan ChatGPT, dan satu lagi membandingkan konten komunikator media sosial, tapi dia kemudian berubah lagi."},
{cat:"TESIS",zh:"有些東西都蠻有趣的，但是你要多看，你沒有多看你絕對問題有限。",py:"yǒu xiē dōng xī dōu mán yǒu qù de dàn shì nǐ yào duō kàn nǐ méi yǒu duō kàn nǐ jué duì wèn tí yǒu xiàn",id:"Beberapa hal cukup menarik, tapi kamu harus banyak melihat, kalau tidak banyak melihat pertanyaanmu pasti terbatas."},
{cat:"ADMIN",zh:"70學分為主，每一個科目你放心，沈老師的課絕對都是很甜的分數。",py:"xué fēn wèi zhǔ měi yī gè kē mù nǐ fàng xīn shěn lǎo shī de kè jué duì dōu shì hěn tián de fēn shù",id:"Mayoritas 70 SKS, setiap mata kuliah tenang saja, kelas Shen Laoshi pasti nilainya selalu manis."},
{cat:"ADMIN",zh:"大家都是甜甜的這樣，因為這是一個鼓勵性，因為你做的好不好，只有你知道了。",py:"dà jiā dōu shì tián tián de zhè yàng yīn wèi zhè shì yī gè gǔ lì xìng yīn wèi nǐ zuò de hǎo bù hǎo zhǐ yǒu nǐ zhī dào le",id:"Semua nilainya manis begini, karena ini bersifat mendorong, karena bagus atau tidaknya yang kamu buat hanya kamu yang tahu."},
{cat:"ADMIN",zh:"你覺得你有沒有用心做？你覺得我看不出來嗎？你是用 AI 跑的，我就用了一個東西檢測，相似度有多少。",py:"nǐ jué dé nǐ yǒu méi yǒu yòng xīn zuò nǐ jué dé wǒ kàn bù chū lái ma nǐ shì yòng pǎo de wǒ jiù yòng le yī gè dōng xī jiǎn cè xiāng shì dù yǒu duō shǎo",id:"Menurutmu apakah kamu mengerjakan dengan sungguh-sungguh? Menurutmu saya tidak bisa lihat? Kamu pakai AI dijalankan, saya pakai satu alat untuk deteksi tingkat kemiripannya."},
{cat:"ADMIN",zh:"太原97趴，嘉軒學姐98趴，他們兩個都在笑，那也無所謂，但是他錯過自己練習的機會。",py:"tài yuán pā jiā xuān xué jiě pā tā men liǎng gè dōu zài xiào nà yě wú suǒ wèi dàn shì tā cuò guò zì jǐ liàn xí de jī huì",id:"Taiyuan 97%, kakak Jiaxuan 98%, mereka berdua tertawa, tidak apa-apa, tapi dia melewatkan kesempatan latihan sendiri."},
{cat:"ADMIN",zh:"到最後如果他們論文寫不出來，你懂我意思嗎？上了我的研究方法還是不會，這是不可能急救的事情。",py:"dào zuì hòu rú guǒ tā men lùn wén xiě bù chū lái nǐ dǒng wǒ yì sī ma shàng le wǒ de yán jiū fāng fǎ hái shì bù huì zhè shì bù kě néng jí jiù de shì qíng",id:"Pada akhirnya kalau mereka tidak bisa menulis tesis, kamu mengerti maksud saya? Sudah ikut metode penelitian saya masih tidak bisa, ini hal yang tidak bisa diselamatkan secara darurat."},
{cat:"ADMIN",zh:"我們有一個 template，系上都可以下載的，就是他有一個格式，所以不是說你自己隨便弄一下。",py:"wǒ men yǒu yī gè xì shàng dōu kě yǐ xià zài de jiù shì tā yǒu yī gè gé shì suǒ yǐ bù shì shuō nǐ zì jǐ suí biàn nòng yī xià",id:"Kita punya satu template, di jurusan semua bisa download, ada formatnya, jadi bukan kamu buat sesukamu saja."},
{cat:"ADMIN",zh:"現在越來越難考，就是你要閱讀完之後，電腦會隨機出題，你好像要考70還是80，反正我每3年要考一次。",py:"xiàn zài yuè lái yuè nán kǎo jiù shì nǐ yào yuè dú wán zhī hòu diàn nǎo huì suí jī chū tí nǐ hǎo xiàng yào kǎo hái shì fǎn zhèng wǒ měi nián yào kǎo yī cì",id:"Sekarang semakin sulit ujiannya, yaitu kamu harus selesai membaca, lalu komputer akan acak soal, sepertinya harus dapat 70 atau 80, pokoknya saya harus ujian setiap 3 tahun sekali."},
{cat:"ADMIN",zh:"理論類你要參加研討會，國內外都可以；創作類國內外也都可以，這個都要完成才能提出口考。",py:"lǐ lùn lèi nǐ yào cān jiā yán tǎo huì guó nèi wài dōu kě yǐ chuàng zuò lèi guó nèi wài yě dōu kě yǐ zhè gè dōu yào wán chéng cái néng tí chū kǒu kǎo",id:"Untuk teori kamu harus ikut seminar dalam maupun luar negeri boleh; untuk karya kreatif dalam maupun luar negeri juga boleh, ini semua harus selesai baru bisa ajukan ujian lisan."},
{cat:"ADMIN",zh:"你預計2年內畢業，2028的5、6月要完成口考，如果想在731以前拿到畢業證書，6月依據同學喜歡趕工通常學校最塞車。",py:"nǐ yù jì nián nèi bì yè de yuè yào wán chéng kǒu kǎo rú guǒ xiǎng zài yǐ qián ná dào bì yè zhèng shū yuè yī jù tóng xué xǐ huān gǎn gōng tōng cháng xué xiào zuì sāi chē",id:"Kalau rencana lulus 2 tahun, bulan 5-6 2028 harus selesai ujian lisan, kalau mau dapat ijazah sebelum 31 Juli, bulan 6 berdasarkan mahasiswa yang suka ngebut biasanya paling macet di sekolah."},
{cat:"ADMIN",zh:"如果照沈老師的配件，也就是你2027年底到2028的1月2月，你的東西就已經要大部分都出來了。",py:"rú guǒ zhào shěn lǎo shī de pèi jiàn yě jiù shì nǐ nián dǐ dào de yuè yuè nǐ de dōng xī jiù yǐ jīng yào dà bù fēn dōu chū lái le",id:"Kalau mengikuti jadwal Shen Laoshi, yaitu akhir 2027 sampai Januari Februari 2028, karyamu sudah harus sebagian besar selesai."},
{cat:"ADMIN",zh:"你覺得很多時候都是想的很完美，偏偏在趕工的時候電腦當機，不可預期的因素。",py:"nǐ jué dé hěn duō shí hòu dōu shì xiǎng de hěn wán měi piān piān zài gǎn gōng de shí hòu diàn nǎo dāng jī bù kě yù qī de yīn sù",id:"Kamu pikir sering kali semuanya terencana sempurna, tapi tepat saat buru-buru komputer crash, faktor tak terduga."},
{cat:"ADMIN",zh:"投口考的時候你不能說你要的老師一定要在你想要的時間，因為那些時間都是你叫他就來嗎？",py:"tóu kǒu kǎo de shí hòu nǐ bù néng shuō nǐ yào de lǎo shī yī dìng yào zài nǐ xiǎng yào de shí jiān yīn wèi nà xiē shí jiān dōu shì nǐ jiào tā jiù lái ma",id:"Saat mendaftarkan ujian lisan kamu tidak bisa bilang dosen yang kamu mau harus ada di waktu yang kamu inginkan, karena waktu-waktu itu tinggal kamu panggil dia langsung datang?"},
{cat:"ADMIN",zh:"56月是我的口考忘記，7月我通常就不做了，因為太趕我也暑假有別的行程。",py:"yuè shì wǒ de kǒu kǎo wàng jì yuè wǒ tōng cháng jiù bù zuò le yīn wèi tài gǎn wǒ yě shǔ jiǎ yǒu bié de xíng chéng",id:"Bulan 5-6 itu jadwal ujian lisan saya sudah penuh, bulan 7 saya biasanya tidak terima lagi, karena terlalu terburu-buru saya juga liburan ada jadwal lain."},
{cat:"ADMIN",zh:"重點不在於老師，老師只是幫你把關的，重點你要怎麼去執行，執行我可以跟你講怎麼做，但是做什麼事因為我不是學生身份。",py:"zhòng diǎn bù zài yú lǎo shī lǎo shī zhǐ shì bāng nǐ bǎ guān de zhòng diǎn nǐ yào zěn me qù zhí xíng zhí xíng wǒ kě yǐ gēn nǐ jiǎng zěn me zuò dàn shì zuò shén me shì yīn wèi wǒ bù shì xué shēng shēn fèn",id:"Intinya bukan pada dosen, dosen hanya membantu mengawasi, intinya bagaimana kamu mengeksekusinya, saya bisa beritahu cara melakukannya, tapi mengerjakan apa karena saya bukan status mahasiswa."},
{cat:"ADMIN",zh:"如果有任何一個步驟沒有完成，那你就是要到8、9月才有辦法拿到畢業證書，那是誰的錯？是你自己的錯。",py:"rú guǒ yǒu rèn hé yī gè bù zhòu méi yǒu wán chéng nà nǐ jiù shì yào dào yuè cái yǒu bàn fǎ ná dào bì yè zhèng shū nà shì shuí de cuò shì nǐ zì jǐ de cuò",id:"Kalau ada salah satu langkah yang belum selesai, kamu baru bisa dapat ijazah di bulan 8-9, itu kesalahan siapa? Kesalahan kamu sendiri."},
{cat:"ADMIN",zh:"你要自己下面印：口考的領據、口考成績，我都說多印幾份，用萬一，還有你在口考的時候你不用布置嗎？",py:"nǐ yào zì jǐ xià miàn yìn kǒu kǎo de lǐng jù kǒu kǎo chéng jī wǒ dōu shuō duō yìn jǐ fèn yòng wàn yī hái yǒu nǐ zài kǒu kǎo de shí hòu nǐ bù yòng bù zhì ma",id:"Kamu sendiri harus cetak: kuitansi ujian lisan, nilai ujian lisan, saya selalu bilang cetak beberapa lembar untuk jaga-jaga, dan waktu ujian lisan kamu tidak perlu tata ruangan?"},
{cat:"NASIHAT",zh:"你在人生地不熟的地方，假設你沒有任何的現金，你要怎麼開始新的生活，你先想哈大家一定會想講或怎麼樣。",py:"nǐ zài rén shēng dì bù shú de dì fāng jiǎ shè nǐ méi yǒu rèn hé de xiàn jīn nǐ yào zěn me kāi shǐ xīn de shēng huó nǐ xiān xiǎng hā dà jiā yī dìng huì xiǎng jiǎng huò zěn me yàng",id:"Di tempat yang asing bagimu, misalkan kamu tidak punya uang tunai, bagaimana kamu memulai kehidupan baru, pikirkan dulu, semua pasti mau bicara atau bagaimana."},
{cat:"NASIHAT",zh:"我雖然不會講越南話，那至少我可以去教中文嘛，好對不對，我可以去教英文啊，開補習班也可以。",py:"wǒ suī rán bù huì jiǎng yuè nán huà nà zhì shǎo wǒ kě yǐ qù jiào zhōng wén ma hǎo duì bù duì wǒ kě yǐ qù jiào yīng wén a kāi bǔ xí bān yě kě yǐ",id:"Walaupun saya tidak bisa bahasa Vietnam, setidaknya saya bisa mengajar Mandarin bagus kan, saya bisa mengajar Inggris, buka bimbel juga bisa."},
{cat:"NASIHAT",zh:"或是開餐廳如果有幾本好，就開傳統加 internet，有什麼菜的，這個就是我已經想好我要怎麼生活的東西。",py:"huò shì kāi cān tīng rú guǒ yǒu jǐ běn hǎo jiù kāi chuán tǒng jiā yǒu shén me cài de zhè gè jiù shì wǒ yǐ jīng xiǎng hǎo wǒ yào zěn me shēng huó de dōng xī",id:"Atau buka restoran kalau ada modal bagus, buka yang tradisional ditambah internet, ada menu apa, ini sudah saya pikirkan bagaimana cara hidup saya."},
{cat:"NASIHAT",zh:"之前有個學長因為他會弄冷氣，他就說那假設他到越南，他就專門去弄冷氣，也不錯哦。",py:"zhī qián yǒu gè xué zhǎng yīn wèi tā huì nòng lěng qì tā jiù shuō nà jiǎ shè tā dào yuè nán tā jiù zhuān mén qù nòng lěng qì yě bù cuò ó",id:"Dulu ada kakak tingkat karena dia bisa pasang AC, dia bilang misalkan dia ke Vietnam, dia khusus pasang-pasang AC, juga bagus."},
{cat:"NASIHAT",zh:"另外有一個臺哥大的就是我指導的學生，他是做建築系的，他說哎老師雖然語言不通，可是我可以做模型，也不錯。",py:"lìng wài yǒu yī gè tái gē dà de jiù shì wǒ zhǐ dǎo de xué shēng tā shì zuò jiàn zhù xì de tā shuō āi lǎo shī suī rán yǔ yán bù tōng kě shì wǒ kě yǐ zuò mó xíng yě bù cuò",id:"Selain itu ada satu dari NTUT yang adalah mahasiswa bimbingan saya dari arsitektur, dia bilang guru walaupun tidak bisa bahasa tapi saya bisa buat maket, bagus juga."},
{cat:"NASIHAT",zh:"臺灣這個島你們一定要提早適應，因為我們的人口沒有那麼多，你要不要去做長照或者是殯葬，那也是蠻神聖的一個工作。",py:"tái wān zhè gè dǎo nǐ men yī dìng yào tí zǎo shì yīng yīn wèi wǒ men de rén kǒu méi yǒu nà me duō nǐ yào bù yào qù zuò zhǎng zhào huò zhě shì bìn zàng nà yě shì mán shén shèng de yī gè gōng zuò",id:"Pulau Taiwan ini kalian harus beradaptasi lebih awal, karena jumlah penduduk kita tidak sebanyak itu, maukah kamu kerja di perawatan lansia atau pemakaman, itu juga pekerjaan yang cukup mulia."},
{cat:"NASIHAT",zh:"就是國際的人士來臺灣工作，就像我們到東南亞去工作被公司派遣那樣，所以我們一定要學會跟國際人士相處。",py:"jiù shì guó jì de rén shì lái tái wān gōng zuò jiù xiàng wǒ men dào dōng nán yà qù gōng zuò bèi gōng sī pài qiǎn nà yàng suǒ yǐ wǒ men yī dìng yào xué huì gēn guó jì rén shì xiāng chù",id:"Yaitu orang internasional datang bekerja ke Taiwan, seperti kita pergi bekerja ke Asia Tenggara dikirim perusahaan, jadi kita harus belajar bergaul dengan orang internasional."},
{cat:"NASIHAT",zh:"我跟同學講，你不要覺得越南落後，我去過這2個國家，現在都比我們發展，反而是臺灣都在這邊。",py:"wǒ gēn tóng xué jiǎng nǐ bù yào jué dé yuè nán luò hòu wǒ qù guò zhè gè guó jiā xiàn zài dōu bǐ wǒ men fā zhǎn fǎn ér shì tái wān dōu zài zhè biān",id:"Saya bilang ke mahasiswa, jangan kamu pikir Vietnam terbelakang, saya sudah ke 2 negara ini, sekarang semua berkembang lebih dari kita, justru Taiwan yang seperti ini."},
{cat:"NASIHAT",zh:"胡志明市大城峴港那個已經全部都是工作機會，我們是已經過度發展，然後少子化，每個人都想卡好的位置，但是輪得到你們嗎？",py:"hú zhì míng shì dà chéng xiàn gǎng nà gè yǐ jīng quán bù dōu shì gōng zuò jī huì wǒ men shì yǐ jīng guò dù fā zhǎn rán hòu shǎo zi huà měi gè rén dōu xiǎng kǎ hǎo de wèi zhì dàn shì lún dé dào nǐ men ma",id:"Ho Chi Minh City, kota besar Da Nang itu semua sudah penuh peluang kerja, kita sudah terlalu jenuh berkembang, ditambah penurunan populasi, semua orang mau rebut posisi bagus, tapi giliran kalian?"},
{cat:"NASIHAT",zh:"我覺得認識一點，我覺得也蠻不錯的，你不要覺得人家比我們落後，其實臺灣不見得是好的環境。",py:"wǒ jué dé rèn shí yī diǎn wǒ jué dé yě mán bù cuò de nǐ bù yào jué dé rén jiā bǐ wǒ men luò hòu qí shí tái wān bù jiàn dé shì hǎo de huán jìng",id:"Saya rasa mengenal sedikit juga cukup bagus, jangan kamu pikir orang lebih terbelakang dari kita, sebenarnya Taiwan belum tentu lingkungan yang bagus."},
{cat:"NASIHAT",zh:"因為他們來這邊工作可能賺的薪水還蠻高啊，可是對3萬塊對你而言，你覺得很少，對不對。",py:"yīn wèi tā men lái zhè biān gōng zuò kě néng zhuàn de xīn shuǐ hái mán gāo a kě shì duì wàn kuài duì nǐ ér yán nǐ jué dé hěn shǎo duì bù duì",id:"Karena mereka datang bekerja ke sini mungkin gajinya cukup tinggi, tapi 30 ribu bagi kamu menurutmu sedikit, kan."},
{cat:"NASIHAT",zh:"我覺得構成在比的應該不是說你幾年畢業，是你有沒有辦法將你的碩論做完整一點然後可以完成階段性的任務。",py:"wǒ jué dé gòu chéng zài bǐ de yīng gāi bù shì shuō nǐ jǐ nián bì yè shì nǐ yǒu méi yǒu bàn fǎ jiāng nǐ de shuò lùn zuò wán zhěng yī diǎn rán hòu kě yǐ wán chéng jiē duàn xìng de rèn wù",id:"Saya rasa yang harus dibandingkan seharusnya bukan kamu lulus tahun berapa, tapi bisakah kamu menyelesaikan tesismu dengan lebih lengkap lalu menyelesaikan tugas bertahap ini."},
{cat:"NASIHAT",zh:"你要自己想清楚說你到底念這個碩士，投資的這2年，你的同學去當兵，也有人在工作，人家工作2年存款很多，你是在繳學費，那你得到什麼啊。",py:"nǐ yào zì jǐ xiǎng qīng chǔ shuō nǐ dào dǐ niàn zhè gè shuò shì tóu zī de zhè nián nǐ de tóng xué qù dāng bīng yě yǒu rén zài gōng zuò rén jiā gōng zuò nián cún kuǎn hěn duō nǐ shì zài jiǎo xué fèi nà nǐ dé dào shén me a",id:"Kamu harus sendiri pikirkan jelas kamu sebenarnya ambil S2 ini, investasi 2 tahun ini, temanmu ada yang wamil, ada yang bekerja, orang kerja 2 tahun tabungannya banyak, kamu sedang bayar biaya kuliah, lalu kamu dapat apa."},
{cat:"NASIHAT",zh:"如果不值得的話，那就是好好呆在這裡，好好投資自己，好好人生，可能自己應該是你人生最後一次當學生的機會。",py:"rú guǒ bù zhí dé de huà nà jiù shì hǎo hǎo dāi zài zhè lǐ hǎo hǎo tóu zī zì jǐ hǎo hǎo rén shēng kě néng zì jǐ yīng gāi shì nǐ rén shēng zuì hòu yī cì dāng xué shēng de jī huì",id:"Kalau tidak sebanding, ya tinggal di sini dengan baik, investasikan dirimu dengan baik, hidup yang baik, mungkin ini adalah kesempatan terakhirmu menjadi mahasiswa seumur hidup."},
{cat:"NASIHAT",zh:"雖然 AI 充斥著，好，那你能夠掌握什麼，你能掌握什麼啊，但是我不會因為 AI 走投無路。",py:"suī rán chōng chì zhù hǎo nà nǐ néng gòu zhǎng wò shén me nǐ néng zhǎng wò shén me a dàn shì wǒ bù huì yīn wèi zǒu tóu wú lù",id:"Walaupun AI di mana-mana, oke, lalu apa yang bisa kamu kuasai, apa yang bisa kamu pegang, tapi saya tidak akan terdesak karena AI."},
{cat:"NASIHAT",zh:"我爸爸媽媽投資我又出國留學，所以我英文啊，我繼續在做設計，所以我應該不至於會因為 AI 會走投無路。",py:"wǒ bà bà mā mā tóu zī wǒ yòu chū guó liú xué suǒ yǐ wǒ yīng wén a wǒ jì xù zài zuò shè jì suǒ yǐ wǒ yīng gāi bù zhì yú huì yīn wèi huì zǒu tóu wú lù",id:"Ayah ibu saya investasikan saya dan saya juga studi ke luar negeri, jadi bahasa Inggris saya bagus, saya terus bergelut di desain, jadi saya seharusnya tidak akan terdesak karena AI."},
{cat:"NASIHAT",zh:"我不會害怕 AI，我也不會害怕，而且包括是骨科大關閉或是怎樣，因為我沒有什麼危機意識，我其實蠻開心的。",py:"wǒ bù huì hài pà wǒ yě bù huì hài pà ér qiě bāo kuò shì gǔ kē dà guān bì huò shì zěn yàng yīn wèi wǒ méi yǒu shén me wēi jī yì shí wǒ qí shí mán kāi xīn de",id:"Saya tidak akan takut AI, saya juga tidak akan takut, termasuk kalau NUE tutup atau bagaimana, karena saya tidak punya kesadaran krisis, saya sebenarnya cukup senang."},
{cat:"NASIHAT",zh:"我蠻喜歡去別的地方探險，就是我蠻喜歡這種國際學生，因為你可以正視他們國家。",py:"wǒ mán xǐ huān qù bié de dì fāng tàn xiǎn jiù shì wǒ mán xǐ huān zhè zhǒng guó jì xué shēng yīn wèi nǐ kě yǐ zhèng shì tā men guó jiā",id:"Saya cukup suka pergi berpetualang ke tempat lain, saya cukup suka mahasiswa internasional seperti ini, karena kamu bisa menghadapi negara mereka langsung."},
