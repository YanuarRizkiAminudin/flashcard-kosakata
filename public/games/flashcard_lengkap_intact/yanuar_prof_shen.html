<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yanuar × Prof. Shen — Emotion-Aware Interface</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef2f7;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;}
h1{font-size:15px;font-weight:700;color:#1a1814;text-align:center;margin-bottom:3px;}
.sub{font-size:12px;color:#8a8478;text-align:center;margin-bottom:10px;}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.fb{padding:5px 12px;border-radius:99px;border:1px solid #e8e4dc;background:#fff;color:#8a8478;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb:hover{border-color:#7c3aed;color:#7c3aed;}
.fb.on{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.fb.c-Y.on{background:#2563eb;border-color:#2563eb;}
.fb.c-P.on{background:#059669;border-color:#059669;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#f3e8ff;color:#7c3aed;}
.ctr{font-size:13px;color:#8a8478;}
.pbar-bg{height:4px;background:#e8e4dc;border-radius:99px;margin-bottom:.4rem;}
.pbar{height:4px;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:99px;transition:width .4s;}
.plabels{display:flex;justify-content:space-between;font-size:11px;color:#8a8478;margin-bottom:.7rem;}
.pills{display:flex;gap:6px;margin-bottom:.8rem;}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;}
.pl-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.pl-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.pl-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#15803d;}.dh{background:#a05c00;}.db{background:#dc2626;}
.card{background:#fff;border:1px solid #e8e4dc;border-radius:20px;box-shadow:0 4px 20px rgba(124,58,237,.08);min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,linear-gradient(90deg,#7c3aed,#2563eb));}
.card:hover:not(.done){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.15);}
.card-badges{display:flex;gap:6px;margin-bottom:.7rem;flex-wrap:wrap;justify-content:center;}
.card-num{font-size:10px;font-weight:600;color:#a0aec0;background:#f7f8fa;border:1px solid #e8e4dc;border-radius:99px;padding:2px 8px;}
.speaker-tag{font-size:10px;font-weight:700;border-radius:99px;padding:2px 10px;}
.en-front{font-size:15px;font-weight:600;color:#1a1814;line-height:1.7;text-align:center;}
.tap{font-size:12px;color:#b0a8c4;margin-top:1rem;display:flex;align-items:center;gap:5px;}
.ans{margin-top:.8rem;text-align:center;animation:fup .25s ease;width:100%;}
@keyframes fup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.dl{width:36px;height:1px;background:#e8e4dc;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b0a8c4;margin-bottom:4px;}
.ans-id{font-size:14px;font-weight:600;color:#1a1814;line-height:1.7;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}.cb-p:hover{background:#dcfce7;}
.cb-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}.cb-h:hover{background:#fde8c2;}
.cb-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}.cb-b:hover{background:#fee2e2;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#1a1814;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#8a8478;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.sbh{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.sbb{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8a8478;margin-bottom:6px;}
.rlist{border:1px solid #e8e4dc;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fff;}
.ri:last-child{border-bottom:none;}
.ri-en{font-size:12px;color:#1a1814;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#fff1f2;color:#dc2626;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>
<body>
<div id="app">
  <h1>🎓 Yanuar × Prof. Shen</h1>
  <div class="sub" id="sub-lbl">Depan = dialog Inggris · Belakang = terjemahan</div>
  <div class="filters">
    <button class="fb on" onclick="setCat('ALL')">🗂 Semua</button>
    <button class="fb c-Y" onclick="setCat('Y')">👤 Yanuar</button>
    <button class="fb c-P" onclick="setCat('P')">🎓 Prof. Shen</button>
  </div>
  <div id="qv">
    <div class="topbar"><span class="badge" id="rb">Ronde 1</span><span class="ctr" id="ctr">1/--</span></div>
    <div class="pbar-bg"><div class="pbar" id="pb" style="width:0%"></div></div>
    <div class="plabels"><span id="pl">0 selesai</span><span id="pr">-- kartu</span></div>
    <div class="pills">
      <div class="pill pl-p"><span class="dot dp"></span>&nbsp;<span id="sp">0</span>&nbsp;Paham</div>
      <div class="pill pl-h"><span class="dot dh"></span>&nbsp;<span id="sh">0</span>&nbsp;Hampir</div>
      <div class="pill pl-b"><span class="dot db"></span>&nbsp;<span id="sb">0</span>&nbsp;Belum</div>
    </div>
    <div class="card" id="card" onclick="reveal()">
      <div class="card-badges">
        <span class="card-num" id="cn">#1</span>
        <span class="speaker-tag" id="stag"></span>
      </div>
      <div class="en-front" id="en-disp"></div>
      <div class="tap" id="tap"><span>👆</span>Ketuk untuk terjemahan</div>
      <div class="ans" id="ans" style="display:none">
        <div class="dl"></div>
        <div class="atag">🇮🇩 Indonesia</div>
        <div class="ans-id" id="ans-id-txt"></div>
      </div>
    </div>
    <div class="btnrow" id="ba" style="display:none">
      <button class="cb cb-b" onclick="rate(0)"><span class="cb-ico">😓</span><span>Belum</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-h" onclick="rate(1)"><span class="cb-ico">🤔</span><span>Hampir</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-p" onclick="rate(2)"><span class="cb-ico">✅</span><span>Paham</span><span class="cb-sub">Selesai</span></button>
    </div>
  </div>
  <div id="rv" style="display:none">
    <div class="res">
      <div class="res-ico" id="ri2"></div>
      <div class="res-title" id="rt"></div>
      <div class="res-sub" id="rs"></div>
      <div class="srow">
        <div class="sbox sbp"><div class="sn" id="rp">0</div><div class="sl">Paham</div></div>
        <div class="sbox sbh"><div class="sn" id="rh">0</div><div class="sl">Hampir</div></div>
        <div class="sbox sbb"><div class="sn" id="rbb">0</div><div class="sl">Belum</div></div>
      </div>
      <div id="rlw" style="display:none">
        <div class="rlist-wrap">
          <div class="rlist-ttl">Perlu diulang 📌</div>
          <div class="rlist" id="rl"></div>
        </div>
      </div>
      <button class="btnbig btn-purple" id="nb" onclick="nextRonde()"></button>
      <button class="btnbig btn-ghost" onclick="fullRestart()">🔄 Mulai dari awal</button>
    </div>
  </div>
  <div id="fv3" style="display:none">
    <div class="final">
      <div style="font-size:64px;margin-bottom:.8rem">🎉</div>
      <div class="res-title">Selesai!</div>
      <div style="font-size:13px;color:#8a8478;margin:.5rem 0 1.4rem">Dialog dikuasai!</div>
      <button class="btnbig btn-purple" onclick="fullRestart()">🔄 Ulangi dari awal</button>
    </div>
  </div>
</div>
<script>
var V=[
  {s:"Y",en:"Hi Professor, do you have a few minutes? I've been thinking about my project idea and I'd love to get your thoughts on it.",
   id:"Halo Profesor, apakah Anda punya beberapa menit? Saya sedang memikirkan ide proyek saya dan ingin mendengar pendapat Anda."},
  {s:"P",en:"Of course, go ahead, I'm all ears.",
   id:"Tentu saja, silakan, saya mendengarkan."},
  {s:"Y",en:"So, I was looking at the courses I picked — HCI, Machine Learning, and Digital Image Processing — and I kept thinking, what if I could actually combine all three into one project instead of treating them separately?",
   id:"Jadi, saya melihat mata kuliah yang saya pilih — HCI, Machine Learning, dan Pemrosesan Gambar Digital — dan saya terus berpikir, bagaimana kalau saya bisa menggabungkan ketiganya menjadi satu proyek alih-alih menanganinya secara terpisah?"},
  {s:"P",en:"That's an interesting approach. What did you have in mind?",
   id:"Itu pendekatan yang menarik. Apa yang kamu pikirkan?"},
  {s:"Y",en:"Well, here's the idea. I want to build what I'd call an 'emotion-aware interface' — basically, a system that uses a camera to read someone's facial expression in real time, and then the interface itself changes depending on how the person is feeling.",
   id:"Begini idenya. Saya ingin membangun apa yang saya sebut 'antarmuka berbasis emosi' — pada dasarnya, sistem yang menggunakan kamera untuk membaca ekspresi wajah seseorang secara real time, lalu antarmuka itu sendiri berubah tergantung bagaimana perasaan orang tersebut."},
  {s:"P",en:"Oh, that's a nice concept. Can you walk me through how it would actually work?",
   id:"Oh, itu konsep yang bagus. Bisakah kamu jelaskan bagaimana cara kerjanya secara nyata?"},
  {s:"Y",en:"Sure. So on the technical side, I'd use image processing to detect the face and extract features — things like eyebrow position, mouth shape, that kind of thing. Then a machine learning model, probably a CNN, would classify the expression into categories like happy, frustrated, confused, or bored.",
   id:"Tentu. Dari sisi teknis, saya akan menggunakan pemrosesan gambar untuk mendeteksi wajah dan mengekstrak fitur — seperti posisi alis, bentuk mulut, dan sejenisnya. Lalu model machine learning, kemungkinan CNN, akan mengklasifikasikan ekspresi ke dalam kategori seperti senang, frustrasi, bingung, atau bosan."},
  {s:"P",en:"And then what happens with that classification?",
   id:"Lalu apa yang terjadi dengan klasifikasi tersebut?"},
  {s:"Y",en:"That's where the HCI part comes in. Depending on the detected emotion, the interface adapts itself. So if the system detects the user is frustrated or confused, it could simplify the layout, or pop up a hint, or even slow down the pace of the content. And if the user seems bored, maybe it makes things a bit more engaging or interactive.",
   id:"Di situlah bagian HCI masuk. Tergantung emosi yang terdeteksi, antarmuka menyesuaikan dirinya. Jadi jika sistem mendeteksi pengguna frustrasi atau bingung, antarmuka bisa menyederhanakan tata letak, atau memunculkan petunjuk, atau bahkan memperlambat kecepatan konten. Dan jika pengguna terlihat bosan, mungkin antarmuka membuatnya sedikit lebih menarik atau interaktif."},
  {s:"P",en:"I like that direction. What kind of application are you imagining this for? Is it for a specific context, or more general?",
   id:"Saya suka arah itu. Aplikasi jenis apa yang kamu bayangkan? Apakah untuk konteks tertentu, atau lebih umum?"},
  {s:"Y",en:"I was thinking it could work really well for e-learning platforms, actually. Like, imagine a student is going through an online course, and the system notices they're confused during a certain topic — it could automatically slow down or offer extra explanation, instead of the student just struggling silently.",
   id:"Saya pikir ini bisa bekerja sangat baik untuk platform e-learning. Bayangkan seorang siswa sedang mengikuti kursus online, dan sistem menyadari mereka bingung pada topik tertentu — sistem bisa otomatis memperlambat atau menawarkan penjelasan tambahan, alih-alih siswa hanya berjuang diam-diam."},
  {s:"P",en:"That's a strong use case. It ties in nicely with adaptive learning research too. Have you thought about how you'd evaluate whether it actually works?",
   id:"Itu kasus penggunaan yang kuat. Ini juga berkaitan dengan penelitian pembelajaran adaptif. Sudahkah kamu memikirkan bagaimana cara mengevaluasi apakah ini benar-benar berhasil?"},
  {s:"Y",en:"I was planning to run a small user study — have a group of participants use the adaptive version versus a static version of the same interface, and then compare things like task completion time, and maybe a short survey on how frustrated or satisfied they felt.",
   id:"Saya berencana menjalankan studi pengguna kecil — meminta sekelompok peserta menggunakan versi adaptif versus versi statis dari antarmuka yang sama, lalu membandingkan hal seperti waktu penyelesaian tugas, dan mungkin survei singkat tentang seberapa frustrasi atau puas yang mereka rasakan."},
  {s:"P",en:"That's a reasonable plan. Just keep in mind, emotion recognition from facial expression alone can be tricky — lighting conditions, camera angle, cultural differences in how people express emotion, all of that can affect accuracy. You might want to mention that as a limitation early on.",
   id:"Itu rencana yang masuk akal. Perlu diingat, pengenalan emosi dari ekspresi wajah saja bisa rumit — kondisi pencahayaan, sudut kamera, perbedaan budaya dalam cara orang mengekspresikan emosi, semua itu bisa mempengaruhi akurasi. Sebaiknya kamu menyebutkan itu sebagai keterbatasan sejak awal."},
  {s:"Y",en:"Yeah, that makes sense. I was actually a bit worried about the accuracy part. Would it still be a solid project even if the emotion detection isn't perfect, as long as the adaptive behavior itself works well?",
   id:"Ya, itu masuk akal. Saya sebenarnya agak khawatir tentang bagian akurasi. Apakah ini masih bisa menjadi proyek yang kuat meskipun deteksi emosi tidak sempurna, selama perilaku adaptifnya sendiri bekerja dengan baik?"},
  {s:"P",en:"Absolutely, that's actually the more interesting part of the research anyway — how the interface responds and whether that response genuinely improves the user's experience. The detection model doesn't need to be state-of-the-art, it just needs to be good enough to demonstrate the concept.",
   id:"Tentu saja, itu justru bagian penelitian yang lebih menarik — bagaimana antarmuka merespons dan apakah respons itu benar-benar meningkatkan pengalaman pengguna. Model deteksi tidak perlu canggih, cukup cukup baik untuk mendemonstrasikan konsepnya."},
  {s:"Y",en:"That's a relief to hear, honestly. Okay, one more thing — do you think this fits better as an individual project, or would it make more sense to bring in a partner for it?",
   id:"Itu melegakan, sungguh. Oke, satu hal lagi — menurut Anda apakah ini lebih cocok sebagai proyek individual, atau lebih masuk akal untuk mengajak partner?"},
  {s:"P",en:"Given that you're covering three different areas — the image processing pipeline, the ML classification, and the interface design itself — it could definitely work as a two-person project if you want to split the workload. But it's also doable solo if you're comfortable handling all three parts.",
   id:"Mengingat kamu mencakup tiga area berbeda — pipeline pemrosesan gambar, klasifikasi ML, dan desain antarmuka itu sendiri — ini bisa berhasil sebagai proyek dua orang jika kamu ingin membagi beban kerja. Tapi juga bisa dikerjakan sendiri jika kamu nyaman menangani ketiganya."},
  {s:"Y",en:"I think I'd like to try it on my own first, and see how it goes. If it turns out to be too much, I'll let you know.",
   id:"Saya pikir saya ingin mencobanya sendiri dulu, dan lihat bagaimana hasilnya. Jika ternyata terlalu berat, saya akan memberi tahu Anda."},
  {s:"P",en:"Sounds good. Why don't you put together a short proposal outline — just the problem statement, your proposed method, and a rough timeline — and send it over to me. We can refine it from there.",
   id:"Kedengarannya bagus. Kenapa tidak kamu susun kerangka proposal singkat — cukup pernyataan masalah, metode yang kamu usulkan, dan jadwal kasar — lalu kirimkan ke saya. Kita bisa memperbaikinya dari sana."},
  {s:"Y",en:"Perfect, I'll get that ready. Thank you so much for the input, Professor, this really helped me think it through.",
   id:"Sempurna, saya akan menyiapkannya. Terima kasih banyak atas masukannya, Profesor, ini benar-benar membantu saya memikirkannya."},
  {s:"P",en:"No problem at all. I'm looking forward to seeing where you take this.",
   id:"Sama sekali tidak masalah. Saya menantikan ke mana kamu akan membawa proyek ini."}
];

var CAT_CFG={
  Y:{label:"👤 Yanuar",bg:"#dbeafe",fg:"#1d4ed8",acc:"linear-gradient(90deg,#2563eb,#7c3aed)"},
  P:{label:"🎓 Prof. Shen",bg:"#d1fae5",fg:"#065f46",acc:"linear-gradient(90deg,#059669,#2563eb)"}
};

var curCat="ALL",deck=[],idx=0,ronde=1,cp=0,ch=0,cbv=0,rev=false,toRev=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}
function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}
function getFiltered(){return curCat==="ALL"?V.slice():V.filter(function(c){return c.s===curCat;});}
function fullRestart(){
  var src=getFiltered();deck=shuffle(src);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua dialog":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" giliran bicara";
  document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Ronde "+ronde;
  upStats();showCard();
}
function nextRonde(){ronde++;deck=shuffle(toRev);cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("rb").textContent="Ronde "+ronde;upStats();showCard();}
function showCard(){
  rev=false;var c=deck[idx];
  var cfg=CAT_CFG[c.s]||CAT_CFG.Y;
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  var st=document.getElementById("stag");st.textContent=cfg.label;st.style.background=cfg.bg;st.style.color=cfg.fg;
  document.getElementById("en-disp").textContent=c.en;
  document.getElementById("ans-id-txt").textContent=c.id;
  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}
function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}
function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}
function upStats(){document.getElementById("sp").textContent=cp;document.getElementById("sh").textContent=ch;document.getElementById("sb").textContent=cbv;}
function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;document.getElementById("rh").textContent=ch;document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🎉":pct>=70?"😊":pct>=50?"😐":"💪";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" kartu tersisa.":pct>=70?"Bagus! "+toRev.length+" perlu diulang.":"Semangat! "+toRev.length+" kartu menunggumu.";
  document.getElementById("nb").textContent="Lanjut Ronde "+(ronde+1)+" → "+toRev.length+" kartu";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return (b._b||0)-(a._b||0);});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-en'>"+v.en.substring(0,60)+"…</span>"+score;
      rl.appendChild(d);
    });
  }
  document.getElementById("rlw").style.display="";
}
ronde=1;fullRestart();
</script>
</body>
</html>
