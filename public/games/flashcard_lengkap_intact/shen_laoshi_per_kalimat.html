<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef2f7;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;}
h1{font-size:15px;font-weight:700;color:#1a1814;text-align:center;margin-bottom:3px;}
.sub{font-size:12px;color:#8a8478;text-align:center;margin-bottom:10px;}
.filters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.fb{padding:5px 12px;border-radius:99px;border:1px solid #e8e4dc;background:#fff;color:#8a8478;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb:hover{border-color:#7c3aed;color:#7c3aed;}
.fb.on{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.fb.c-KELAS.on{background:#2563eb;border-color:#2563eb;}
.fb.c-TESIS.on{background:#059669;border-color:#059669;}
.fb.c-ADMIN.on{background:#dc2626;border-color:#dc2626;}
.fb.c-NASIHAT.on{background:#d97706;border-color:#d97706;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#f3e8ff;color:#7c3aed;}
.ctr{font-size:13px;color:#8a8478;}
.pbar-bg{height:4px;background:#e8e4dc;border-radius:99px;margin-bottom:.4rem;}
.pbar{height:4px;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:99px;transition:width .4s;}
.plabels{display:flex;justify-content:space-between;font-size:11px;color:#8a8478;margin-bottom:.7rem;}
.pills{display:flex;gap:6px;margin-bottom:.8rem;}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;}
.pl-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.pl-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.pl-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#15803d;}.dh{background:#a05c00;}.db{background:#dc2626;}
.card{background:#fff;border:1px solid #e8e4dc;border-radius:20px;box-shadow:0 4px 20px rgba(124,58,237,.08);min-height:185px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,linear-gradient(90deg,#7c3aed,#2563eb));}
.card:hover:not(.done){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.15);}
.card-badges{display:flex;gap:6px;margin-bottom:.7rem;flex-wrap:wrap;justify-content:center;}
.card-num{font-size:10px;font-weight:600;color:#a0aec0;background:#f7f8fa;border:1px solid #e8e4dc;border-radius:99px;padding:2px 8px;}
.cat-badge{font-size:10px;font-weight:700;border-radius:99px;padding:2px 10px;}
.zh-front{font-family:"Noto Serif TC",serif;font-weight:700;color:#1a1814;text-align:center;line-height:1.55;font-size:16px;}
.tap{font-size:12px;color:#b0a8c4;margin-top:1rem;display:flex;align-items:center;gap:5px;}
.ans{margin-top:.8rem;width:100%;animation:fup .25s ease;}
@keyframes fup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.dl{width:36px;height:1px;background:#e8e4dc;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b0a8c4;margin-bottom:4px;text-align:center;}
.ans-id{font-size:14px;font-weight:600;color:#1a1814;text-align:center;line-height:1.7;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}.cb-p:hover{background:#dcfce7;}
.cb-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}.cb-h:hover{background:#fde8c2;}
.cb-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}.cb-b:hover{background:#fee2e2;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#1a1814;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#8a8478;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.sbh{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.sbb{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8a8478;margin-bottom:6px;}
.rlist{border:1px solid #e8e4dc;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fff;}
.ri:last-child{border-bottom:none;}
.ri-zh{font-family:"Noto Serif TC",serif;font-size:13px;color:#1a1814;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#fff1f2;color:#dc2626;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>
<body>
<div id="app">
  <h1>🏫 沈老師的課 — Per Kalimat</h1>
  <div class="sub" id="sub-lbl">Ketuk untuk terjemahan Indonesia</div>
  <div class="filters">
    <button class="fb on" onclick="setCat('ALL')">🗂 Semua</button>
    <button class="fb c-KELAS" onclick="setCat('KELAS')">📚 Kelas</button>
    <button class="fb c-TESIS" onclick="setCat('TESIS')">📝 Tesis</button>
    <button class="fb c-ADMIN" onclick="setCat('ADMIN')">📋 Administrasi</button>
    <button class="fb c-NASIHAT" onclick="setCat('NASIHAT')">💡 Nasihat</button>
  </div>
  <div id="qv">
    <div class="topbar"><span class="badge" id="rb">Ronde 1</span><span class="ctr" id="ctr">1/--</span></div>
    <div class="pbar-bg"><div class="pbar" id="pb" style="width:0%"></div></div>
    <div class="plabels"><span id="pl">0 selesai</span><span id="pr">-- kartu</span></div>
    <div class="pills">
      <div class="pill pl-p"><span class="dot dp"></span>&nbsp;<span id="sp">0</span>&nbsp;Paham</div>
      <div class="pill pl-h"><span class="dot dh"></span>&nbsp;<span id="sh">0</span>&nbsp;Hampir</div>
      <div class="pill pl-b"><span class="dot db"></span>&nbsp;<span id="sb">0</span>&nbsp;Belum</div>
    </div>
    <div class="card" id="card" onclick="reveal()">
      <div class="card-badges">
        <span class="card-num" id="cn">#1</span>
        <span class="cat-badge" id="ctb"></span>
      </div>
      <div class="zh-front" id="zh-disp"></div>
      <div class="tap" id="tap"><span>👆</span>Ketuk untuk terjemahan</div>
      <div class="ans" id="ans" style="display:none">
        <div class="dl"></div>
        <div class="atag">PINYIN</div>
        <div id="ans-py" style="font-size:14px;font-weight:700;color:#7c3aed;text-align:center;margin-bottom:8px;line-height:1.6;"></div>
        <div class="atag">🇮🇩 Indonesia</div>
        <div class="ans-id" id="ans-id"></div>
      </div>
    </div>
    <div class="btnrow" id="ba" style="display:none">
      <button class="cb cb-b" onclick="rate(0)"><span class="cb-ico">😓</span><span>Belum</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-h" onclick="rate(1)"><span class="cb-ico">🤔</span><span>Hampir</span><span class="cb-sub">Ulang</span></button>
      <button class="cb cb-p" onclick="rate(2)"><span class="cb-ico">✅</span><span>Paham</span><span class="cb-sub">Selesai</span></button>
    </div>
  </div>
  <div id="rv" style="display:none">
    <div class="res">
      <div class="res-ico" id="ri2"></div>
      <div class="res-title" id="rt"></div>
      <div class="res-sub" id="rs"></div>
      <div class="srow">
        <div class="sbox sbp"><div class="sn" id="rp">0</div><div class="sl">Paham</div></div>
        <div class="sbox sbh"><div class="sn" id="rh">0</div><div class="sl">Hampir</div></div>
        <div class="sbox sbb"><div class="sn" id="rbb">0</div><div class="sl">Belum</div></div>
      </div>
      <div id="rlw" style="display:none">
        <div class="rlist-wrap">
          <div class="rlist-ttl">Perlu diulang 📌</div>
          <div class="rlist" id="rl"></div>
        </div>
      </div>
      <button class="btnbig btn-purple" id="nb" onclick="nextRonde()"></button>
      <button class="btnbig btn-ghost" onclick="fullRestart()">🔄 Mulai dari awal</button>
    </div>
  </div>
  <div id="fv3" style="display:none">
    <div class="final">
      <div style="font-size:64px;margin-bottom:.8rem">🎉</div>
      <div class="res-title">Selesai!</div>
      <button class="btnbig btn-purple" onclick="fullRestart()">🔄 Ulangi dari awal</button>
    </div>
  </div>
</div>
<script>
var V=[
{cat:"KELAS",zh:"學校他要收我們，",py:"xué xiào tā yào shōu wǒ men",id:"Sekolah yang menerima kita, guru hanya dosen pengajar. Kamu tidak bisa karena sudah bilang bilingual lalu tidak peduli mahasiswa."},
{cat:"KELAS",zh:"老師只是一個授課的老師，",py:"lǎo shī zhǐ shì yī gè shòu kè de lǎo shī",id:"Sekolah yang menerima kita, guru hanya dosen pengajar. Kamu tidak bisa karena sudah bilang bilingual lalu tidak peduli mahasiswa."},
{cat:"KELAS",zh:"你不能因為他就是訂立雙語，",py:"nǐ bù néng yīn wèi tā jiù shì dìng lì shuāng yǔ",id:"Sekolah yang menerima kita, guru hanya dosen pengajar. Kamu tidak bisa karena sudah bilang bilingual lalu tidak peduli mahasiswa."},
{cat:"KELAS",zh:"就不理學生。",py:"jiù bù lǐ xué shēng",id:"Sekolah yang menerima kita, guru hanya dosen pengajar. Kamu tidak bisa karena sudah bilang bilingual lalu tidak peduli mahasiswa."},
{cat:"KELAS",zh:"因為沈老師的課，",py:"yīn wèi shěn lǎo shī de kè",id:"Karena kelas Shen Laoshi,"},
{cat:"KELAS",zh:"可能沒辦法百分之百完全說中文，",py:"kě néng méi bàn fǎ bǎi fēn zhī bǎi wán quán shuō zhōng wén",id:"mungkin tidak bisa 100% berbicara Mandarin,"},
{cat:"KELAS",zh:"因為有國際學生。",py:"yīn wèi yǒu guó jì xué shēng",id:"karena ada mahasiswa internasional."},
{cat:"KELAS",zh:"我課堂的時間可能就變成切一半，",py:"wǒ kè táng de shí jiān kě néng jiù biàn chéng qiè yī bàn",id:"Waktu mengajar saya mungkin jadi terbagi dua,"},
{cat:"KELAS",zh:"要去克服我的國際學生。",py:"yào qù kè fú wǒ de guó jì xué shēng",id:"untuk mengakomodasi mahasiswa internasional saya."},
{cat:"KELAS",zh:"臺灣的學生對我來講，",py:"tái wān de xué shēng duì wǒ lái jiǎng",id:"Mahasiswa Taiwan bagi saya juga yang paling penting, tapi kita tidak bisa hanya bicara Mandarin terus tidak peduli mereka."},
{cat:"KELAS",zh:"也是最重要的，",py:"yě shì zuì zhòng yào de",id:"Mahasiswa Taiwan bagi saya juga yang paling penting, tapi kita tidak bisa hanya bicara Mandarin terus tidak peduli mereka."},
{cat:"KELAS",zh:"但是我們也是不能說我都全部講中文然後我不理他們。",py:"dàn shì wǒ men yě shì bù néng shuō wǒ dōu quán bù jiǎng zhōng wén rán hòu wǒ bù lǐ tā men",id:"Mahasiswa Taiwan bagi saya juga yang paling penting, tapi kita tidak bisa hanya bicara Mandarin terus tidak peduli mereka."},
{cat:"KELAS",zh:"如果你有什麼想法或是什麼，",py:"rú guǒ nǐ yǒu shén me xiǎng fǎ huò shì shén me",id:"Kalau kamu punya pikiran atau apapun,"},
{cat:"KELAS",zh:"可以私信我或是可以在臉書的群組講都無所謂。",py:"kě yǐ sī xìn wǒ huò shì kě yǐ zài liǎn shū de qún zǔ jiǎng dōu wú suǒ wèi",id:"bisa DM saya atau bicara di grup Facebook,"},
{cat:"KELAS",zh:"我比較希望用臉書，",py:"wǒ bǐ jiào xī wàng yòng liǎn shū",id:"Saya lebih suka pakai Facebook, karena grup Line kalau ganti HP tanpa backup biasanya hilang."},
{cat:"KELAS",zh:"因為 Line 的群組你通常換手機除非你備份，",py:"yīn wèi de qún zǔ nǐ tōng cháng huàn shǒu jī chú fēi nǐ bèi fèn",id:"Saya lebih suka pakai Facebook, karena grup Line kalau ganti HP tanpa backup biasanya hilang."},
{cat:"KELAS",zh:"否則就沒有了。",py:"fǒu zé jiù méi yǒu le",id:"Saya lebih suka pakai Facebook, karena grup Line kalau ganti HP tanpa backup biasanya hilang."},
{cat:"KELAS",zh:"我的群組從我已經在教書22年了。",py:"wǒ de qún zǔ cóng wǒ yǐ jīng zài jiào shū nián le",id:"Grup saya sudah ada sejak saya mengajar selama 22 tahun."},
{cat:"KELAS",zh:"雖然我外表看不太清楚，",py:"suī rán wǒ wài biǎo kàn bù tài qīng chǔ",id:"Walaupun penampilan saya tidak terlalu kelihatan tua,"},
{cat:"KELAS",zh:"其實我應該是你們阿公阿媽級的。",py:"qí shí wǒ yīng gāi shì nǐ men ā gōng ā mā jí de",id:"sebenarnya saya sudah level kakek nenek kalian."},
{cat:"KELAS",zh:"我沒有去整形喔，",py:"wǒ méi yǒu qù zhěng xíng ō",id:"Saya tidak operasi plastik ya,"},
{cat:"KELAS",zh:"但是我有打玻尿酸，",py:"dàn shì wǒ yǒu dǎ bō niào suān",id:"tapi saya suntik filler,"},
{cat:"KELAS",zh:"這是一定有的，",py:"zhè shì yī dìng yǒu de",id:"itu pasti ada,"},
{cat:"KELAS",zh:"就是維持至少看起來就是不要太老。",py:"jiù shì wéi chí zhì shǎo kàn qǐ lái jiù shì bù yào tài lǎo",id:"supaya setidaknya tidak kelihatan terlalu tua."},
{cat:"KELAS",zh:"我比較希望你們叫老師姐姐，",py:"wǒ bǐ jiào xī wàng nǐ men jiào lǎo shī jiě jiě",id:"Saya lebih suka kalian panggil 'kakak guru', jangan panggil saya 'tante' atau 'nenek'."},
{cat:"KELAS",zh:"不要叫我大嬸，",py:"bù yào jiào wǒ dà shěn",id:"Saya lebih suka kalian panggil 'kakak guru', jangan panggil saya 'tante' atau 'nenek'."},
{cat:"KELAS",zh:"也不要叫我婆婆或是阿嬤。",py:"yě bù yào jiào wǒ pó pó huò shì ā mā",id:"Saya lebih suka kalian panggil 'kakak guru', jangan panggil saya 'tante' atau 'nenek'."},
{cat:"KELAS",zh:"老師賺的錢不會因為有國際學生就有加價，",py:"lǎo shī zhuàn de qián bù huì yīn wèi yǒu guó jì xué shēng jiù yǒu jiā jià",id:"Gaji guru tidak naik karena ada mahasiswa internasional,"},
{cat:"KELAS",zh:"我就是居民價，",py:"wǒ jiù shì jū mín jià",id:"saya tetap gaji standar,"},
{cat:"KELAS",zh:"因為我只是員工。",py:"yīn wèi wǒ zhǐ shì yuán gōng",id:"karena saya hanya karyawan."},
{cat:"KELAS",zh:"因為我們有外籍生，",py:"yīn wèi wǒ men yǒu wài jí shēng",id:"Karena ada mahasiswa asing,"},
{cat:"KELAS",zh:"所以我上課的時間跟進度就會有一點沒辦法很迅速。",py:"suǒ yǐ wǒ shàng kè de shí jiān gēn jìn dù jiù huì yǒu yī diǎn méi bàn fǎ hěn xùn sù",id:"waktu mengajar dan kemajuan kelas tidak bisa terlalu cepat."},
{cat:"KELAS",zh:"在這邊請同學先原諒我，",py:"zài zhè biān qǐng tóng xué xiān yuán liàng wǒ",id:"Di sini tolong teman-teman memaafkan saya dulu,"},
{cat:"KELAS",zh:"就說我可能有一半不講中文。",py:"jiù shuō wǒ kě néng yǒu yī bàn bù jiǎng zhōng wén",id:"karena mungkin setengahnya tidak saya sampaikan dalam bahasa Mandarin."},
{cat:"KELAS",zh:"我的 quality 絕對不會差，",py:"wǒ de jué duì bù huì chà",id:"Kualitas saya pasti tidak akan buruk,"},
{cat:"KELAS",zh:"但是我的進度就很慢。",py:"dàn shì wǒ de jìn dù jiù hěn màn",id:"tapi kemajuannya akan lambat."},
{cat:"KELAS",zh:"均一價，只收到保真的，吃到飽，那你說知識是什麼？",py:"jūn yī jià zhǐ shōu dào bǎo zhēn de chī dào bǎo nà nǐ shuō zhī shí shì shén me",id:"Harga seragam,"},
{cat:"KELAS",zh:"沒知識啊。",py:"méi zhī shí a",id:"bayar pas dan dapat semua yang ada,"},
{cat:"KELAS",zh:"如果是三節課，",py:"rú guǒ shì sān jié kè",id:"Kalau ada tiga sesi, saya tidak akan mengajar penuh tiga sesi karena itu tidak efektif."},
{cat:"KELAS",zh:"我不會三節課全部上完，",py:"wǒ bù huì sān jié kè quán bù shàng wán",id:"Kalau ada tiga sesi, saya tidak akan mengajar penuh tiga sesi karena itu tidak efektif."},
{cat:"KELAS",zh:"因為那個是沒有效果的。",py:"yīn wèi nà gè shì méi yǒu xiào guǒ de",id:"Kalau ada tiga sesi, saya tidak akan mengajar penuh tiga sesi karena itu tidak efektif."},
{cat:"KELAS",zh:"剩下你們可以在這裡自由討論或是做作業都是可以的。",py:"shèng xià nǐ men kě yǐ zài zhè lǐ zì yóu tǎo lùn huò shì zuò zuò yè dōu shì kě yǐ de",id:"Sisanya kalian bisa bebas diskusi atau mengerjakan tugas di sini."},
{cat:"KELAS",zh:"你甚至可以在課堂上做 PPT 或者做別人提報的時候自己再做簡報也可以。",py:"nǐ shèn zhì kě yǐ zài kè táng shàng zuò huò zhě zuò bié rén tí bào de shí hòu zì jǐ zài zuò jiǎn bào yě kě yǐ",id:"Kamu bahkan bisa mengerjakan PPT di kelas atau waktu orang lain presentasi kamu buat slidenya sendiri juga boleh."},
{cat:"KELAS",zh:"我都是講重點，",py:"wǒ dōu shì jiǎng zhòng diǎn",id:"Saya selalu menyampaikan poinnya saja, sisanya kalian bisa bebas diskusi atau mengerjakan tugas di sini."},

{cat:"TESIS",zh:"我可以告訴你方法，",py:"wǒ kě yǐ gào sù nǐ fāng fǎ",id:"Saya bisa beritahu caranya,"},
{cat:"TESIS",zh:"可是你自己要去做，",py:"kě shì nǐ zì jǐ yào qù zuò",id:"tapi kamu sendiri yang harus melakukannya,"},
{cat:"TESIS",zh:"時間管理是你的，",py:"shí jiān guǎn lǐ shì nǐ de",id:"manajemen waktu adalah milikmu,"},
{cat:"TESIS",zh:"不是我的。",py:"bù shì wǒ de",id:"bukan milikku."},
{cat:"TESIS",zh:"大部分都拖到2到3年，",py:"dà bù fēn dōu tuō dào dào nián",id:"Kebanyakan molor sampai 2-3 tahun,"},
{cat:"TESIS",zh:"準時2年以內畢業很少。",py:"zhǔn shí nián yǐ nèi bì yè hěn shǎo",id:"sangat jarang yang selesai tepat waktu dalam 2 tahun."},
{cat:"TESIS",zh:"你同一時間進來，",py:"nǐ tóng yī shí jiān jìn lái",id:"Masuk bersamaan tidak berarti keluar bersamaan, itu masalah manajemen waktu kamu sendiri."},
{cat:"TESIS",zh:"不一定同一時間出得去，",py:"bù yī dìng tóng yī shí jiān chū dé qù",id:"Masuk bersamaan tidak berarti keluar bersamaan, itu masalah manajemen waktu kamu sendiri."},
{cat:"TESIS",zh:"所以是你自己時間管理的問題。",py:"suǒ yǐ shì nǐ zì jǐ shí jiān guǎn lǐ de wèn tí",id:"Masuk bersamaan tidak berarti keluar bersamaan, itu masalah manajemen waktu kamu sendiri."},
{cat:"TESIS",zh:"做創作呢，",py:"zuò chuàng zuò ne",id:"Untuk karya kreatif,"},
{cat:"TESIS",zh:"你可能要有一個展演或者是參加一個比賽的證明。",py:"nǐ kě néng yào yǒu yī gè zhǎn yǎn huò zhě shì cān jiā yī gè bǐ sài de zhèng míng",id:"kamu mungkin perlu bukti pertunjukan atau mengikuti kompetisi."},
{cat:"TESIS",zh:"做論文的可能要參加某個研討會去發表，",py:"zuò lùn wén de kě néng yào cān jiā mǒu gè yán tǎo huì qù fā biǎo",id:"Untuk penulisan tesis perlu ikut seminar untuk presentasi,"},
{cat:"TESIS",zh:"你要有這樣的資格門檻才可以提出口考。",py:"nǐ yào yǒu zhè yàng de zī gé mén kǎn cái kě yǐ tí chū kǒu kǎo",id:"kamu butuh kualifikasi seperti itu baru bisa mengajukan ujian lisan."},
{cat:"TESIS",zh:"不要急著找老師，",py:"bù yào jí zhù zhǎo lǎo shī",id:"Jangan terburu-buru mencari dosen pembimbing,"},
{cat:"TESIS",zh:"每一個老師都去談談看，",py:"měi yī gè lǎo shī dōu qù tán tán kàn",id:"coba ngobrol dengan setiap dosen dulu,"},
{cat:"TESIS",zh:"哪一個跟你的理念比較合適。",py:"nǎ yī gè gēn nǐ de lǐ niàn bǐ jiào hé shì",id:"mana yang paling cocok dengan ide kamu."},
{cat:"TESIS",zh:"你本來選了 A，",py:"nǐ běn lái xuǎn le",id:"Kamu awalnya pilih A,"},
{cat:"TESIS",zh:"後來又覺得不合適，",py:"hòu lái yòu jué dé bù hé shì",id:"lalu merasa tidak cocok,"},
{cat:"TESIS",zh:"就再換了 B，",py:"jiù zài huàn le",id:"lalu ganti ke B,"},
{cat:"TESIS",zh:"就是會耽誤了一些時間。",py:"jiù shì huì dān wù le yī xiē shí jiān",id:"itu akan membuang waktu."},
{cat:"TESIS",zh:"除非已經有老師拉你，",py:"chú fēi yǐ jīng yǒu lǎo shī lā nǐ",id:"Kecuali sudah ada dosen yang mengajak kamu dan kamu rasa oke, kalau tidak saya selalu anjurkan mahasiswa jangan terburu cari pembimbing."},
{cat:"TESIS",zh:"你覺得還不錯，",py:"nǐ jué dé hái bù cuò",id:"Kecuali sudah ada dosen yang mengajak kamu dan kamu rasa oke, kalau tidak saya selalu anjurkan mahasiswa jangan terburu cari pembimbing."},
{cat:"TESIS",zh:"不然我都鼓勵同學不要太急著找老師。",py:"bù rán wǒ dōu gǔ lì tóng xué bù yào tài jí zhù zhǎo lǎo shī",id:"Kecuali sudah ada dosen yang mengajak kamu dan kamu rasa oke, kalau tidak saya selalu anjurkan mahasiswa jangan terburu cari pembimbing."},
{cat:"TESIS",zh:"每一個老師都去談談看，",py:"měi yī gè lǎo shī dōu qù tán tán kàn",id:"Coba ngobrol dengan setiap dosen dulu,"},
{cat:"TESIS",zh:"哪一個跟你的坐的方向比較契合，",py:"nǎ yī gè gēn nǐ de zuò de fāng xiàng bǐ jiào qì hé",id:"mana yang arah penelitiannya lebih cocok dengan kamu,"},
{cat:"TESIS",zh:"你再去選。",py:"nǐ zài qù xuǎn",id:"baru kamu pilih."},
{cat:"TESIS",zh:"比較懶惰的，",py:"bǐ jiào lǎn duò de",id:"Yang agak malas,"},
{cat:"TESIS",zh:"你要找能夠盯住的、穩定的老師，",py:"nǐ yào zhǎo néng gòu dīng zhù de wěn dìng de lǎo shī",id:"kamu perlu cari dosen yang bisa mengawasi dan konsisten,"},
{cat:"TESIS",zh:"因為你自己的狀況你最清楚。",py:"yīn wèi nǐ zì jǐ de zhuàng kuàng nǐ zuì qīng chǔ",id:"karena kamu paling tahu kondisimu sendiri."},
{cat:"TESIS",zh:"像嘉軒，",py:"xiàng jiā xuān",id:"Seperti Jiaxuan,"},
{cat:"TESIS",zh:"他就是很認真，",py:"tā jiù shì hěn rèn zhēn",id:"dia sangat serius,"},
{cat:"TESIS",zh:"他就是要2210個月畢業，",py:"tā jiù shì yào gè yuè bì yè",id:"dia ingin lulus 22 bulan,"},
{cat:"TESIS",zh:"他已經知道自己要做什麼，",py:"tā yǐ jīng zhī dào zì jǐ yào zuò shén me",id:"dia sudah tahu mau buat apa,"},
{cat:"TESIS",zh:"只是需要老師去跑一下流程。",py:"zhǐ shì xū yào lǎo shī qù pǎo yī xià liú chéng",id:"hanya butuh dosen untuk menjalankan prosedurnya."},
{cat:"TESIS",zh:"目前你一定沒有什麼特定想法，",py:"mù qián nǐ yī dìng méi yǒu shén me tè dìng xiǎng fǎ",id:"Sekarang kamu pasti belum punya ide khusus,"},
{cat:"TESIS",zh:"可是通常都會延續大學專題的方向或者之前的工作方向。",py:"kě shì tōng cháng dōu huì yán xù dà xué zhuān tí de fāng xiàng huò zhě zhī qián de gōng zuò fāng xiàng",id:"tapi biasanya melanjutkan arah proyek skripsi atau arah kerja sebelumnya."},
{cat:"TESIS",zh:"很多人說我要做 AR，",py:"hěn duō rén shuō wǒ yào zuò",id:"Banyak yang bilang mau buat AR,"},
{cat:"TESIS",zh:"好看了很多，",py:"hǎo kàn le hěn duō",id:"sudah lihat banyak,"},
{cat:"TESIS",zh:"AI 看多了，",py:"kàn duō le",id:"terlalu banyak lihat AI,"},
{cat:"TESIS",zh:"他不知道做什麼，",py:"tā bù zhī dào zuò shén me",id:"lalu tidak tahu mau buat apa,"},
{cat:"TESIS",zh:"然後說絕對不要做 AI。",py:"rán hòu shuō jué duì bù yào zuò",id:"terus bilang pasti tidak mau buat AI."},
{cat:"TESIS",zh:"沒有什麼題目是好做的，",py:"méi yǒu shén me tí mù shì hǎo zuò de",id:"Tidak ada topik yang mudah,"},
{cat:"TESIS",zh:"也沒有什麼題目是不能做的，",py:"yě méi yǒu shén me tí mù shì bù néng zuò de",id:"juga tidak ada topik yang tidak bisa dikerjakan,"},
{cat:"TESIS",zh:"重點你想 shift 在什麼地方。",py:"zhòng diǎn nǐ xiǎng zài shén me dì fāng",id:"intinya kamu mau fokus di mana."},
{cat:"TESIS",zh:"你要多看，",py:"nǐ yào duō kàn",id:"Kamu harus banyak melihat,"},
{cat:"TESIS",zh:"你沒有多看，",py:"nǐ méi yǒu duō kàn",id:"kalau tidak banyak melihat,"},
{cat:"TESIS",zh:"你絕對問題有限。",py:"nǐ jué duì wèn tí yǒu xiàn",id:"pertanyaan-pertanyaanmu pasti terbatas."},
{cat:"TESIS",zh:"你可以問 AI，",py:"nǐ kě yǐ wèn",id:"Kamu bisa tanya AI,"},
{cat:"TESIS",zh:"但是重點就是你要弄懂，",py:"dàn shì zhòng diǎn jiù shì nǐ yào nòng dǒng",id:"tapi intinya kamu harus mengerti,"},
{cat:"TESIS",zh:"你不懂是沒有用的。",py:"nǐ bù dǒng shì méi yǒu yòng de",id:"kalau tidak mengerti tidak ada gunanya."},
{cat:"TESIS",zh:"老師跳得太快，",py:"lǎo shī tiào dé tài kuài",id:"Kalau guru terlalu cepat,"},
{cat:"TESIS",zh:"請你也跟我講好，",py:"qǐng nǐ yě gēn wǒ jiǎng hǎo",id:"tolong beritahu saya ya,"},
{cat:"TESIS",zh:"請你也跟我講喔。",py:"qǐng nǐ yě gēn wǒ jiǎng ō",id:"tolong beritahu saya ya."},
{cat:"TESIS",zh:"嘉軒是非常認真的同學，",py:"jiā xuān shì fēi cháng rèn zhēn de tóng xué",id:"Jiaxuan adalah mahasiswa yang sangat serius,"},
{cat:"TESIS",zh:"上學期畢業，",py:"shàng xué qī bì yè",id:"semester lalu lulus,"},
{cat:"TESIS",zh:"終於，",py:"zhōng yú",id:"akhirnya,"},
{cat:"TESIS",zh:"還蠻辛苦的，",py:"hái mán xīn kǔ de",id:"cukup berat perjuangannya,"},
{cat:"TESIS",zh:"他是直升的，",py:"tā shì zhí shēng de",id:"dia langsung lanjut S2,"},
{cat:"TESIS",zh:"沒有工作經驗。",py:"méi yǒu gōng zuò jīng yàn",id:"tidak punya pengalaman kerja."},
{cat:"TESIS",zh:"整理資料不在於多，在於你自己能夠看清楚多少。",py:"zhěng lǐ zī liào bù zài yú duō zài yú nǐ zì jǐ néng gòu kàn qīng chǔ duō shǎo",id:"Mengorganisir data bukan soal banyaknya,"},
{cat:"TESIS",zh:"好，當然，看的那一本可能很難懂。",py:"hǎo dāng rán kàn de nà yī běn kě néng hěn nán dǒng",id:"tapi seberapa jelas kamu bisa memahaminya."},
{cat:"TESIS",zh:"你要縫你不懂是沒有用的，",py:"nǐ yào fèng nǐ bù dǒng shì méi yǒu yòng de",id:"Kalau kamu tidak mengerti tidak ada gunanya,"},
{cat:"TESIS",zh:"你可能會以為你懂了，",py:"nǐ kě néng huì yǐ wèi nǐ dǒng le",id:"kamu mungkin pikir sudah mengerti,"},
{cat:"TESIS",zh:"但是自己整理資料，",py:"dàn shì zì jǐ zhěng lǐ zī liào",id:"tapi mengorganisir data sendiri,"},
{cat:"TESIS",zh:"有沒有可能自己還是會忘記的。",py:"yǒu méi yǒu kě néng zì jǐ hái shì huì wàng jì de",id:"ada kemungkinan kamu masih bisa lupa."},
{cat:"TESIS",zh:"你要縫你不懂是沒有用的，",py:"nǐ yào fèng nǐ bù dǒng shì méi yǒu yòng de",id:"Kalau kamu hanya hafal tanpa mengerti tidak ada gunanya,"},
{cat:"TESIS",zh:"所以你一定要花時間下去想。",py:"suǒ yǐ nǐ yī dìng yào huā shí jiān xià qù xiǎng",id:"jadi kamu harus luangkan waktu untuk benar-benar memikirkannya."},
{cat:"TESIS",zh:"準時2年內畢業是指畢業在2年以內，",py:"zhǔn shí nián nèi bì yè shì zhǐ bì yè zài nián yǐ nèi",id:"Lulus tepat waktu dalam 2 tahun artinya selesai sebelum 2 tahun, karena dia memang sudah sangat jelas mau buat apa, dan dia sangat serius dalam mengerjakan."},
{cat:"TESIS",zh:"因為他是本來就很清楚，",py:"yīn wèi tā shì běn lái jiù hěn qīng chǔ",id:"Lulus tepat waktu dalam 2 tahun artinya selesai sebelum 2 tahun, karena dia memang sudah sangat jelas mau buat apa, dan dia sangat serius dalam mengerjakan."},
{cat:"TESIS",zh:"要做什麼，",py:"yào zuò shén me",id:"Lulus tepat waktu dalam 2 tahun artinya selesai sebelum 2 tahun, karena dia memang sudah sangat jelas mau buat apa, dan dia sangat serius dalam mengerjakan."},
{cat:"TESIS",zh:"而且他做事非常認真。",py:"ér qiě tā zuò shì fēi cháng rèn zhēn",id:"Lulus tepat waktu dalam 2 tahun artinya selesai sebelum 2 tahun, karena dia memang sudah sangat jelas mau buat apa, dan dia sangat serius dalam mengerjakan."},
{cat:"TESIS",zh:"大家最常用的就那幾個：問卷調查法、訪談法、焦點團體法，",py:"dà jiā zuì cháng yòng de jiù nà jǐ gè wèn juǎn diào chá fǎ fǎng tán fǎ jiāo diǎn tuán tǐ fǎ",id:"Yang paling sering dipakai semua orang hanya beberapa: survei kuesioner,"},
{cat:"TESIS",zh:"同學選的都差不多。",py:"tóng xué xuǎn de dōu chà bù duō",id:"wawancara,"},
{cat:"TESIS",zh:"如果每個人選的或多或少一樣，",py:"rú guǒ měi gè rén xuǎn de huò duō huò shǎo yī yàng",id:"Kalau semua orang pilih yang kurang lebih sama,"},
{cat:"TESIS",zh:"到學期末的時候，",py:"dào xué qī mò de shí hòu",id:"di akhir semester,"},
{cat:"TESIS",zh:"每個人提報一遍，",py:"měi gè rén tí bào yī biàn",id:"setiap orang presentasi sekali,"},
{cat:"TESIS",zh:"這本書是不是就等於用完了。",py:"zhè běn shū shì bù shì jiù děng yú yòng wán le",id:"bukunya jadi seolah sudah habis dipelajari."},
{cat:"TESIS",zh:"有些人喜歡用圖案，",py:"yǒu xiē rén xǐ huān yòng tú àn",id:"Ada yang suka pakai gambar,"},
{cat:"TESIS",zh:"有些人不喜歡用圖案，",py:"yǒu xiē rén bù xǐ huān yòng tú àn",id:"ada yang tidak suka pakai gambar,"},
{cat:"TESIS",zh:"他跟我講說老師我真的認真看了很久哦，",py:"tā gēn wǒ jiǎng shuō lǎo shī wǒ zhēn de rèn zhēn kàn le hěn jiǔ ó",id:"dia bilang guru saya benar-benar baca lama lho,"},
{cat:"TESIS",zh:"那整理資料不在於多。",py:"nà zhěng lǐ zī liào bù zài yú duō",id:"nah mengorganisir data bukan soal banyaknya."},
{cat:"TESIS",zh:"以後有機會，",py:"yǐ hòu yǒu jī huì",id:"Ke depan ada kesempatan,"},
{cat:"TESIS",zh:"因為他要跟老師去福岡11月去福岡發表，",py:"yīn wèi tā yào gēn lǎo shī qù fú gāng yuè qù fú gāng fā biǎo",id:"karena dia akan ikut guru ke Fukuoka November untuk presentasi,"},
{cat:"TESIS",zh:"因為剛好我也要去。",py:"yīn wèi gāng hǎo wǒ yě yào qù",id:"kebetulan saya juga mau pergi."},
{cat:"ADMIN",zh:"東西寫出來了，",py:"dōng xī xiě chū lái le",id:"Setelah selesai ditulis,"},
{cat:"ADMIN",zh:"一定要上傳到圖書館，",py:"yī dìng yào shàng chuán dào tú shū guǎn",id:"harus diunggah ke perpustakaan,"},
{cat:"ADMIN",zh:"圖書館會幫你做一個論文原創性的比對系統。",py:"tú shū guǎn huì bāng nǐ zuò yī gè lùn wén yuán chuàng xìng de bǐ duì xì tǒng",id:"perpustakaan akan membantu cek sistem keaslian tesis."},
{cat:"ADMIN",zh:"如果36%是太高，",py:"rú guǒ shì tài gāo",id:"Kalau 36% itu terlalu tinggi,"},
{cat:"ADMIN",zh:"一般是要13以下會比較好，",py:"yī bān shì yào yǐ xià huì bǐ jiào hǎo",id:"umumnya di bawah 13% lebih baik,"},
{cat:"ADMIN",zh:"就是說你有沒有跟人家的論文相似。",py:"jiù shì shuō nǐ yǒu méi yǒu gēn rén jiā de lùn wén xiāng shì",id:"artinya apakah tesismu mirip dengan tesis orang lain."},
{cat:"ADMIN",zh:"研究倫理就是6個小時，",py:"yán jiū lún lǐ jiù shì gè xiǎo shí",id:"Etika penelitian itu 6 jam, bisa ikut di sumber pendidikan etika akademik Taiwan, gratis tapi harus daftar."},
{cat:"ADMIN",zh:"你可以上臺灣學術倫理教育資源，",py:"nǐ kě yǐ shàng tái wān xué shù lún lǐ jiào yù zī yuán",id:"Etika penelitian itu 6 jam, bisa ikut di sumber pendidikan etika akademik Taiwan, gratis tapi harus daftar."},
{cat:"ADMIN",zh:"免費的，",py:"miǎn fèi de",id:"Etika penelitian itu 6 jam, bisa ikut di sumber pendidikan etika akademik Taiwan, gratis tapi harus daftar."},
{cat:"ADMIN",zh:"但是你要註冊。",py:"dàn shì nǐ yào zhù cè",id:"Etika penelitian itu 6 jam, bisa ikut di sumber pendidikan etika akademik Taiwan, gratis tapi harus daftar."},
{cat:"ADMIN",zh:"他會給你一張數位的證明，",py:"tā huì gěi nǐ yī zhāng shù wèi de zhèng míng",id:"Mereka akan memberi kamu sertifikat digital,"},
{cat:"ADMIN",zh:"你要這個你才可以提出口考。",py:"nǐ yào zhè gè nǐ cái kě yǐ tí chū kǒu kǎo",id:"kamu butuh ini baru bisa mengajukan ujian lisan."},
{cat:"ADMIN",zh:"論文比對系統在6、7月大塞車，",py:"lùn wén bǐ duì xì tǒng zài yuè dà sāi chē",id:"Sistem pembandingan tesis di bulan 6-7 sangat macet,"},
{cat:"ADMIN",zh:"你口考完之後還要再上傳繳交一些文件。",py:"nǐ kǒu kǎo wán zhī hòu hái yào zài shàng chuán jiǎo jiāo yī xiē wén jiàn",id:"setelah ujian lisan kamu masih harus unggah dan serahkan beberapa dokumen."},
{cat:"ADMIN",zh:"假設你全部弄完，",py:"jiǎ shè nǐ quán bù nòng wán",id:"Asumsi kamu selesaikan semuanya,"},
{cat:"ADMIN",zh:"731以前就可以順利拿到畢業證書。",py:"yǐ qián jiù kě yǐ shùn lì ná dào bì yè zhèng shū",id:"sebelum 31 Juli kamu bisa terima ijazah dengan lancar."},
{cat:"ADMIN",zh:"如果有任何一個步驟沒有完成，",py:"rú guǒ yǒu rèn hé yī gè bù zhòu méi yǒu wán chéng",id:"Kalau ada salah satu langkah yang belum selesai,"},
{cat:"ADMIN",zh:"那你就是要到8、9月才有辦法拿到畢業證書。",py:"nà nǐ jiù shì yào dào yuè cái yǒu bàn fǎ ná dào bì yè zhèng shū",id:"kamu baru bisa dapat ijazah di bulan 8-9."},
{cat:"ADMIN",zh:"口考完成之後，",py:"kǒu kǎo wán chéng zhī hòu",id:"Setelah ujian lisan selesai,"},

var CAT_CFG={
  KELAS:{label:"📚 Kelas",bg:"#dbeafe",fg:"#1d4ed8",acc:"linear-gradient(90deg,#2563eb,#7c3aed)"},
  TESIS:{label:"📝 Tesis",bg:"#d1fae5",fg:"#065f46",acc:"linear-gradient(90deg,#059669,#2563eb)"},
  ADMIN:{label:"📋 Administrasi",bg:"#fee2e2",fg:"#b91c1c",acc:"linear-gradient(90deg,#dc2626,#d97706)"},
  NASIHAT:{label:"💡 Nasihat",bg:"#fef3c7",fg:"#92400e",acc:"linear-gradient(90deg,#d97706,#059669)"}
};

var curCat="ALL",deck=[],idx=0,ronde=1,cp=0,ch=0,cbv=0,rev=false,toRev=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}
function setCat(c){
  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}
function getFiltered(){return curCat==="ALL"?V.slice():V.filter(function(c){return c.cat===curCat;});}
function fullRestart(){
  var src=getFiltered();deck=shuffle(src);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" kalimat";
  document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Ronde "+ronde;
  upStats();showCard();
}
function nextRonde(){ronde++;deck=shuffle(toRev);cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("rb").textContent="Ronde "+ronde;upStats();showCard();}
function showCard(){
  rev=false;var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.KELAS;
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  var ctb=document.getElementById("ctb");ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;
  document.getElementById("zh-disp").textContent=c.zh;
  document.getElementById("ans-py").textContent=c.py||"";
  document.getElementById("ans-id").textContent=c.id;
  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}
function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}
function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}
function upStats(){document.getElementById("sp").textContent=cp;document.getElementById("sh").textContent=ch;document.getElementById("sb").textContent=cbv;}
function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;document.getElementById("rh").textContent=ch;document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🎉":pct>=70?"😊":pct>=50?"😐":"💪";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" kartu tersisa.":pct>=70?"Bagus! "+toRev.length+" kartu perlu diulang.":"Semangat! "+toRev.length+" kartu menunggumu.";
  document.getElementById("nb").textContent="Lanjut Ronde "+(ronde+1)+" → "+toRev.length+" kartu";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return (b._b||0)-(a._b||0);});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-zh'>"+v.zh.substring(0,20)+"…</span>"+score;
      rl.appendChild(d);
    });
    document.getElementById("rlw").style.display="";
  }
}
ronde=1;fullRestart();
