<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef2f7;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;}
h1{font-size:15px;font-weight:700;color:#1a1814;text-align:center;margin-bottom:3px;}

.fb.c-C1.on{background:#2563eb;border-color:#2563eb;}
.fb.c-C2.on{background:#059669;border-color:#059669;}
.fb.c-C3.on{background:#dc2626;border-color:#dc2626;}
.fb.c-C4.on{background:#d97706;border-color:#d97706;}
.fb.c-C5.on{background:#7c3aed;border-color:#7c3aed;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 11px;border-radius:99px;background:#f3e8ff;color:#7c3aed;}
.ctr{font-size:13px;color:#8a8478;}

.pills{display:flex;gap:6px;margin-bottom:.8rem;}

.pl-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}

.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dp{background:#15803d;}.dh{background:#a05c00;}.db{background:#dc2626;}
.card{background:#fff;border:1px solid #e8e4dc;border-radius:20px;box-shadow:0 4px 20px rgba(124,58,237,.08);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem 1.4rem;margin-bottom:.8rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}

.tap{font-size:12px;color:#b0a8c4;margin-top:1rem;display:flex;align-items:center;gap:5px;}

.dl{width:36px;height:1px;background:#e8e4dc;margin:0 auto .7rem;}
.atag{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b0a8c4;margin-bottom:4px;}
.polite-tag{font-size:11px;color:#059669;font-weight:700;margin-bottom:6px;}
.ans-polite{font-size:15px;font-weight:600;color:#1a1814;line-height:1.7;background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:12px 14px;text-align:left;}
.btnrow{display:flex;gap:7px;margin-bottom:.7rem;}
.cb{flex:1;padding:10px 5px;border-radius:13px;border:1.5px solid;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .14s;}
.cb-ico{font-size:17px;}.cb-sub{font-size:9px;font-weight:500;opacity:.7;}
.cb-p{background:#f0fdf4;border-color:#86efac;color:#15803d;}.cb-p:hover{background:#dcfce7;}
.cb-h{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}.cb-h:hover{background:#fde8c2;}
.cb-b{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}.cb-b:hover{background:#fee2e2;}
.res{text-align:center;padding:.8rem 0;}
.res-ico{font-size:52px;margin-bottom:.7rem;}
.res-title{font-size:20px;font-weight:700;color:#1a1814;margin-bottom:.3rem;}
.res-sub{font-size:13px;color:#8a8478;margin-bottom:1.2rem;line-height:1.6;}
.srow{display:flex;gap:7px;margin-bottom:1.2rem;}
.sbox{flex:1;padding:10px 5px;border-radius:13px;border:1px solid;text-align:center;}
.sn{font-size:22px;font-weight:700;}.sl{font-size:10px;margin-top:2px;font-weight:500;}
.sbp{background:#f0fdf4;border-color:#86efac;color:#15803d;}
.sbh{background:#fef3e2;border-color:#f5c97a;color:#a05c00;}
.sbb{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.rlist-wrap{text-align:left;margin-bottom:1rem;}
.rlist-ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8a8478;margin-bottom:6px;}
.rlist{border:1px solid #e8e4dc;border-radius:13px;overflow:hidden;max-height:200px;overflow-y:auto;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fff;}
.ri:last-child{border-bottom:none;}
.ri-en{font-size:12px;color:#1a1814;flex:1;}
.ri-score{font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;flex-shrink:0;background:#fff1f2;color:#dc2626;}
.btnbig{width:100%;padding:13px;border-radius:13px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-bottom:8px;border:none;}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.25);}
.btn-purple:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1.5px solid #e8e4dc!important;color:#8a8478;}
.btn-ghost:hover{background:#f5f3ff;}
.final{text-align:center;padding:2.5rem 0;}
</style>
</head>

<div id="app">

<script>
var V=[
// C1 — Desain & Pengajaran
{cat:"C1",rude:"I want you to check my UI design.",id:"Saya mau Anda periksa desain UI saya.",polite:"Professor Shen, would you happen to have some time to provide your valuable feedback on my UI design?"},
{cat:"C1",rude:"Your cross-cultural research is confusing.",id:"Penelitian lintas budaya Anda membingungkan.",polite:"I am highly interested in your cross-cultural research, but I would appreciate some further clarification on a few points."},
{cat:"C1",rude:"Tell me how to use personality types for my team.",id:"Kasih tahu saya cara pakai tipe kepribadian untuk tim saya.",polite:"Could you please guide me on how to effectively integrate personality types into design team formation, based on your expertise?"},
{cat:"C1",rude:"I don't like user-centred design.",id:"Saya tidak suka desain berbasis pengguna.",polite:"While I see the merits of user-centred design, I am curious about how we can balance it with other emerging methodologies."},
{cat:"C1",rude:"Is cognitive psychology really important for design?",id:"Memangnya psikologi kognitif penting buat desain?",polite:"Could you please help me understand how cognitive psychology deeply influences modern emerging technologies?"},

{cat:"C1",rude:"I don't know anything about user interfaces, explain it.",id:"Saya tidak tahu apa-apa soal UI, jelasin dong.",polite:"As I am currently expanding my knowledge in user interface design, could you please suggest the best starting points for my study?"},
// C2 — Jurnal & Publikasi
{cat:"C2",rude:"Publish my paper in your journal.",id:"Terbitkan naskah saya di jurnal Anda.",polite:"I would be honored to submit my manuscript to your journal. Could you please advise if it aligns with the current scope?"},
{cat:"C2",rude:"Why is my paper rejected?",id:"Kenapa tulisan saya ditolak?",polite:"Could you please provide some feedback on how I can improve my paper to meet the high standards of your journal?"},
{cat:"C2",rude:"Review my paper fast.",id:"Tolong tinjau kertas kerja saya dengan cepat.",polite:"I understand you have a demanding schedule, but I would be grateful for any updates on the review timeline when possible."},
{cat:"C2",rude:"Put me in your Smart Science book series.",id:"Masukkan saya ke dalam seri buku Smart Science Anda.",polite:"I have a research proposal that might fit the 'Smart Science, Design, & Technology' series. May I know the submission process?"},
{cat:"C2",rude:"Your journal guidelines are too complicated.",id:"Panduan jurnal Anda ribet banget.",polite:"I want to ensure absolute compliance with the journal's formatting. Could you please clarify a few specific points in the guidelines?"},
{cat:"C2",rude:"Can you make me a co-author?",id:"Bisa jadikan saya penulis pendamping?",polite:"I would be deeply privileged to contribute to your upcoming research project, if there is an opportunity to collaborate."},
{cat:"C2",rude:"I want to see your citation record.",id:"Saya mau lihat rekam jejak sitasi Anda.",polite:"Your extensive publication record is highly inspiring. Which of your key papers should I read first for my thesis?"},
{cat:"C2",rude:"Is your IEEE conference good?",id:"Apakah konferensi IEEE Anda bagus?",polite:"I am highly interested in submitting to the IEEE conference you chair. Could you share the core focus for this year's event?"},
{cat:"C2",rude:"Fix the typo in your journal website.",id:"Betulkan salah ketik di situs jurnal Anda.",polite:"I noticed a small update might be needed on the journal's webpage, and I wanted to quietly bring it to your attention."},
{cat:"C2",rude:"I want to bypass the peer-review.",id:"Saya mau melewati proses peninjauan sejawat.",polite:"I am fully committed to refining my paper through the rigorous peer-review process of your journal."},

{cat:"C3",rude:"Pass me in my PhD viva.",id:"Luluskan saya di ujian doktoral saya.",polite:"I will do my utmost to address all your academic questions and constructive criticisms during my viva examination."},

{cat:"C3",rude:"I didn't read the papers you suggested for the exam.",id:"Saya tidak membaca artikel ilmiah yang Anda sarankan untuk ujian.",polite:"I am currently catching up on the literature you recommended to ensure my theoretical framework is robust."},

  curCat=c;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  document.querySelectorAll(".fb").forEach(function(b){if(b.getAttribute("onclick")==="setCat('"+c+"')")b.classList.add("on");});
  ronde=1;fullRestart();
}
function getFiltered(){return curCat==="ALL"?V.slice():V.filter(function(c){return c.cat===curCat;});}
function fullRestart(){
  var src=getFiltered();deck=shuffle(src);
  cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];
  var lbl=curCat==="ALL"?"Semua kategori":CAT_CFG[curCat]?CAT_CFG[curCat].label:curCat;
  document.getElementById("sub-lbl").textContent=lbl+" · "+deck.length+" kartu";
  document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("fv3").style.display="none";
  document.getElementById("rb").textContent="Ronde "+ronde;
  upStats();showCard();
}
function nextRonde(){ronde++;deck=shuffle(toRev);cp=0;ch=0;cbv=0;idx=0;rev=false;toRev=[];document.getElementById("qv").style.display="";document.getElementById("rv").style.display="none";document.getElementById("rb").textContent="Ronde "+ronde;upStats();showCard();}
function showCard(){
  rev=false;var c=deck[idx];
  var cfg=CAT_CFG[c.cat]||CAT_CFG.C1;
  document.getElementById("card").style.setProperty("--acc",cfg.acc);
  document.getElementById("cn").textContent="#"+(idx+1);
  var ctb=document.getElementById("ctb");ctb.textContent=cfg.label;ctb.style.background=cfg.bg;ctb.style.color=cfg.fg;
  document.getElementById("en-disp").textContent=c.rude;
  document.getElementById("id-disp").textContent="("+c.id+")";
  document.getElementById("ans-polite-txt").textContent=c.polite;
  document.getElementById("ans").style.display="none";
  document.getElementById("tap").style.display="";
  document.getElementById("ba").style.display="none";
  document.getElementById("card").className="card";
  document.getElementById("ctr").textContent=(idx+1)+"/"+deck.length;
  var pct=Math.round(idx/deck.length*100);
  document.getElementById("pb").style.width=pct+"%";
  document.getElementById("pl").textContent=idx+" selesai";
  document.getElementById("pr").textContent=deck.length+" kartu";
}
function reveal(){
  if(rev)return;rev=true;
  document.getElementById("ans").style.display="";
  document.getElementById("tap").style.display="none";
  document.getElementById("ba").style.display="";
  document.getElementById("card").className="card done";
}
function rate(r){
  var c=deck[idx];
  if(r===2)cp++;
  else if(r===1){ch++;c._h=(c._h||0)+1;toRev.push(c);}
  else{cbv++;c._b=(c._b||0)+1;toRev.push(c);}
  upStats();idx++;
  if(idx>=deck.length){showResult();return;}
  showCard();
}
function upStats(){document.getElementById("sp").textContent=cp;document.getElementById("sh").textContent=ch;document.getElementById("sb").textContent=cbv;}
function showResult(){
  document.getElementById("pb").style.width="100%";
  document.getElementById("qv").style.display="none";
  if(toRev.length===0){document.getElementById("fv3").style.display="";return;}
  document.getElementById("rv").style.display="";
  document.getElementById("rp").textContent=cp;document.getElementById("rh").textContent=ch;document.getElementById("rbb").textContent=cbv;
  var pct=Math.round(cp/deck.length*100);
  document.getElementById("ri2").textContent=pct>=90?"🎉":pct>=70?"😊":pct>=50?"😐":"💪";
  document.getElementById("rt").textContent="Ronde "+ronde+" selesai!";
  document.getElementById("rs").textContent=pct>=90?"Hampir sempurna! "+toRev.length+" kartu tersisa.":pct>=70?"Bagus! "+toRev.length+" kartu perlu diulang.":"Semangat! "+toRev.length+" kartu menunggumu.";
  document.getElementById("nb").textContent="Lanjut Ronde "+(ronde+1)+" → "+toRev.length+" kartu";
  var rl=document.getElementById("rl");rl.innerHTML="";
  var belumList=toRev.filter(function(v){return (v._b||0)>0;});
  belumList.sort(function(a,b){return (b._b||0)-(a._b||0);});
  if(belumList.length===0){
    rl.innerHTML="<div style='padding:10px 12px;font-size:12px;color:#8a8478;text-align:center'>Tidak ada yang sulit 🎉</div>";
  } else {
    belumList.forEach(function(v){
      var d=document.createElement("div");d.className="ri";
      var score="<span class='ri-score'>✗"+(v._b||0)+"</span>";
      d.innerHTML="<span class='ri-en'>"+v.rude.substring(0,55)+"…</span>"+score;
      rl.appendChild(d);
    });
  }
  document.getElementById("rlw").style.display="";
}
ronde=1;fullRestart();
</script>
</body>
</html>
